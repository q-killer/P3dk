<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P3dK // FAB ENGINE</title>
    <style>
        /* Cinematic HUD Styling */
        body { margin: 0; overflow: hidden; background: #0a0a0c; color: #00ffcc; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .panel { pointer-events: auto; position: absolute; background: rgba(10, 10, 12, 0.85); border: 1px solid #333; padding: 15px; backdrop-filter: blur(4px); }
        
        /* The Pantheon Workbench */
        #left-tools { top: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; min-width: 180px; }
        .tool-btn { background: #111; color: #00ffcc; border: 1px solid #00ffcc; padding: 8px 12px; cursor: pointer; text-align: left; font-weight: bold; transition: all 0.2s; }
        .tool-btn:hover { background: #00ffcc; color: #111; box-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
        
        /* The Vitruvian HUD */
        #right-hud { top: 20px; right: 20px; min-width: 250px; text-align: right; border-right: 3px solid #00ffcc; }
        .hud-title { margin: 0 0 10px 0; font-size: 1.2rem; letter-spacing: 2px; }
        .stat-line { margin: 5px 0; font-size: 0.9rem; color: #aaa; }
        .highlight { color: #fff; }
        
        /* Revenue Traps */
        .tip-jar { margin-top: 20px; border-top: 1px solid #333; padding-top: 15px; }
        .tip-btn { color: #ff00ff; text-decoration: none; border: 1px solid #ff00ff; padding: 8px 15px; display: inline-block; text-align: center; font-weight: bold; transition: all 0.2s; }
        .tip-btn:hover { background: #ff00ff; color: #111; }
    </style>
</head>
<body>
    <canvas id="p3dk-canvas"></canvas>

    <div id="ui-layer">
        
        <div id="left-tools" class="panel">
            <button class="tool-btn" id="btn-cleaver">⊘ Occam Cleaver</button>
            <button class="tool-btn" id="btn-hammer">⍑ Vulcan Hammer</button>
            <button class="tool-btn" id="btn-punch">⊙ Archimedes Punch</button>
            <button class="tool-btn" id="btn-rasp">∿ Shiva Rasp</button>
            <button class="tool-btn" id="btn-net">▧ Indra's Net</button>
        </div>

        <div id="right-hud" class="panel">
            <h2 class="hud-title">P3dK // CORE</h2>
            <div class="stat-line" id="status-log">Σ SYSTEM READY</div>
            <div class="stat-line" id="mesh-stats">Δ 0 TRIS [0 FILES]</div>
            <div class="stat-line" id="vitruvian-readout" style="display:none; color: #00ffcc; margin-top: 10px;">
                </div>
            
            <div class="tip-jar">
                <button class="tool-btn" id="btn-export" style="width: 100%; text-align: center; margin-bottom: 10px; color: #fff; border-color: #fff;">⭳ EXPORT STL</button>
                <a href="https://ko-fi.com/YOUR_KOFI_LINK" target="_blank" class="tip-btn" style="width: 85%;">☕ Support the Dev</a>
            </div>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
