<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PEAK // CAD v6 - AI</title>
<style>
  :root{--bg:#03050a;--cy:#00ffcc;--mg:#ff00ff;--mut:#8892b0;--drk:#0f141e}
  *{box-sizing:border-box}
  body,html{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#f0f0f5;
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
  canvas{position:absolute;inset:0;width:100vw;height:100vh;z-index:1}
  
  /* Console / Log */
  #con{position:absolute;top:env(safe-area-inset-top,8px);left:10px;
    width:320px;z-index:20;background:rgba(5,8,15,.9);backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:9px 13px;pointer-events:none}
  .logo{font-weight:800;letter-spacing:2px;font-size:.8rem;margin-bottom:4px}
  .logo span{color:var(--cy)}
  #feed{height:130px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
  .ln{font-family:ui-monospace,Menlo,monospace;font-size:.62rem;color:var(--mut);line-height:14px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .er{color:#ff3366!important}.ok{color:#00ff88!important;font-weight:700}
  .hi{color:var(--cy)!important;font-weight:700}.wn{color:#ffaa00!important}
  
  /* AI Prompt Panel */
  #ai-pan{position:absolute;top:env(safe-area-inset-top,8px);right:10px;
    width:320px;z-index:20;background:rgba(15,20,30,.85);backdrop-filter:blur(22px);
    border:1px solid rgba(255,0,255,.3);border-radius:12px;padding:12px;}
  .inp{width:100%;background:#000;border:1px solid rgba(255,255,255,.1);color:#fff;
    border-radius:6px;padding:8px;font-size:.7rem;margin-bottom:8px;outline:none;font-family:inherit}
  .inp:focus{border-color:var(--mg)}
  textarea.inp{resize:vertical;min-height:60px}
  .ai-btn{width:100%;background:rgba(255,0,255,.15);color:var(--mg);border:1px solid rgba(255,0,255,.4);
    border-radius:6px;padding:8px;font-weight:700;font-size:.7rem;cursor:pointer}
  .ai-btn:active:not(:disabled){background:var(--mg);color:#fff}
  .ai-btn:disabled{opacity:.4;cursor:wait;filter:grayscale(1)}

  /* Tests & Editor Panel */
  #pan{position:absolute;bottom:env(safe-area-inset-bottom,10px);left:50%;transform:translateX(-50%);
    width:95vw;max-width:460px;z-index:20;background:rgba(15,20,30,.72);backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px}
  .t{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--mut);
    margin-bottom:7px;font-weight:600}
  .b{display:block;width:100%;background:rgba(0,255,204,.1);color:var(--cy);
    border:1px solid rgba(0,255,204,.3);border-radius:8px;padding:9px;margin-bottom:5px;
    font-weight:600;font-size:.76rem;cursor:pointer;text-align:left}
  .b:active:not(:disabled){background:var(--cy);color:#000}
  .b:disabled{opacity:.4;cursor:wait;filter:grayscale(1)}
  #cd{background:#000;border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:8px;
    font-family:ui-monospace,monospace;font-size:.6rem;color:#889;height:80px;overflow-y:auto;
    white-space:pre-wrap;margin-top:5px;outline:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="con">
  <div class="logo">PEAK<span>//</span> CAD v6</div>
  <div id="feed"><div class="ln hi">Persistent caching & LLM enabled.</div></div>
</div>

<div id="ai-pan">
  <div class="t" style="color:var(--mg)">AI Co-Pilot (Gemini)</div>
  <input type="password" id="ai-key" class="inp" placeholder="Paste Gemini API Key here...">
  <textarea id="ai-prompt" class="inp" placeholder="e.g. Design a hex nut for an M8 bolt..."></textarea>
  <button class="ai-btn" id="btn-generate">Generate / Modify Shape</button>
</div>

<div id="pan">
  <div class="t">Acceptance Ladder</div>
  <button class="b" id="t1">1 · cube(10) — proves kernel</button>
  <button class="b" id="t3">2 · BOSL2 chamfered cuboid</button>
  <button class="b" id="t4">3 · sphere + 2 chamfered holes</button>
  <div class="t" style="margin-top:10px">Current Code</div>
  <textarea id="cd" spellcheck="false">// Code appears here...</textarea>
  <button class="b" id="btn-run" style="margin-top:5px;text-align:center">▶ RUN CODE</button>
</div>

<script type="module">
import * as THREE        from 'https://esm.sh/three@0.160.0';
import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { STLLoader }     from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/STLLoader.js';

const SOURCES = [
  { name:'npm openscad-wasm', url:'https://cdn.jsdelivr.net/npm/openscad-wasm@0.0.4/openscad.js', pick:m=>m.createOpenSCAD, wrap:true },
  { name:'raw.githack', url:'https://raw.githack.com/q-killer/P3dK/main/wasm/openscad.js', pick:m=>m.default||m.OpenSCAD||Object.values(m).find(v=>typeof v==='function'), wrap:false }
];

const BOSL2 = ['affine.scad','attachments.scad','beziers.scad','builtins.scad','color.scad',
 'comparisons.scad','constants.scad','coords.scad','distributors.scad','drawing.scad',
 'geometry.scad','linalg.scad','lists.scad','masks.scad','math.scad','miscellaneous.scad',
 'partitions.scad','paths.scad','regions.scad','rounding.scad','shapes2d.scad','shapes3d.scad',
 'skin.scad','std.scad','strings.scad','structs.scad','transforms.scad','trigonometry.scad',
 'utility.scad','vectors.scad','version.scad','vnf.scad'];
const BOSL2_URL = 'https://cdn.jsdelivr.net/gh/BelfrySCAD/BOSL2@master/';

const $ = id => document.getElementById(id);
const UI = {
  log(m,c=''){ const f=$('feed'),e=document.createElement('div');
    e.className='ln '+c; e.textContent=m; f.appendChild(e);
    while(f.children.length>9) f.removeChild(f.firstChild); },
  code(t){ $('cd').value=t; },
  getCode(){ return $('cd').value; },
  busy(b){ 
    document.querySelectorAll('.b, .ai-btn').forEach(x=>x.disabled=b); 
    $('cd').disabled=b; $('ai-prompt').disabled=b;
  }
};

/* ── VIEWER ─────────────────────────────────────────────────────────────── */
const V = {
  init(){
    this.s=new THREE.Scene(); this.s.fog=new THREE.FogExp2(0x03050a,.01);
    this.c=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,2000);
    this.c.position.set(80,80,100);
    this.r=new THREE.WebGLRenderer({canvas:$('cv'),antialias:true});
    this.r.setSize(innerWidth,innerHeight);
    this.r.setPixelRatio(Math.min(devicePixelRatio,2));
    this.r.toneMapping=THREE.ACESFilmicToneMapping;
    this.o=new OrbitControls(this.c,this.r.domElement);
    this.o.enableDamping=true; this.o.autoRotate=true; this.o.autoRotateSpeed=1.2;
    this.s.add(new THREE.GridHelper(300,30,0x111111,0x0a0a0a));
    this.s.add(new THREE.AmbientLight(0xffffff,.6));
    const k=new THREE.DirectionalLight(0x00ffcc,3.5); k.position.set(40,60,40);
    const f=new THREE.DirectionalLight(0xff00ff,1.8); f.position.set(-40,-10,-40);
    this.s.add(k,f);
    addEventListener('resize',()=>{ this.c.aspect=innerWidth/innerHeight;
      this.c.updateProjectionMatrix(); this.r.setSize(innerWidth,innerHeight); });
    const loop=()=>{ requestAnimationFrame(loop); this.o.update(); this.r.render(this.s,this.c); };
    loop();
  },
  set(g){
    if(this.m){ this.m.geometry.dispose(); this.s.remove(this.m); }
    g.computeBoundingBox();
    const c=new THREE.Vector3(); g.boundingBox.getCenter(c);
    g.translate(-c.x,-c.y,-c.z); g.computeVertexNormals(); g.computeBoundingSphere();
    this.m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({
      color:0x1a2030,metalness:.55,roughness:.35,polygonOffset:true,polygonOffsetFactor:1}));
    this.m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),
      new THREE.LineBasicMaterial({color:0x00ffcc,transparent:true,opacity:.35})));
    this.m.rotation.x=-Math.PI/2;
    this.s.add(this.m);
    const rad=(g.boundingSphere&&g.boundingSphere.radius)||30;
    this.c.position.set(rad*1.9,rad*1.9,rad*2.3);
    this.o.target.set(0,0,0); this.o.update();
  }
};
V.init();

/* ── LLM INTEGRATION ────────────────────────────────────────────────────── */
const LLM = {
  async ask(prompt, currentCode) {
    const key = $('ai-key').value.trim();
    if(!key) throw new Error("Please provide a Gemini API Key.");
    
    // Construct the context. If there is code, we ask to modify it.
    const hasCode = currentCode && currentCode.length > 10;
    const sys = "You are an expert OpenSCAD & BOSL2 mechanical engineer. Output ONLY raw OpenSCAD code. No explanations. No markdown fences. Ensure <BOSL2/std.scad> is included if using BOSL2 features.";
    const user = hasCode 
      ? `Modify the following OpenSCAD code:\n\n${currentCode}\n\nUser Request: ${prompt}`
      : `Write OpenSCAD code for the following request: ${prompt}`;

    UI.log("Querying LLM...", "mg");
    
    // Call Gemini API natively
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        systemInstruction: { parts: [{text: sys}] },
        contents: [{ parts: [{text: user}] }]
      })
    });

    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    if(!data.candidates || !data.candidates.length) throw new Error("No response from LLM");
    
    let text = data.candidates[0].content.parts[0].text.trim();
    // Scrub formatting if the LLM ignores the system prompt
    text = text.replace(/^```[a-z]*\n/i, '').replace(/\n```$/i, '');
    
    UI.log("Code generated! Rerunning...", "ok");
    return text;
  }
};

/* ── CAD & CACHE ────────────────────────────────────────────────────────── */
const Cad = {
  factory:null, wrap:false, bosl2:null, flags:null, out:'', err:'',

  _opts(){ return {
    noInitialRun:true, noExitRuntime:true,
    print:    t=>{ this.out+=t+'\n'; },
    printErr: t=>{ 
      const skip = ['Could not initialize localization', 'WARNING: Ignoring request to enable unknown feature', 'Fontconfig', 'libpng'];
      if(skip.some(s => t.includes(s))) return;
      this.err+=t+'\n'; console.warn('[scad:err]',t); 
    }
  }; },

  async initFactory(){
    if(this.factory) return;
    for(const s of SOURCES){
      UI.log(`↓ Loading Kernel...`);
      try{
        const mod = await import(/* @vite-ignore */ s.url);
        const f = s.pick(mod);
        if(!f) throw new Error('no factory export');
        this.factory = f; this.wrap = s.wrap;
        UI.log('FACTORY READY', 'ok');
        return;
      }catch(e){
        UI.log(`   ✗ ${e.message}`, 'er');
      }
    }
    throw new Error('No kernel could be loaded.');
  },

  /* 🚨 NEW CACHING IMPLEMENTATION: Uses browser Cache API */
  async initBOSL2(){
    if(this.bosl2) return;
    UI.log(`Checking local cache for BOSL2...`);
    
    const cache = await caches.open('bosl2-v1');
    const mem = {};
    let count = 0;

    for (const f of BOSL2) {
      const url = BOSL2_URL + f;
      let res = await cache.match(url);
      
      if (!res) {
        // Not in cache, fetch and store it
        res = await fetch(url);
        if (res.ok) await cache.put(url, res.clone());
      }
      
      if (res && res.ok) {
        mem[f] = new Uint8Array(await res.arrayBuffer());
        count++;
      } else {
        UI.log(`   ✗ ${f} failed to load`, 'er');
      }
    }

    if(count < BOSL2.length) throw new Error(`BOSL2 incomplete: ${count}/${BOSL2.length}`);
    this.bosl2 = mem;
    UI.log(`BOSL2 LOADED (${count}/${BOSL2.length})`, 'ok');
  },

  async _fresh(needBosl){
    const inst = this.wrap
      ? (await this.factory(this._opts())).getInstance()
      :  await this.factory(this._opts());
    if(!inst || !inst.FS) throw new Error('instance has no FS');

    if(needBosl){
      try{ inst.FS.mkdir('/BOSL2'); }catch{}
      for(const [name,bytes] of Object.entries(this.bosl2))
        inst.FS.writeFile('/BOSL2/'+name, bytes);
    }
    return inst;
  },

  _attempt(inst, args){
    this.out=''; this.err='';
    let abort=null;
    try{ inst.callMain([...args]); }
    catch(e){ if(!(e && e.name==='ExitStatus' && e.status===0)) abort=e; }

    let stl=null;
    try{ stl = inst.FS.readFile('/out.stl'); }catch{}
    if(stl && stl.length) return stl;

    const diag=(this.err||'').trim();
    const ptr=(abort && abort.status !== undefined) ? ` (exit ${abort.status})` : '';
    const e=new Error(diag ? diag.split('\n')[0] : `Build failed${ptr}, no STL generated`);
    e.diag=diag;
    throw e;
  },

  async run(scad){
    const needBosl = scad.includes('BOSL2');
    await this.initFactory();
    if(needBosl) await this.initBOSL2();

    const S = [
      { tag:'manifold', args:['--enable=manifold','/in.scad','-o','/out.stl'] },
      { tag:'minimal',  args:['/in.scad','-o','/out.stl'] } 
    ];
    const list = this.flags ? [this.flags] : S;

    let last=null;
    for(const s of list){
      await new Promise(r=>setTimeout(r,10));
      let inst;
      try{ inst = await this._fresh(needBosl); }
      catch(e){ last=e; UI.log(`   boot failed: ${e.message}`,'er'); continue; }
      inst.FS.writeFile('/in.scad', scad);

      try{
        const stl = this._attempt(inst, s.args); 
        if(!this.flags){ this.flags=s; }
        UI.log(`STL ${(stl.length/1024).toFixed(1)} KB`,'ok');
        return new STLLoader().parse(stl.slice().buffer);
      }catch(e){
        last=e;
        UI.log(`   [${s.tag}] ${e.message}`,'wn');
        if(e.diag) break; 
      }
    }
    throw last || new Error('compile failed');
  }
};

/* ── CONTROLLERS ────────────────────────────────────────────────────────── */
async function buildCurrentCode(){
  const scad = UI.getCode();
  if(!scad.trim()) return;
  UI.busy(true);
  try{
    V.set(await Cad.run(scad));
    UI.log('MESH RENDERED ✓','ok');
  }catch(e){
    UI.log(String(e.message).split('\n')[0],'er');
    console.error(e,'\n--stderr--\n',Cad.err);
  }
  UI.busy(false);
}

// Tests
const SRC = {
  t1:'cube(10);',
  t3:'include <BOSL2/std.scad>\ncuboid([20,20,20], chamfer=2);',
  t4:'include <BOSL2/std.scad>\ndifference() {\n  sphere(d=76.2);\n  zcyl(d=10, h=100, chamfer=2);\n  xcyl(d=12, h=100, chamfer=2);\n}'
};
$('t1').onclick = () => { UI.code(SRC.t1); buildCurrentCode(); };
$('t3').onclick = () => { UI.code(SRC.t3); buildCurrentCode(); };
$('t4').onclick = () => { UI.code(SRC.t4); buildCurrentCode(); };
$('btn-run').onclick = buildCurrentCode;

// LLM Controller
$('btn-generate').onclick = async () => {
  const prompt = $('ai-prompt').value.trim();
  if(!prompt) return UI.log("Please enter a prompt.", "er");
  
  UI.busy(true);
  try {
    const currentCode = UI.getCode();
    const newCode = await LLM.ask(prompt, currentCode);
    UI.code(newCode);
    await buildCurrentCode();
  } catch(e) {
    UI.log(e.message, "er");
    console.error("LLM Error:", e);
  }
  UI.busy(false);
};
</script>
</body>
</html>
