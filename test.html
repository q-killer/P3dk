<style>
  :root{--bg:#03050a;--cy:#00ffcc;--mg:#ff00ff;--mut:#8892b0;--drk:#0f141e}

<body>
<canvas id="cv"></canvas>
<div id="con">
  <div class="logo">PEAK<span>//</span> CAD v14</div>
  <div id="feed"><div class="ln hi">Custom NLP Lexer Initialized. 0MB RAM.</div></div>
</div>

<div id="ai-pan">
  <div class="t" style="color:var(--cy)">Language-to-CAD Lexer</div>
  <div class="t" style="color:var(--mut); font-size:0.55rem; text-transform:none; margin-top:-4px; margin-bottom:8px">
    Instant offline processing. No crashing.
  </div>
  <textarea id="ai-prompt" class="inp" placeholder="e.g. Draw a 30 mm sphere with an 8 mm hole through the center"></textarea>
  
  <div id="bridge-container" style="display:none;">

    <div id="bridge-data"></div>
  </div>

  <button class="ai-btn" id="btn-generate">Generate Shape</button>
</div>

<div id="pan">
  <div class="t">Current Code</div>
  <textarea id="cd" spellcheck="false">// Code appears here...</textarea>
  <button class="b" id="btn-run" style="margin-top:5px;text-align:center">▶ RUN MANUAL EDITS</button>
</div>

<script type="module">
import * as THREE        from 'https://esm.sh/three@0.160.0';
import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { STLLoader }     from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/STLLoader.js';

const SOURCES = [
  { name:'npm openscad-wasm', url:'https://cdn.jsdelivr.net/npm/openscad-wasm@0.0.4/openscad.js', pick:m=>m.createOpenSCAD, wrap:true },
  { name:'raw.githack', url:'https://raw.githack.com/q-killer/P3dK/main/wasm/openscad.js', pick:m=>m.default||m.OpenSCAD||Object.values(m).find(v=>typeof v==='function'), wrap:false }
];

const BOSL2 = ['affine.scad','attachments.scad','beziers.scad','builtins.scad','color.scad',
 'comparisons.scad','constants.scad','coords.scad','distributors.scad','drawing.scad',
 'geometry.scad','linalg.scad','lists.scad','masks.scad','math.scad','miscellaneous.scad',
 'partitions.scad','paths.scad','regions.scad','rounding.scad','shapes2d.scad','shapes3d.scad',
 'skin.scad','std.scad','strings.scad','structs.scad','transforms.scad','trigonometry.scad',
 'utility.scad','vectors.scad','version.scad','vnf.scad'];
const BOSL2_URL = 'https://cdn.jsdelivr.net/gh/BelfrySCAD/BOSL2@master/';

const $ = id => document.getElementById(id);
const UI = {
  log(m,c=''){ const f=$('feed'),e=document.createElement('div');
    e.className='ln '+c; e.textContent=m; f.appendChild(e);
    while(f.children.length>7) f.removeChild(f.firstChild); },
  code(t){ $('cd').value=t; },
  getCode(){ return $('cd').value; },
  busy(b){ 
    document.querySelectorAll('.b, .ai-btn').forEach(x=>x.disabled=b); 
    $('cd').disabled=b; $('ai-prompt').disabled=b;
  }
};

/* ── VIEWER ─────────────────────────────────────────────────────────────── */
const V = {
  init(){
    this.s=new THREE.Scene(); this.s.fog=new THREE.FogExp2(0x03050a,.01);
    this.c=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,2000);
    this.c.position.set(80,80,100);
    this.r=new THREE.WebGLRenderer({canvas:$('cv'),antialias:true});
    this.r.setSize(innerWidth,innerHeight);
    this.r.setPixelRatio(Math.min(devicePixelRatio,2));
    this.r.toneMapping=THREE.ACESFilmicToneMapping;
    this.o=new OrbitControls(this.c,this.r.domElement);
    this.o.enableDamping=true; this.o.autoRotate=true; this.o.autoRotateSpeed=1.2;
    this.s.add(new THREE.GridHelper(300,30,0x111111,0x0a0a0a));
    this.s.add(new THREE.AmbientLight(0xffffff,.6));
    const k=new THREE.DirectionalLight(0x00ffcc,3.5); k.position.set(40,60,40);
    const f=new THREE.DirectionalLight(0xff00ff,1.8); f.position.set(-40,-10,-40);
    this.s.add(k,f);
    addEventListener('resize',()=>{ this.c.aspect=innerWidth/innerHeight;
      this.c.updateProjectionMatrix(); this.r.setSize(innerWidth,innerHeight); });
    const loop=()=>{ requestAnimationFrame(loop); this.o.update(); this.r.render(this.s,this.c); };
    loop();
  },
  set(g){
    if(this.m){ this.m.geometry.dispose(); this.s.remove(this.m); }
    g.computeBoundingBox();
    const c=new THREE.Vector3(); g.boundingBox.getCenter(c);
    g.translate(-c.x,-c.y,-c.z); g.computeVertexNormals(); g.computeBoundingSphere();
    this.m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({
      color:0x1a2030,metalness:.55,roughness:.35,polygonOffset:true,polygonOffsetFactor:1}));
    this.m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),
      new THREE.LineBasicMaterial({color:0x00ffcc,transparent:true,opacity:.35})));
    this.m.rotation.x=-Math.PI/2;
    this.s.add(this.m);
    const rad=(g.boundingSphere&&g.boundingSphere.radius)||30;
    this.c.position.set(rad*1.9,rad*1.9,rad*2.3);
    this.o.target.set(0,0,0); this.o.update();
  }
};
V.init();

/* ── LEXER TO COMPILER BRIDGE (The "Dropdown" Architecture) ─────────────── */

// 1. The Lexer: Translates English into structured JSON Data
const Lexer = {
  parse(text) {
    const t = text.toLowerCase();
    
    // Safely extract floats/integers using regex
    const nums = text.match(/\d+(\.\d+)?/g) || [];
    const val1 = parseFloat(nums[0]);
    const val2 = parseFloat(nums[1]);
    
    // Default Dropdown Parameters
    let p = {
      shape: "cuboid",
      size: val1 || 20,
      hasHole: false,
      holeSize: val2 || (val1 ? val1 / 2 : 10),
      chamfer: 0
    };

    // Intent/Noun Matching
    if (t.match(/sphere|ball/)) p.shape = "sphere";
    else if (t.match(/cylinder|tube|rod|shaft/)) p.shape = "cylinder";
    else if (t.match(/nut|hex/)) p.shape = "hex_nut";
    else if (t.match(/plate|sheet|board/)) p.shape = "plate";
    else if (t.match(/ring|washer/)) { p.shape = "cylinder"; p.hasHole = true; }
    
    // Feature Modifiers
    if (t.match(/hole|hollow|through/)) p.hasHole = true;
    if (t.match(/chamfer|bevel|round/)) p.chamfer = p.size * 0.05;
    
    return p;
  }
};

// 2. The Compiler: Translates the JSON Data into perfect OpenSCAD math
const Compiler = {
  generate(p) {
    let c = "include <BOSL2/std.scad>\n$fn = 64; // High resolution\n\n";
    let s = "";

    if (p.shape === "sphere") {
      s = `  sphere(d=${p.size});`;
    } else if (p.shape === "cylinder") {
      s = `  zcyl(d=${p.size}, h=${p.size*2}, chamfer=${p.chamfer});`;
    } else if (p.shape === "hex_nut") {
      s = `  zcyl(d=${p.size*1.5}, h=${p.size/2}, $fn=6);\n  // 6-sided hex nut`;
      p.hasHole = true; 
      if (!p.holeSize || p.holeSize >= p.size*1.5) p.holeSize = p.size * 0.8;
    } else if (p.shape === "plate") {
      s = `  cuboid([${p.size}, ${p.size}, ${p.size * 0.1}], chamfer=${p.chamfer});`;
    } else {
      s = `  cuboid([${p.size}, ${p.size}, ${p.size}], chamfer=${p.chamfer});`;
    }

    if (p.hasHole) {
      c += `difference() {\n`;
      c += s + "\n";
      // Cut a hole 3x the height to guarantee it punches clean through
      c += `  zcyl(d=${p.holeSize}, h=${p.size*3});\n`;
      c += `}\n`;
    } else {
      c += s + "\n";
    }

    return c;
  }
};

/* ── EPHEMERAL CAD KERNEL & CACHING ─────────────────────────────────────── */
const Cad = {
  blobUrl: null, pick: null, wrap: false, bosl2: null, out: '', err: '',

  async initFactory(){
    if (this.blobUrl) return;
    UI.log("↓ Loading JS Wrapper...");
    for (const s of SOURCES) {
      try {
        const res = await fetch(s.url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const js = await res.text();
        this.blobUrl = URL.createObjectURL(new Blob([js], { type: 'text/javascript' }));
        this.pick = s.pick;
        this.wrap = s.wrap;
        UI.log("KERNEL READY", "ok");
        return;
      } catch (e) {
        console.warn("Source failed: " + s.name, e);
      }
    }
    throw new Error("Could not load OpenSCAD JS Wrapper");
  },

  async initBOSL2(){
    if (this.bosl2) return;
    UI.log("Checking local cache for BOSL2...");
    const cache = await caches.open('bosl2-v1');
    const mem = {};
    let count = 0;
    for (const f of BOSL2) {
      const url = BOSL2_URL + f;
      let res = await cache.match(url);
      if (!res) {
        res = await fetch(url);
        if (res.ok) await cache.put(url, res.clone());
      }
      if (res && res.ok) {
        mem[f] = new Uint8Array(await res.arrayBuffer());
        count++;
      }
    }
    if (count < BOSL2.length) throw new Error("BOSL2 incomplete");
    this.bosl2 = mem;
    UI.log("BOSL2 LOADED", "ok");
  },

  async _fresh(needBosl){
    const freshMod = await import(/* @vite-ignore */ this.blobUrl + '#t=' + Date.now());
    const factory = this.pick(freshMod);
    const opts = {
      noInitialRun: true,
      thisProgram: 'openscad',
      print: t => { this.out += t + '\n'; },
      printErr: t => { 
        const skip = ['localization', 'unknown feature', 'Fontconfig', 'libpng'];
        if (skip.some(s => t.includes(s))) return;
        this.err += t + '\n'; console.warn('[scad:err]', t); 
      }
    };
    const inst = this.wrap ? (await factory(opts)).getInstance() : await factory(opts);
    if (!inst || !inst.FS) throw new Error('Instance has no FS');
    if (needBosl) {
      try { inst.FS.mkdir('/BOSL2'); } catch {}
      for (const [name, bytes] of Object.entries(this.bosl2)) {
        inst.FS.writeFile('/BOSL2/'+name, bytes);
      }
    }
    return inst;
  },

  async run(scad){
    const needBosl = scad.includes('BOSL2');
    await this.initFactory();
    if (needBosl) await this.initBOSL2();

    this.out = ''; this.err = '';
    const inst = await this._fresh(needBosl);
    inst.FS.writeFile('/input.scad', scad);

    try {
      inst.callMain(['/input.scad', '-o', '/out.stl', '--enable=manifold']); 
    } catch(e) {
      if (e?.name !== 'ExitStatus') {
        const diag = (this.err || '').trim();
        const err = new Error(diag ? diag.split('\n')[0] : "Build failed, no STL generated");
        err.diag = diag;
        throw err;
      }
    }

    let stl = null;
    try { stl = inst.FS.readFile('/out.stl'); } catch {}
    if (!stl || !stl.length) throw new Error('No STL generated. Check code syntax.');
    
    UI.log("STL " + (stl.length/1024).toFixed(1) + " KB", "ok");
    return new STLLoader().parse(stl.slice().buffer);
  }
};

/* ── CONTROLLERS ────────────────────────────────────────────────────────── */
async function buildCurrentCode(){
  const scad = UI.getCode();
  if(!scad.trim()) return;
  UI.busy(true);
  try{
    V.set(await Cad.run(scad));
    UI.log('MESH RENDERED ✓','ok');
  }catch(e){
    UI.log(String(e.message).split('\n')[0],'er');
    console.error(e,'\n--stderr--\n',Cad.err);
  }
  UI.busy(false);
}

$('btn-run').onclick = buildCurrentCode;

// Bridge Engine Controller
$('btn-generate').onclick = async () => {
  const prompt = $('ai-prompt').value.trim();
  if(!prompt) return UI.log("Please enter a prompt.", "er");
  
  UI.busy(true);
  try {
    UI.log("Lexing human intent...", "hi");
    
    // 1. The Lexer maps the english to Data
    const params = Lexer.parse(prompt);
    
    // Show the Data Bridge visually to the user
    $('bridge-container').style.display = 'block';
    $('bridge-data').innerText = JSON.stringify(params, null, 2);
    
    // 2. The Compiler snaps the math together
    const newCode = Compiler.generate(params);
    
    // Slight delay so the user can see the pipeline working
    await new Promise(r => setTimeout(r, 200));
    
    UI.code(newCode);
    await buildCurrentCode();
  } catch(e) {
    UI.log(e.message, "er");
  }
  UI.busy(false);
};

// Initial test load
setTimeout(() => {
  UI.code("include <BOSL2/std.scad>\ncuboid(10);");
  buildCurrentCode();
}, 500);

</script>
</body>
</html>
