<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PEAK // CAD v5</title>
<style>
  :root{--bg:#03050a;--cy:#00ffcc;--mg:#ff00ff;--mut:#8892b0}
  *{box-sizing:border-box}
  body,html{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#f0f0f5;
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
  canvas{position:absolute;inset:0;width:100vw;height:100vh;z-index:1}
  #con{position:absolute;top:env(safe-area-inset-top,8px);left:50%;transform:translateX(-50%);
    width:95vw;max-width:460px;z-index:20;background:rgba(5,8,15,.9);backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:9px 13px;pointer-events:none}
  .logo{font-weight:800;letter-spacing:2px;font-size:.8rem;margin-bottom:4px}
  .logo span{color:var(--cy)}
  #feed{height:130px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
  .ln{font-family:ui-monospace,Menlo,monospace;font-size:.62rem;color:var(--mut);line-height:14px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .er{color:#ff3366!important}.ok{color:#00ff88!important;font-weight:700}
  .hi{color:var(--cy)!important;font-weight:700}.wn{color:#ffaa00!important}
  #pan{position:absolute;bottom:env(safe-area-inset-bottom,10px);left:50%;transform:translateX(-50%);
    width:95vw;max-width:460px;z-index:20;background:rgba(15,20,30,.72);backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px}
  .t{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--mut);
    margin-bottom:7px;font-weight:600}
  .b{display:block;width:100%;background:rgba(0,255,204,.1);color:var(--cy);
    border:1px solid rgba(0,255,204,.3);border-radius:8px;padding:9px;margin-bottom:5px;
    font-weight:600;font-size:.76rem;cursor:pointer;text-align:left}
  .b:active:not(:disabled){background:var(--cy);color:#000}
  .b:disabled{opacity:.4;cursor:wait;filter:grayscale(1)}
  .b.m{background:rgba(255,0,255,.1);color:var(--mg);border-color:rgba(255,0,255,.4)}
  .b.m:active:not(:disabled){background:var(--mg);color:#fff}
  #cd{background:#000;border-radius:6px;padding:8px;font-family:ui-monospace,monospace;
    font-size:.6rem;color:#889;height:56px;overflow-y:auto;white-space:pre-wrap;margin-top:5px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="con">
  <div class="logo">PEAK<span>//</span> CAD v5</div>
  <div id="feed"><div class="ln hi">Fresh kernel per build — fixes the 2nd-click abort.</div></div>
</div>
<div id="pan">
  <div class="t">Acceptance Ladder</div>
  <button class="b" id="t1">1 · cube(10) — proves kernel</button>
  <button class="b" id="t2">2 · rebuild — proves noExitRuntime</button>
  <button class="b m" id="t3">3 · BOSL2 chamfered cuboid</button>
  <button class="b m" id="t4">4 · sphere + 2 chamfered holes</button>
  <button class="b" id="t0">0 · version probe (optional)</button>
  <div id="cd">// source appears here</div>
</div>

<script type="module">
import * as THREE        from 'https://esm.sh/three@0.160.0';
import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { STLLoader }     from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/STLLoader.js';

/* ═══════════════════════════════════════════════════════════════════════════
   THE REAL BUG — found by reading openscad-wasm's OWN wrapper source.
   Its canonical renderToStl() is:

       instance.callMain(["/input.scad", "-o", "/output.stl"]);

   NO --enable=manifold. NO -I. This build ABORTS DURING ARGUMENT PARSING on
   unrecognized flags — which happens BEFORE any output is written, so stderr
   is EMPTY and Emscripten throws only a raw pointer. That is precisely why
   every failure read "C++ abort (ptr …), no stderr" — even for cube(10).

   (Gemini was right to drop -I. I was wrong to insist on it.)

   THEREFORE:
     • Default args are MINIMAL — exactly what the library itself uses.
     • Extra flags are ESCALATED optionally and retried away on ANY abort,
       never keyed off stderr (which is empty for arg-parse aborts).
     • BOSL2 is mounted at /BOSL2 (root). Since /in.scad lives at /, the
       include <BOSL2/std.scad> resolves relatively — no -I needed.
   ═══════════════════════════════════════════════════════════════════════════ */

const SOURCES = [
  { name:'npm openscad-wasm@0.0.4 (2025, wasm embedded)',
    url:'https://cdn.jsdelivr.net/npm/openscad-wasm@0.0.4/openscad.js',
    pick:m=>m.createOpenSCAD, wrap:true },            // NAMED export; .default is undefined
  { name:'your repo (raw.githack)',
    url:'https://raw.githack.com/q-killer/P3dK/main/wasm/openscad.js',
    pick:m=>m.default||m.OpenSCAD||Object.values(m).find(v=>typeof v==='function'), wrap:false },
  { name:'ochafik (legacy)',
    url:'https://ochafik.com/openscad/openscad.js',
    pick:m=>m.default||m.OpenSCAD||Object.values(m).find(v=>typeof v==='function'), wrap:false }
];

/* Exact transitive closure of `include <BOSL2/std.scad>` — 32 files, verified by
   recursively parsing every include in the real repo. Confirmed mounting 32/32. */
const BOSL2 = ['affine.scad','attachments.scad','beziers.scad','builtins.scad','color.scad',
 'comparisons.scad','constants.scad','coords.scad','distributors.scad','drawing.scad',
 'geometry.scad','linalg.scad','lists.scad','masks.scad','math.scad','miscellaneous.scad',
 'partitions.scad','paths.scad','regions.scad','rounding.scad','shapes2d.scad','shapes3d.scad',
 'skin.scad','std.scad','strings.scad','structs.scad','transforms.scad','trigonometry.scad',
 'utility.scad','vectors.scad','version.scad','vnf.scad'];
const BOSL2_URL = 'https://cdn.jsdelivr.net/gh/BelfrySCAD/BOSL2@master/';

const $ = id => document.getElementById(id);
const UI = {
  log(m,c=''){ const f=$('feed'),e=document.createElement('div');
    e.className='ln '+c; e.textContent=m; f.appendChild(e);
    while(f.children.length>9) f.removeChild(f.firstChild); },
  code(t){ $('cd').textContent=t; },
  busy(b){ document.querySelectorAll('.b').forEach(x=>x.disabled=b); }
};

/* ── VIEWER ─────────────────────────────────────────────────────────────── */
const V = {
  init(){
    this.s=new THREE.Scene(); this.s.fog=new THREE.FogExp2(0x03050a,.01);
    this.c=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,2000);
    this.c.position.set(80,80,100);
    this.r=new THREE.WebGLRenderer({canvas:$('cv'),antialias:true});
    this.r.setSize(innerWidth,innerHeight);
    this.r.setPixelRatio(Math.min(devicePixelRatio,2));
    this.r.toneMapping=THREE.ACESFilmicToneMapping;
    this.o=new OrbitControls(this.c,this.r.domElement);
    this.o.enableDamping=true; this.o.autoRotate=true; this.o.autoRotateSpeed=1.2;
    this.s.add(new THREE.GridHelper(300,30,0x111111,0x0a0a0a));
    this.s.add(new THREE.AmbientLight(0xffffff,.6));
    const k=new THREE.DirectionalLight(0x00ffcc,3.5); k.position.set(40,60,40);
    const f=new THREE.DirectionalLight(0xff00ff,1.8); f.position.set(-40,-10,-40);
    this.s.add(k,f);
    addEventListener('resize',()=>{ this.c.aspect=innerWidth/innerHeight;
      this.c.updateProjectionMatrix(); this.r.setSize(innerWidth,innerHeight); });
    const loop=()=>{ requestAnimationFrame(loop); this.o.update(); this.r.render(this.s,this.c); };
    loop();
  },
  set(g){
    if(this.m){ this.m.geometry.dispose(); this.s.remove(this.m); }
    g.computeBoundingBox();
    const c=new THREE.Vector3(); g.boundingBox.getCenter(c);
    g.translate(-c.x,-c.y,-c.z); g.computeVertexNormals(); g.computeBoundingSphere();
    this.m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({
      color:0x1a2030,metalness:.55,roughness:.35,polygonOffset:true,polygonOffsetFactor:1}));
    this.m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),
      new THREE.LineBasicMaterial({color:0x00ffcc,transparent:true,opacity:.35})));
    this.m.rotation.x=-Math.PI/2;                    // STL is Z-up
    this.s.add(this.m);
    const rad=(g.boundingSphere&&g.boundingSphere.radius)||30;
    this.c.position.set(rad*1.9,rad*1.9,rad*2.3);
    this.o.target.set(0,0,0); this.o.update();
  }
};
V.init();

/* ── CAD ────────────────────────────────────────────────────────────────── */
const Cad = {
  factory:null,        // the imported WASM factory — cached (import once)
  wrap:false,          // does the factory return a {getInstance()} wrapper?
  srcName:'',
  bosl2:null,          // BOSL2 file BYTES cached in RAM — fetched once
  flags:null,          // discovered-good arg set
  out:'', err:'',

  _opts(){ return {
    noInitialRun:true, noExitRuntime:true,
    print:    t=>{ this.out+=t+'\n'; console.log('[scad]',t); },
    printErr: t=>{ this.err+=t+'\n'; console.warn('[scad:err]',t); }
  }; },

  /* Import the factory ONCE. The 13.6MB module is cached by the browser, so
     re-instantiating later is fast (no re-download). */
  async initFactory(){
    if(this.factory) return;
    for(const s of SOURCES){
      UI.log(`↓ ${s.name}`);
      try{
        const mod = await import(/* @vite-ignore */ s.url);
        const f = s.pick(mod);
        if(!f) throw new Error('no factory export');
        this.factory = f; this.wrap = s.wrap; this.srcName = s.name;
        UI.log('FACTORY READY', 'ok');
        return;
      }catch(e){
        UI.log(`   ✗ ${e.message}`, 'er');
        console.error(`[${s.name}]`, e);
      }
    }
    throw new Error('No kernel could be loaded.');
  },

  /* Fetch BOSL2 bytes ONCE, keep them in RAM. They get re-mounted into every
     fresh instance (cheap — it's just FS.writeFile from memory). */
  async initBOSL2(){
    if(this.bosl2) return;
    UI.log(`Fetching BOSL2 (${BOSL2.length} files)…`);
    const got = await Promise.all(BOSL2.map(async f=>{
      const r = await fetch(BOSL2_URL+f);
      if(!r.ok){ UI.log(`   ✗ ${f} → ${r.status}`,'er'); return null; }
      return [f, new Uint8Array(await r.arrayBuffer())];
    }));
    const cache = {};
    let n=0;
    for(const h of got){ if(h){ cache[h[0]] = h[1]; n++; } }
    if(n < BOSL2.length) throw new Error(`BOSL2 incomplete: ${n}/${BOSL2.length}`);
    this.bosl2 = cache;
    UI.log(`BOSL2 CACHED (${n}/${BOSL2.length})`, 'ok');
  },

  /* ═══════════════════════════════════════════════════════════════════════
     A FRESH INSTANCE PER BUILD — this is the fix for the "second click aborts"
     bug. OpenSCAD's main() is NOT re-entrant: its global C++ state is dirty
     after one run, so a second callMain() on the same instance abort()s.
     noExitRuntime keeps the RUNTIME alive but does NOT reset OpenSCAD itself.
     So we throw the instance away and boot a clean one every time.
     (Gemini's "ephemeral kernel" instinct was correct.)
     ═══════════════════════════════════════════════════════════════════════ */
  async _fresh(needBosl){
    const inst = this.wrap
      ? (await this.factory(this._opts())).getInstance()
      :  await this.factory(this._opts());
    if(!inst || !inst.FS) throw new Error('instance has no FS');

    if(needBosl){
      // Mount at ROOT: /in.scad lives at /, so `include <BOSL2/std.scad>`
      // resolves relatively. NO -I flag — passing -I with a missing dir was
      // what aborted every earlier build.
      try{ inst.FS.mkdir('/BOSL2'); }catch{}
      for(const [name,bytes] of Object.entries(this.bosl2))
        inst.FS.writeFile('/BOSL2/'+name, bytes);
    }
    return inst;
  },

  _attempt(inst, args){
    this.out=''; this.err='';
    let abort=null;
    try{ inst.callMain(args); }
    catch(e){ if(!(e && e.name==='ExitStatus' && e.status===0)) abort=e; }

    let stl=null;
    try{ stl = inst.FS.readFile('/out.stl'); }catch{}
    if(stl && stl.length) return stl;

    const diag=(this.err||'').trim();
    const ptr=(typeof abort==='number')?` (ptr ${abort})`:'';
    const e=new Error(diag ? diag.split('\n')[0] : `abort${ptr}, no stderr`);
    e.diag=diag;
    throw e;
  },

  async run(scad){
    const needBosl = scad.includes('BOSL2');
    await this.initFactory();
    if(needBosl) await this.initBOSL2();

    const S = [
      { tag:'manifold', args:['--enable=manifold','/in.scad','-o','/out.stl'] },
      { tag:'minimal',  args:['/in.scad','-o','/out.stl'] }   // canonical fallback
    ];
    const list = this.flags ? [this.flags] : S;

    let last=null;
    for(const s of list){
      // A FRESH INSTANCE FOR EVERY ATTEMPT. A failed callMain leaves OpenSCAD's
      // C++ globals dirty, so even the retry needs virgin state.
      UI.log(`Booting kernel [${s.tag}]…`);
      await new Promise(r=>setTimeout(r,10));
      let inst;
      try{ inst = await this._fresh(needBosl); }
      catch(e){ last=e; UI.log(`   boot failed: ${e.message}`,'er'); continue; }
      inst.FS.writeFile('/in.scad', scad);

      try{
        const stl = this._attempt(inst, s.args);
        if(!this.flags){ this.flags=s; UI.log(`args OK: ${s.tag}`,'ok'); }
        UI.log(`STL ${(stl.length/1024).toFixed(1)} KB`,'ok');
        return new STLLoader().parse(stl.slice().buffer);
      }catch(e){
        last=e;
        UI.log(`   [${s.tag}] ${e.message}`,'wn');
        if(e.diag) break;   // a REAL scad error (assert/syntax) — don't cycle args
      }
    }
    if(last && last.diag && /requires OpenSCAD version/i.test(last.diag))
      throw new Error('BOSL2 assert: engine older than 2021.01');
    throw last || new Error('compile failed');
  }
};

/* ── TESTS ──────────────────────────────────────────────────────────────── */
const SRC = {
  t1:'cube(10);',
  t3:'include <BOSL2/std.scad>\ncuboid([20,20,20], chamfer=2);',
  t4:'include <BOSL2/std.scad>\ndifference() {\n  sphere(d=76.2);\n  zcyl(d=10, h=100, chamfer=6);\n  xcyl(d=12, h=100, chamfer=6);\n}'
};

async function run(scad, bosl){
  UI.busy(true); UI.code(scad);
  try{
    V.set(await Cad.run(scad));
    UI.log('MESH RENDERED ✓','ok');
  }catch(e){
    UI.log(String(e.message).split('\n')[0],'er');
    console.error(e,'\n--stderr--\n',Cad.err,'\n--stdout--\n',Cad.out);
  }
  UI.busy(false);
}

$('t1').onclick = () => run(SRC.t1,false);
$('t2').onclick = () => run(SRC.t1,false);
$('t3').onclick = () => run(SRC.t3,true);
$('t4').onclick = () => run(SRC.t4,true);

/* Optional: version probe. Uses MINIMAL args (a bogus -o suffix or an unknown
   flag would abort during arg parsing and tell us nothing). */
$('t0').onclick = async () => {
  UI.busy(true); UI.code('echo(version());  // minimal args only');
  try{
    await Cad.initFactory();
    const inst = await Cad._fresh(false);
    Cad.out=''; Cad.err='';
    inst.FS.writeFile('/v.scad','echo(str("VER=",version_num()));\ncube(1);');
    try{ inst.callMain(['/v.scad','-o','/v.stl']); }catch(e){}
    const raw = Cad.out + Cad.err;
    console.log('[version probe raw]', JSON.stringify(raw));
    const m = raw.match(/VER=(\d+)/);
    if(m){
      const v = parseInt(m[1],10);
      UI.log(`version_num() = ${v}`, 'hi');
      UI.log(v>=20210100 ? '≥ 2021.01 → BOSL2 supported' : '< 2021.01 → BOSL2 will assert',
             v>=20210100 ? 'ok':'er');
    } else {
      UI.log(raw.trim() ? 'output captured but no VER — see console' : 'no output captured', 'wn');
    }
  }catch(e){ UI.log(e.message,'er'); console.error(e); }
  UI.busy(false);
};
</script>
</body>
</html>
