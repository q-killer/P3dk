    <style>

        .btn.primary-ai:hover:not(:disabled), .btn.primary-ai:active:not(:disabled) { background: var(--magenta); color: #fff; box-shadow: 0 0 20px rgba(255,0,255,0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        /* Segmented Bottom Nav */
        #bottom-nav { position: absolute; bottom: env(safe-area-inset-bottom, 15px); left: 50%; transform: translateX(-50%); width: 240px; background: rgba(5, 8, 15, 0.9); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 30px; display: flex; padding: 6px; z-index: 30; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .nav-tab { flex: 1; background: transparent; color: var(--text-muted); border: none; font-size: 0.75rem; font-weight: 600; padding: 10px 0; border-radius: 24px; cursor: pointer; transition: 0.3s ease; }
        .nav-tab.active { background: rgba(255,255,255,0.1); color: #fff; }

</head>
<body>
    <canvas id="viewer-canvas"></canvas>

    <div id="top-console">
        <div class="logo-row">
            <div class="logo">PEAK<span>//</span></div>
            <div id="status-indicator"></div>
        </div>
        <div id="log-feed">
            <div class="log-line">ENGINE IDLE.</div>
        </div>
        <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div id="tool-island">
        <div id="tool-manual" class="tool-section active">
            <div class="section-title">OpenSCAD Diagnostics</div>
            <button class="btn" id="btn-native">Compile SCAD Primitive</button>
            <button class="btn" id="btn-csg">Compile BOSL2 Boolean</button>
            <div style="margin-top:15px;" class="section-title">SCAD Source Output</div>
            <div class="code-vault" id="code-output">// Source will appear here</div>
        </div>

        <div id="tool-ai" class="tool-section">
            <div class="section-title">WebGPU Spatial Reasoning</div>
            <textarea id="llm-prompt" rows="3" placeholder="E.g. A sphere with a box subtracted from it"></textarea>
            <button class="btn primary-ai" id="btn-llm">✦ Generate & Compile</button>
            <div style="margin-top:15px;" class="section-title">LLM Source Output</div>
            <div class="code-vault" id="ai-code-output">// AI output will appear here</div>
        </div>
    </div>

    <div id="bottom-nav">
        <button class="nav-tab active" data-target="tool-manual">DIAGNOSTICS</button>
        <button class="nav-tab" data-target="tool-ai">AI WORKER</button>
    </div>

    <script type="module">
        import * as THREE from 'https://esm.sh/three@0.160.0';
        import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';
        import { STLLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/STLLoader.js';

        // --- UI CONTROLLER ---
        const UI = {
            log: (msg, isError = false) => {
                const feed = document.getElementById('log-feed');
                const line = document.createElement('div');
                line.className = 'log-line' + (isError ? ' log-error' : '');
                line.innerHTML = msg;
                feed.appendChild(line);
                if (feed.children.length > 2) feed.removeChild(feed.firstChild);
            },
            setWorking: (isWorking) => {
                const dot = document.getElementById('status-indicator');
                if(isWorking) dot.classList.add('working');
                else dot.classList.remove('working');
            },
            setProgress: (pct) => {
                const bar = document.getElementById('progress-bar');
                const fill = document.getElementById('progress-fill');
                if (pct > 0 && pct < 100) {
                    bar.style.display = 'block';
                    fill.style.width = `${pct}%`;
                } else {
                    bar.style.display = 'none';
                }
            },
            setCode: (text, isAI = false) => {
                document.getElementById(isAI ? 'ai-code-output' : 'code-output').innerText = text;
            },
            disableAll: () => { 
                document.querySelectorAll('.btn').forEach(b => b.disabled = true); 
                UI.setWorking(true);
            },
            enableAll: () => { 
                document.querySelectorAll('.btn').forEach(b => b.disabled = false); 
                UI.setWorking(false);
            }
        };

        // --- 3D VIEWER ---
        const Viewer = {
            scene: new THREE.Scene(),
            mesh: null,
            init() {
                this.scene.fog = new THREE.FogExp2(0x03050a, 0.015);
                this.camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 1000);
                this.camera.position.set(35, 45, 55); 
                
                this.renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('viewer-canvas'), antialias: true, alpha: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                
                this.controls = new OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                this.controls.autoRotate = true;
                this.controls.autoRotateSpeed = 1.0;
                
                const grid = new THREE.GridHelper(100, 100, 0x111111, 0x080808);
                grid.position.y = -0.1;
                this.scene.add(grid);
                
                this.scene.add(new THREE.AmbientLight(0xffffff, 0.6));
                
                const keyLight = new THREE.DirectionalLight(0x00ffcc, 4.0);
                keyLight.position.set(20, 40, 20);
                this.scene.add(keyLight);

                const fillLight = new THREE.DirectionalLight(0xff00ff, 2.0);
                fillLight.position.set(-20, -10, -20);
                this.scene.add(fillLight);

                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });

                this.animate = this.animate.bind(this);
                requestAnimationFrame(this.animate);
            },
            setGeometry(geometry) {
                if(this.mesh) { this.mesh.geometry.dispose(); this.scene.remove(this.mesh); }
                
                geometry.computeBoundingBox();
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                geometry.translate(-center.x, -center.y, -center.z);
                geometry.computeVertexNormals();

                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0x1a2030, metalness: 0.6, roughness: 0.3, 
                    polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
                });
                this.mesh = new THREE.Mesh(geometry, mat);
                
                const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geometry), new THREE.LineBasicMaterial({ color: 0x00ffcc, linewidth: 1, transparent: true, opacity: 0.3 }));
                this.mesh.add(edges);
                this.mesh.rotation.x = -Math.PI / 2; // STL Z-up fix
                this.mesh.position.y = 12; 
                
                this.scene.add(this.mesh);
                this.controls.target.set(0, 12, 0);
            },
            animate() {
                requestAnimationFrame(this.animate);
                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }
        };
        Viewer.init();

        // --- OPENSCAD CAD ENGINE (WASM BINARY FIX) ---
        const CadEngine = {
            worker: null,
            async init() {
                if(this.worker) return;
                UI.log("Mounting C++ OpenSCAD Environment...");
                
                const workerCode = `
                    let oc = null;
                    self.onmessage = async (e) => {
                        if(e.data.cmd === 'init') {
                            try {
                                importScripts('https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js');
                                
                                const jsUrl = 'https://cdn.jsdelivr.net/npm/@jwc/openscad-wasm@latest/dist/openscad.js';
                                const wasmUrl = 'https://cdn.jsdelivr.net/npm/@jwc/openscad-wasm@latest/dist/openscad.wasm';
                                
                                self.postMessage({ cmd: 'log', msg: 'Downloading WASM Binary (Blob Bypass)...' });
                                
                                // 1. Manually fetch the WASM as an ArrayBuffer to completely bypass Emscripten's broken Blob URL router
                                const wasmRes = await fetch(wasmUrl);
                                if (!wasmRes.ok) throw new Error("WASM Binary 404");
                                const wasmBuffer = await wasmRes.arrayBuffer();

                                self.postMessage({ cmd: 'log', msg: 'Loading OpenSCAD Runtime...' });
                                importScripts(jsUrl);

                                self.postMessage({ cmd: 'log', msg: 'Booting Kernel...' });
                                
                                // 2. Pass the raw binary buffer directly into OpenSCAD
                                oc = await OpenSCAD({
                                    noInitialRun: true,
                                    wasmBinary: wasmBuffer 
                                });

                                self.postMessage({ cmd: 'log', msg: 'Mounting BOSL2 Architecture...' });
                                const res = await fetch('https://codeload.github.com/BelfrySCAD/BOSL2/zip/refs/heads/master');
                                const unzipped = fflate.unzipSync(new Uint8Array(await res.arrayBuffer()));
                                
                                try { oc.FS.mkdir('/libraries'); oc.FS.mkdir('/libraries/BOSL2'); } catch(e) {}
                                
                                for (const [path, data] of Object.entries(unzipped)) {
                                    if (!data.length) continue; 
                                    const parts = path.split('/'); parts.shift(); if (!parts.length) continue;
                                    const cleanPath = parts.join('/');
                                    
                                    let currentDir = '/libraries/BOSL2';
                                    for (const p of parts.slice(0, -1)) {
                                        currentDir += '/' + p;
                                        try { oc.FS.mkdir(currentDir); } catch(e) {}
                                    }
                                    oc.FS.writeFile('/libraries/BOSL2/' + cleanPath, data);
                                }
                                
                                self.postMessage({ cmd: 'log', msg: 'Kernel Online.' });
                                self.postMessage({ cmd: 'ready' });
                            } catch (err) {
                                self.postMessage({ cmd: 'log', msg: 'Kernel Error: ' + err.message, error: true });
                            }
                        }
                        
                        if(e.data.cmd === 'build') {
                            try {
                                self.postMessage({ cmd: 'log', msg: 'Compiling SCAD to STL...' });
                                oc.FS.writeFile('/in.scad', e.data.scad);
                                
                                // --enable=manifold invokes the hyperfast boolean backend!
                                oc.callMain(['--enable=manifold', '-I', '/libraries', '/in.scad', '-o', '/out.stl']);
                                
                                const rawStlBytes = oc.FS.readFile('/out.stl');
                                const stlSafeCopy = new Uint8Array(rawStlBytes); 
                                oc.FS.unlink('/out.stl');
                                
                                self.postMessage({ cmd: 'complete', stl: stlSafeCopy }, [stlSafeCopy.buffer]);
                            } catch (err) {
                                self.postMessage({ cmd: 'log', msg: 'Compilation Failed (Syntax/Math)', error: true });
                            }
                        }
                    };
                `;
                
                const blob = new Blob([workerCode], {type: 'application/javascript'});
                this.worker = new Worker(URL.createObjectURL(blob));

                return new Promise(resolve => {
                    this.worker.onmessage = (e) => {
                        if(e.data.cmd === 'log') UI.log(e.data.msg, e.data.error);
                        if(e.data.cmd === 'ready') resolve();
                    };
                    this.worker.postMessage({ cmd: 'init' });
                });
            },
            async run(script) {
                return new Promise((resolve, reject) => {
                    this.worker.onmessage = (e) => {
                        if(e.data.cmd === 'log') UI.log(e.data.msg, e.data.error);
                        if(e.data.cmd === 'complete') {
                            UI.log("Parsing BufferGeometry...");
                            resolve(new STLLoader().parse(e.data.stl.buffer));
                        }
                    };
                    this.worker.postMessage({ cmd: 'build', scad: script });
                });
            },
            unload() {
                if(this.worker) { this.worker.terminate(); this.worker = null; }
            }
        };

        // --- LLM ENGINE (WEB WORKER) ---
        const AIEngine = {
            worker: null,
            async init() {
                if(this.worker) return;
                UI.log("Waking AI (Qwen-0.5B WebGPU)...");
                
                const workerCode = `
                    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.2.4';
                    env.allowLocalModels = false; env.useBrowserCache = true; 

                    let generator;
                    self.onmessage = async (e) => {
                        if (e.data.cmd === 'init') {
                            try {
                                generator = await pipeline('text-generation', 'onnx-community/Qwen2.5-Coder-0.5B-Instruct', {
                                    device: 'webgpu', dtype: 'q4',
                                    progress_callback: (x) => self.postMessage({ cmd: 'progress', data: x })
                                });
                                self.postMessage({ cmd: 'ready' });
                            } catch (err) { self.postMessage({ cmd: 'error', error: err.message }); }
                        }
                        if (e.data.cmd === 'generate') {
                            const sysPrompt = "You are an OpenSCAD compiler. Write ONLY valid OpenSCAD code. You may use the BOSL2 library (include <BOSL2/std.scad>). DO NOT USE MARKDOWN. NO EXPLANATIONS.";
                            try {
                                const out = await generator([{ role: 'system', content: sysPrompt }, { role: 'user', content: e.data.text }], { 
                                    max_new_tokens: 150, do_sample: false, return_full_text: false 
                                });
                                let code = out[0].generated_text.trim();
                                code = code.replace(/\\\x60\\\x60\\\x60openscad/gi, '').replace(/\\\x60\\\x60\\\x60/g, '').trim();
                                self.postMessage({ cmd: 'complete', code: code });
                            } catch (err) { self.postMessage({ cmd: 'error', error: err.message }); }
                        }
                    };
                `;
                
                const blob = new Blob([workerCode], {type: 'application/javascript'});
                this.worker = new Worker(URL.createObjectURL(blob), { type: 'module' });
                
                return new Promise((resolve, reject) => {
                    this.worker.onmessage = (e) => {
                        if(e.data.cmd === 'ready') { UI.setProgress(0); resolve(); }
                        if(e.data.cmd === 'progress' && e.data.data.status === 'progress') {
                            const pct = Math.round((e.data.data.loaded / e.data.data.total) * 100);
                            UI.setProgress(pct);
                            if(pct % 20 === 0) UI.log(`Loading Tensor Weights: ${pct}%`);
                        }
                        if(e.data.cmd === 'error') reject(e.data.error);
                    };
                    this.worker.postMessage({ cmd: 'init' });
                });
            },
            async run(prompt) {
                return new Promise((resolve, reject) => {
                    this.worker.onmessage = (e) => {
                        if(e.data.cmd === 'complete') resolve(e.data.code);
                        if(e.data.cmd === 'error') reject(e.data.error);
                    };
                    this.worker.postMessage({ cmd: 'generate', text: prompt });
                });
            },
            unload() {
                if(this.worker) { this.worker.terminate(); this.worker = null; }
            }
        };

        // --- WIRING ---
        document.getElementById('btn-native').addEventListener('click', async () => {
            UI.disableAll();
            const code = "// NATIVE OPENSCAD TEST\n$fn=64;\ncylinder(h=40, r=5, center=true);";
            UI.setCode(code, false);
            try {
                await CadEngine.init(); 
                Viewer.setGeometry(await CadEngine.run(code));
                UI.log("Mesh Rendered.");
            } catch(e) { UI.log('Compile Error', true); }
            UI.enableAll();
        });

        document.getElementById('btn-csg').addEventListener('click', async () => {
            UI.disableAll();
            const code = `// BOSL2 BOOLEAN TEST\ninclude <BOSL2/std.scad>\ndifference() {\n    cuboid([20, 20, 20], chamfer=2);\n    cylinder(h=30, r=6, center=true);\n}`;
            UI.setCode(code, false);
            try {
                await CadEngine.init(); 
                Viewer.setGeometry(await CadEngine.run(code));
                UI.log("Mesh Rendered.");
            } catch(e) { UI.log('Compile Error', true); }
            UI.enableAll();
        });

        document.getElementById('btn-llm').addEventListener('click', async () => {
            const prompt = document.getElementById('llm-prompt').value;
            if(!prompt) return;
            
            UI.disableAll();
            UI.setCode("// Inferencing...", true);
            
            try {
                CadEngine.unload(); // Free RAM
                await AIEngine.init();
                UI.log("LLM Inferencing...");
                const aiCode = await AIEngine.run(prompt);
                UI.setCode(aiCode, true);
                
                AIEngine.unload(); // Free RAM
                await CadEngine.init();
                Viewer.setGeometry(await CadEngine.run(aiCode));
                UI.log("AI Mesh Applied.");
            } catch (e) {
                UI.log(`Compile Error`, true);
            }
            UI.enableAll();
        });

        // TABS
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelector('.nav-tab.active').classList.remove('active');
                e.currentTarget.classList.add('active');
                const targetId = e.currentTarget.getAttribute('data-target');
                document.querySelectorAll('.tool-section').forEach(sec => sec.classList.remove('active'));
                document.getElementById(targetId).classList.add('active');
            });
        });
    </script>
</body>
</html>
