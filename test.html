<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PEAK // CAD ENGINE TEST v2</title>
<style>
  :root{--bg:#03050a;--cyan:#00ffcc;--magenta:#ff00ff;--glass:rgba(15,20,30,.7);--muted:#8892b0}
  *{box-sizing:border-box}
  body,html{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#f0f0f5;
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
  canvas{position:absolute;inset:0;width:100vw;height:100vh;z-index:1}
  #console{position:absolute;top:env(safe-area-inset-top,10px);left:50%;transform:translateX(-50%);
    width:94vw;max-width:440px;z-index:20;background:rgba(5,8,15,.88);backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 14px;pointer-events:none}
  .logo{font-weight:800;letter-spacing:2px;font-size:.85rem;margin-bottom:5px}
  .logo span{color:var(--cyan)}
  #feed{height:110px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
  .line{font-family:ui-monospace,Menlo,monospace;font-size:.65rem;color:var(--muted);
    line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .err{color:#ff3366!important}
  .ok{color:#00ff88!important;font-weight:700}
  .hi{color:var(--cyan);font-weight:700}
  #panel{position:absolute;bottom:env(safe-area-inset-bottom,12px);left:50%;transform:translateX(-50%);
    width:94vw;max-width:440px;z-index:20;background:var(--glass);backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px}
  .title{font-size:.65rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);
    margin-bottom:8px;font-weight:600}
  .btn{display:block;width:100%;background:rgba(0,255,204,.1);color:var(--cyan);
    border:1px solid rgba(0,255,204,.3);border-radius:9px;padding:10px;margin-bottom:6px;
    font-weight:600;font-size:.8rem;cursor:pointer;transition:.15s;text-align:left}
  .btn:active:not(:disabled){background:var(--cyan);color:#000;transform:scale(.98)}
  .btn:disabled{opacity:.4;cursor:wait;filter:grayscale(1)}
  .btn.m{background:rgba(255,0,255,.1);color:var(--magenta);border-color:rgba(255,0,255,.4)}
  .btn.m:active:not(:disabled){background:var(--magenta);color:#fff}
  #code{background:#000;border-radius:7px;padding:9px;font-family:ui-monospace,monospace;
    font-size:.62rem;color:#889;height:62px;overflow-y:auto;white-space:pre-wrap;margin-top:6px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="console">
  <div class="logo">PEAK<span>//</span> ENGINE TEST v2</div>
  <div id="feed"><div class="line hi">Run tests in order. Stop at first failure.</div></div>
</div>

<div id="panel">
  <div class="title">Acceptance Ladder</div>
  <button class="btn" id="t0">0 · version check — is OpenSCAD ≥ 2021.01?</button>
  <button class="btn" id="t1">1 · cube(10) — proves kernel</button>
  <button class="btn" id="t2">2 · rebuild — proves noExitRuntime</button>
  <button class="btn m" id="t3">3 · BOSL2 chamfered cuboid</button>
  <button class="btn m" id="t4">4 · sphere + 2 chamfered holes</button>
  <div id="code">// SCAD source appears here</div>
</div>

<script type="module">
import * as THREE       from 'https://esm.sh/three@0.160.0';
import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { STLLoader }     from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/STLLoader.js';

/* ═══════════════════════════════════════════════════════════════════════════
   WHY THE PREVIOUS BUILD ABORTED (ptr 1024512) — ROOT CAUSE, CONFIRMED
   ───────────────────────────────────────────────────────────────────────────
   BOSL2/std.scad line 8 is a HARD VERSION ASSERT:

       assert(version_num()>=20210100,
              "BOSL2 requires OpenSCAD version 2021.01 or later.");

   ochafik.com hosts an OLD OpenSCAD build. When BOSL2's assert fires, OpenSCAD
   calls abort() → the WASM traps → Emscripten throws a raw C++ pointer.
   That pointer (1024512 / 1025200) IS the assertion failure. It was never an
   OOM, and it was never the "-I" flag.

   NOTE: Gemini's INITIAL_MEMORY / TOTAL_MEMORY / ALLOW_MEMORY_GROWTH options are
   NO-OPS here. Those are Emscripten COMPILE-TIME settings baked into the .wasm;
   passing them to an already-compiled module does nothing.

   THE FIX: use a MODERN build. openscad-wasm@0.0.4 (npm, published 2025-07)
   embeds the wasm inside a single 13.6MB ES module — no sibling .wasm to
   resolve, no locateFile, and jsDelivr's /npm/ endpoint sends CORS headers.
   It exports { createOpenSCAD } (NOT a default export — that's why mod.default
   was undefined), already sets noInitialRun + noExitRuntime, and exposes
   getInstance() → the Emscripten module with .FS and .callMain.
   ═══════════════════════════════════════════════════════════════════════════ */

const CONFIG = {
  // Modern build (2025). Single file, wasm embedded, CORS-clean, has manifold.
  OPENSCAD_NPM: 'https://cdn.jsdelivr.net/npm/openscad-wasm@0.0.4/openscad.js',
  // Legacy fallback ONLY. Known to be too old for BOSL2 (fails the version assert).
  OPENSCAD_OLD: 'https://ochafik.com/openscad/openscad.js',
  BOSL2_BASE:   'https://cdn.jsdelivr.net/gh/BelfrySCAD/BOSL2@master/'
};

/* BOSL2 — VERIFIED transitive closure of `include <BOSL2/std.scad>`, computed by
   recursively parsing every include directive in the real repo. Exactly 32 files.
   The old list fetched 3 files that DON'T EXIST (mutators/masks3d/masks2d → 404,
   silently skipped) and OMITTED 3 that are required: masks, miscellaneous, builtins. */
const BOSL2_FILES = [
  'affine.scad','attachments.scad','beziers.scad','builtins.scad','color.scad',
  'comparisons.scad','constants.scad','coords.scad','distributors.scad','drawing.scad',
  'geometry.scad','linalg.scad','lists.scad','masks.scad','math.scad',
  'miscellaneous.scad','partitions.scad','paths.scad','regions.scad','rounding.scad',
  'shapes2d.scad','shapes3d.scad','skin.scad','std.scad','strings.scad',
  'structs.scad','transforms.scad','trigonometry.scad','utility.scad','vectors.scad',
  'version.scad','vnf.scad'
];

/* ── UI ─────────────────────────────────────────────────────────────────── */
const UI = {
  log(msg, cls = '') {
    const feed = document.getElementById('feed');
    const el = document.createElement('div');
    el.className = 'line ' + cls;
    el.textContent = msg;
    feed.appendChild(el);
    while (feed.children.length > 7) feed.removeChild(feed.firstChild);
  },
  code(t) { document.getElementById('code').textContent = t; },
  busy(b) { document.querySelectorAll('.btn').forEach(x => x.disabled = b); }
};

/* ── VIEWER ─────────────────────────────────────────────────────────────── */
const Viewer = {
  init() {
    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.FogExp2(0x03050a, 0.010);
    this.cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 2000);
    this.cam.position.set(80, 80, 100);
    this.r = new THREE.WebGLRenderer({ canvas: document.getElementById('cv'), antialias: true });
    this.r.setSize(innerWidth, innerHeight);
    this.r.setPixelRatio(Math.min(devicePixelRatio, 2));
    this.r.toneMapping = THREE.ACESFilmicToneMapping;
    this.ctl = new OrbitControls(this.cam, this.r.domElement);
    this.ctl.enableDamping = true; this.ctl.autoRotate = true; this.ctl.autoRotateSpeed = 1.2;
    this.scene.add(new THREE.GridHelper(300, 30, 0x111111, 0x0a0a0a));
    this.scene.add(new THREE.AmbientLight(0xffffff, .6));
    const k = new THREE.DirectionalLight(0x00ffcc, 3.5); k.position.set(40, 60, 40);
    const f = new THREE.DirectionalLight(0xff00ff, 1.8); f.position.set(-40, -10, -40);
    this.scene.add(k, f);
    addEventListener('resize', () => {
      this.cam.aspect = innerWidth / innerHeight; this.cam.updateProjectionMatrix();
      this.r.setSize(innerWidth, innerHeight);
    });
    const loop = () => { requestAnimationFrame(loop); this.ctl.update(); this.r.render(this.scene, this.cam); };
    loop();
  },
  set(geo) {
    if (this.mesh) { this.mesh.geometry.dispose(); this.scene.remove(this.mesh); }
    geo.computeBoundingBox();
    const c = new THREE.Vector3(); geo.boundingBox.getCenter(c);
    geo.translate(-c.x, -c.y, -c.z);
    geo.computeVertexNormals();
    geo.computeBoundingSphere();
    this.mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: 0x1a2030, metalness: .55, roughness: .35,
      polygonOffset: true, polygonOffsetFactor: 1
    }));
    this.mesh.add(new THREE.LineSegments(
      new THREE.EdgesGeometry(geo),
      new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: .35 })
    ));
    this.mesh.rotation.x = -Math.PI / 2;          // STL is Z-up
    this.scene.add(this.mesh);
    const rad = (geo.boundingSphere && geo.boundingSphere.radius) || 30;
    this.cam.position.set(rad * 1.9, rad * 1.9, rad * 2.3);
    this.ctl.target.set(0, 0, 0); this.ctl.update();
  }
};
Viewer.init();

/* ── CAD ENGINE ─────────────────────────────────────────────────────────── */
const Cad = {
  inst: null,        // the Emscripten module (has .FS and .callMain)
  bosl2: false,
  manifold: true,    // flipped off automatically if the flag is rejected
  out: '',           // captured stdout  (echo() lands here)
  err: '',           // captured stderr  (assert messages land here)

  async initKernel() {
    if (this.inst) return;

    const opts = {
      print:    t => { this.out += t + '\n'; console.log('[SCAD]', t); },
      printErr: t => { this.err += t + '\n'; console.warn('[SCAD:err]', t); }
    };

    // --- try the MODERN npm build first ---
    try {
      UI.log('Loading openscad-wasm@0.0.4 (13.6MB, wasm embedded)…');
      const mod = await import(/* @vite-ignore */ CONFIG.OPENSCAD_NPM);
      // NAMED export — NOT default. mod.default is undefined here.
      const createOpenSCAD = mod.createOpenSCAD;
      if (!createOpenSCAD) throw new Error('createOpenSCAD not exported');

      const wrapper = await createOpenSCAD(opts);   // sets noInitialRun/noExitRuntime itself
      this.inst = wrapper.getInstance();            // → Emscripten module
      if (!this.inst || !this.inst.FS) throw new Error('getInstance() gave no FS');
      UI.log('KERNEL READY (modern build)', 'ok');
      return;
    } catch (e) {
      UI.log(`modern build failed: ${e.message}`, 'err');
    }

    // --- fallback: legacy ochafik build (too old for BOSL2, but proves the kernel) ---
    UI.log('Falling back to legacy build…', 'err');
    const mod = await import(/* @vite-ignore */ CONFIG.OPENSCAD_OLD);
    const factory = mod.default || mod.OpenSCAD ||
                    Object.values(mod).find(v => typeof v === 'function');
    if (!factory) throw new Error('No factory export in legacy openscad.js');
    this.inst = await factory({ noInitialRun: true, noExitRuntime: true, ...opts });
    if (!this.inst.FS) throw new Error('FS API missing');
    UI.log('KERNEL READY (LEGACY — BOSL2 will likely fail)', 'err');
  },

  /* Runs OpenSCAD and returns captured stdout. Used by the version probe. */
  async probe(scad) {
    this.out = ''; this.err = '';
    this.inst.FS.writeFile('/probe.scad', scad);
    try { this.inst.callMain(['/probe.scad', '-o', '/probe.echo']); }
    catch (e) { /* echo-only scripts exit non-zero; that's fine */ }
    return this.out + this.err;
  },

  /* BOSL2 mount — separate concern. A failure here must NEVER be reported as a
     kernel failure (that misdiagnosis caused two bogus engine pivots). */
  async mountBOSL2() {
    if (this.bosl2) return;
    UI.log(`Fetching BOSL2 (${BOSL2_FILES.length} files, ~2.7MB)…`);
    try { this.inst.FS.mkdir('/libraries'); } catch {}
    try { this.inst.FS.mkdir('/libraries/BOSL2'); } catch {}

    const got = await Promise.all(BOSL2_FILES.map(async f => {
      const r = await fetch(CONFIG.BOSL2_BASE + f);
      if (!r.ok) { UI.log(`  ✗ ${f} → HTTP ${r.status}`, 'err'); return null; }
      return [f, new Uint8Array(await r.arrayBuffer())];
    }));

    let n = 0;
    for (const hit of got) {
      if (!hit) continue;
      this.inst.FS.writeFile('/libraries/BOSL2/' + hit[0], hit[1]);
      n++;
    }
    // Every file must land — ONE missing include aborts the parser.
    if (n < BOSL2_FILES.length)
      throw new Error(`BOSL2 incomplete: ${n}/${BOSL2_FILES.length}`);

    this.bosl2 = true;
    UI.log(`BOSL2 MOUNTED (${n}/${BOSL2_FILES.length})`, 'ok');
  },

  async run(scad) {
    if (scad.includes('BOSL2') && !this.bosl2)
      throw new Error('BOSL2 not mounted');

    this.out = ''; this.err = '';
    this.inst.FS.writeFile('/in.scad', scad);
    try { this.inst.FS.unlink('/out.stl'); } catch {}

    const args = [];
    if (this.manifold) args.push('--enable=manifold');
    args.push('-I', '/libraries', '/in.scad', '-o', '/out.stl');

    UI.log(`Compiling${this.manifold ? ' [manifold]' : ' [CGAL]'}…`);
    await new Promise(r => setTimeout(r, 20));   // let the UI paint

    let aborted = null;
    try {
      this.inst.callMain(args);
    } catch (e) {
      if (e && e.name === 'ExitStatus' && e.status === 0) { /* clean */ }
      else aborted = e;
    }

    // Surface the REAL reason. stderr holds the assert / parse message; the raw
    // pointer alone is useless, which is exactly why this kept getting misread.
    const diag = (this.err || '').trim();

    if (aborted) {
      if (/manifold/i.test(diag) && this.manifold) {
        UI.log('manifold rejected — retrying on CGAL…', 'err');
        this.manifold = false;
        return this.run(scad);
      }
      if (/requires OpenSCAD version/i.test(diag))
        throw new Error('BOSL2 version assert: this OpenSCAD build is < 2021.01');
      const ptr = (typeof aborted === 'number') ? ` (ptr ${aborted})` : '';
      throw new Error(diag ? `OpenSCAD: ${diag.split('\n')[0]}` : `C++ abort${ptr}, no stderr`);
    }

    let stl;
    try { stl = this.inst.FS.readFile('/out.stl'); }
    catch {
      if (/manifold/i.test(diag) && this.manifold) {
        UI.log('manifold unsupported — retrying on CGAL…', 'err');
        this.manifold = false;
        return this.run(scad);
      }
      throw new Error(diag ? diag.split('\n')[0] : 'No STL produced');
    }
    if (!stl.length) throw new Error('Empty STL — geometry is null');
    this.inst.FS.unlink('/out.stl');

    UI.log(`STL ${(stl.length / 1024).toFixed(1)} KB — parsing…`);
    return new STLLoader().parse(stl.slice().buffer);   // slice() → byteOffset 0
  }
};

/* ── TESTS ──────────────────────────────────────────────────────────────── */
const SRC = {
  ver: 'echo(str("OPENSCAD_VERSION_NUM=", version_num()));\ncube(1);',
  t1:  'cube(10);',
  t3:  'include <BOSL2/std.scad>\ncuboid([20,20,20], chamfer=2);',
  t4:  `include <BOSL2/std.scad>
difference() {
  sphere(d=76.2);              // 3 inch
  zcyl(d=10, h=100, chamfer=6);
  xcyl(d=12, h=100, chamfer=6);
}`
};

/* TEST 0 — the diagnostic that would have saved days.
   Prints the engine's version_num(). BOSL2 asserts >= 20210100. */
document.getElementById('t0').onclick = async () => {
  UI.busy(true); UI.code(SRC.ver);
  try {
    await Cad.initKernel();
    const outp = await Cad.probe(SRC.ver);
    const m = outp.match(/OPENSCAD_VERSION_NUM=(\d+)/);
    if (!m) { UI.log('Could not read version — see console', 'err'); console.log(outp); }
    else {
      const v = parseInt(m[1], 10);
      UI.log(`version_num() = ${v}`, 'hi');
      if (v >= 20210100) UI.log('≥ 2021.01 → BOSL2 WILL WORK', 'ok');
      else UI.log(`< 2021.01 → BOSL2 assert WILL abort (this was the bug)`, 'err');
    }
  } catch (e) { UI.log(e.message, 'err'); console.error(e); }
  UI.busy(false);
};

async function runTest(scad, needBosl) {
  UI.busy(true); UI.code(scad);
  try {
    await Cad.initKernel();
    if (needBosl) await Cad.mountBOSL2();
    Viewer.set(await Cad.run(scad));
    UI.log('MESH RENDERED ✓', 'ok');
  } catch (e) {
    UI.log(String(e.message).split('\n')[0], 'err');
    if (Cad.err) UI.log('stderr: ' + Cad.err.trim().split('\n')[0], 'err');
    console.error(e, '\n--- stderr ---\n', Cad.err, '\n--- stdout ---\n', Cad.out);
  }
  UI.busy(false);
}

document.getElementById('t1').onclick = () => runTest(SRC.t1, false);
document.getElementById('t2').onclick = () => runTest(SRC.t1, false);   // second call
document.getElementById('t3').onclick = () => runTest(SRC.t3, true);
document.getElementById('t4').onclick = () => runTest(SRC.t4, true);
</script>
</body>
</html>
