<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WebLLM Diagnostic</title>
<style>
  :root { --bg: #03050a; --cy: #00ffcc; --mg: #ff00ff; --mut: #8892b0; --pan: rgba(15,20,30,0.85); }
  * { box-sizing: border-box; }
  body, html { margin: 0; height: 100%; background: var(--bg); color: #f0f0f5; font-family: -apple-system, sans-serif; overflow: hidden; display: flex; flex-direction: column; }
  
  /* Header */
  header { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); background: var(--pan); flex-shrink: 0; }
  h1 { margin: 0; font-size: 1.1rem; color: var(--cy); letter-spacing: 1px; }
  p { margin: 5px 0 0; font-size: 0.75rem; color: var(--mut); }

  /* Diagnostic Logs */
  #logs { padding: 15px; font-family: ui-monospace, monospace; font-size: 0.7rem; color: var(--mut); flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .log-sys { color: #8892b0; }
  .log-ok { color: var(--cy); font-weight: bold; }
  .log-err { color: #ff3366; font-weight: bold; }
  .log-ai { color: var(--mg); background: rgba(255,0,255,0.1); padding: 8px; border-radius: 6px; border-left: 2px solid var(--mg); }
  .log-user { color: #fff; background: rgba(255,255,255,0.1); padding: 8px; border-radius: 6px; text-align: right; }

  /* Input Area */
  #controls { padding: 15px; background: var(--pan); border-top: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; display: flex; gap: 10px; padding-bottom: env(safe-area-inset-bottom, 15px); }
  input { flex-grow: 1; background: #000; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px; border-radius: 8px; font-size: 0.9rem; outline: none; }
  input:focus { border-color: var(--cy); }
  button { background: rgba(0,255,204,0.15); color: var(--cy); border: 1px solid rgba(0,255,204,0.4); padding: 0 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  button:active:not(:disabled) { background: var(--cy); color: #000; }
  button:disabled { opacity: 0.4; cursor: wait; filter: grayscale(1); }

  /* Progress Bar */
  #progress-container { width: 100%; height: 4px; background: #222; margin-top: 10px; border-radius: 2px; overflow: hidden; display: none; }
  #progress-bar { height: 100%; width: 0%; background: var(--cy); transition: width 0.1s; }
</style>
</head>
<body>

<header>
  <h1>WebLLM Diagnostics</h1>
  <p id="status-text">Checking hardware capabilities...</p>
  <div id="progress-container"><div id="progress-bar"></div></div>
</header>

<div id="logs">
  <div class="log-sys">Initializing diagnostic tool...</div>
</div>

<div id="controls">
  <input type="text" id="prompt-input" placeholder="Type a message..." disabled>
  <button id="send-btn" disabled>Send</button>
</div>

<script type="module">
  // Import WebLLM from the official ESM bundle
  import * as webllm from "https://esm.run/@mlc-ai/web-llm";

  const UI = {
    logs: document.getElementById('logs'),
    status: document.getElementById('status-text'),
    progContainer: document.getElementById('progress-container'),
    progBar: document.getElementById('progress-bar'),
    input: document.getElementById('prompt-input'),
    btn: document.getElementById('send-btn'),
    
    log(msg, type = 'sys') {
      const el = document.createElement('div');
      el.className = `log-${type}`;
      el.textContent = msg;
      this.logs.appendChild(el);
      this.logs.scrollTop = this.logs.scrollHeight;
    },
    
    setProgress(text, percent) {
      this.status.textContent = text;
      if (percent >= 0) {
        this.progContainer.style.display = 'block';
        this.progBar.style.width = `${percent}%`;
      } else {
        this.progContainer.style.display = 'none';
      }
    }
  };

  // State
  let engine = null;
  // Using the smallest possible reliable Coder model for mobile testing
  const MODEL_ID = "Qwen2.5-Coder-0.5B-Instruct-q4f16_1-MLC"; 

  async function init() {
    UI.log("Probing navigator.gpu...", "sys");
    
    if (!navigator.gpu) {
      UI.log("WebGPU is NOT supported on this browser/device.", "err");
      UI.setProgress("Hardware incompatible", -1);
      return;
    }
    
    UI.log("WebGPU found. Requesting adapter...", "ok");
    
    try {
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) throw new Error("Adapter returned null");
      
      const adapterInfo = await adapter.requestAdapterInfo();
      UI.log(`GPU Adapter: ${adapterInfo.vendor || 'Unknown'} - ${adapterInfo.architecture || 'Unknown'}`, "sys");
      if (adapter.isFallbackAdapter) {
        UI.log("WARNING: Browser is using a software fallback adapter. This will be incredibly slow or crash.", "err");
      }
    } catch(e) {
      UI.log(`Adapter fetch failed: ${e.message}`, "err");
    }

    try {
      UI.log(`Booting MLC Engine for: ${MODEL_ID}`, "sys");
      UI.setProgress("Initializing WebLLM Engine...", 0);
      
      // Initialize the engine with a progress callback
      engine = await webllm.CreateMLCEngine(MODEL_ID, {
        initProgressCallback: (progress) => {
          // progress.progress is a float from 0 to 1
          const pct = Math.round(progress.progress * 100);
          UI.setProgress(progress.text, pct);
          console.log(progress.text);
        }
      });

      UI.log("Engine loaded into VRAM successfully!", "ok");
      UI.setProgress("Ready", -1);
      
      UI.input.disabled = false;
      UI.btn.disabled = false;
      UI.input.focus();

    } catch (err) {
      UI.log(`Fatal Load Error: ${err.message}`, "err");
      UI.setProgress("Initialization Failed", -1);
      console.error(err);
    }
  }

  async function generate() {
    const text = UI.input.value.trim();
    if (!text) return;

    // Lock UI
    UI.input.value = "";
    UI.input.disabled = true;
    UI.btn.disabled = true;
    
    UI.log(text, "user");
    UI.log("Generating response...", "sys");
    UI.setProgress("Inferencing (Watch for GPU crash)...", -1);

    const messages = [{ role: "user", content: text }];

    try {
      // Create chat completion
      const reply = await engine.chat.completions.create({
        messages,
        temperature: 0.7,
      });

      const responseText = reply.choices[0].message.content;
      UI.log(responseText, "ai");
      UI.setProgress("Ready", -1);

    } catch (err) {
      UI.log(`Inference Crash: ${err.message}`, "err");
      UI.setProgress("Hardware crash during generation", -1);
      console.error(err);
    }

    // Unlock UI
    UI.input.disabled = false;
    UI.btn.disabled = false;
    UI.input.focus();
  }

  // Event Listeners
  UI.btn.addEventListener('click', generate);
  UI.input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') generate();
  });

  // Start
  init();
</script>
</body>
</html>
