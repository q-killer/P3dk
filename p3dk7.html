  Single file. Code-golfed. CDN-only dependencies.
  FEATURES: Load STL/OBJ/PLY/3MF/GLB | manifold CSG | 12 patterns | face select
            hole detect | skin-deep | twist/slice/hollow | kinetic hole/boss
            Support Foundry (columns+Fibonacci vines) | Topology Opt (SIMP) | Elongate
            Occam Cleaver (both halves + alignment pins + zip export)
            ◉ INDRA'S NET — WebXR depth scan → TSDF → watertight STL
            ✶ SPLAT FORGE — Gaussian splat viewer (.ply/.splat/.ksplat) + mesh conversion
            ViewCube | undo/redo | IDB session | day/night theme
  SCAN PIPELINE: WebXR AR (ARCore/LiDAR depth-sensing) → ring buffer → Web Worker TSDF
    → marching cubes → manifold-3d repair → watertight STL in scene
  SPLAT PIPELINE: @mkkellogg/gaussian-splats-3d (lazy CDN import) → DropInViewer

<script>
// ── EARLY SCOPE MANAGER ── runs before module, stubs all onclick targets ──────
(function(){
const w=window,d=document;

// Shorthand helpers
w.sS=m=>{const e=d.getElementById('sts');if(e)e.textContent=m};
w.uS=(e,v)=>{const el=d.getElementById(v);if(el)el.textContent=parseFloat(e.value).toFixed(e.step<1?2:0)};

// Mobile breakpoint — used by togUI and future responsive logic
const _mob=matchMedia('(max-width:768px) and (pointer:coarse)');

// Micro-synth + haptics — procedural Web Audio API, zero external assets.
// Creates a new AudioContext per call and force-closes after 150ms to avoid
// hitting browser limits on concurrent audio contexts (Chrome allows ~6).
// try/catch handles pre-gesture policy (autoplay blocked before first interaction).
w.fx=(f=600)=>{
  navigator.vibrate?.(15); // 15ms haptic tick — silent on desktop
  try{
    const A=new(w.AudioContext||w.webkitAudioContext)();
    const O=A.createOscillator(),G=A.createGain();
    O.frequency.value=f;O.type='sine';
    O.connect(G);G.connect(A.destination);
    G.gain.setValueAtTime(0.05,A.currentTime);
    G.gain.exponentialRampToValueAtTime(1e-4,A.currentTime+0.1);
    O.start();
    setTimeout(()=>A.close(),150); // force-close to release audio thread
  }catch(e){}
};
// hx: haptic-only, no sound. ms=duration in ms. Pattern array for double/triple pulses.
// Used for high-frequency events (sliders) where audio would be annoying.
w.hx=(ms=8)=>navigator.vibrate?.(ms);

w.togUI=()=>{
  const u=d.getElementById('ui'),t=d.getElementById('tog'),h=d.getElementById('fh');
  if(!u||!t)return;
  const c=!u.classList.contains('col');
  u.classList.toggle('col');t.classList.toggle('col');
  h?.classList.toggle('col'); // sync #fh collapse — drives mobile bottom transition
  t.textContent=c?'>>':'<<';
  w.fx?.(c?400:600); // 400Hz=collapse, 600Hz=expand
  if(h&&!_mob.matches)h.style.left=c?'14px':((u.offsetWidth||280)+8)+'px';
};
w.tP=h=>{if(h?.nextElementSibling){h.nextElementSibling.classList.toggle('hi');h.classList.toggle('cl');w.fx?.(h.classList.contains('cl')?500:700)}};
// Global slider haptic — single listener covers all 30+ range inputs, zero per-slider code.
// Light 8ms tick on every value change, throttled to once per 50ms to avoid vibration blur.
let _hxLast=0;
d.addEventListener('input',e=>{if(e.target.type==='range'){const n=Date.now();if(n-_hxLast>50){w.hx?.(8);_hxLast=n}}});
w.togA=()=>d.getElementById('ab')?.classList.toggle('hi');

// Theme — runs immediately for correct first paint, no flash
w.iL=false;w.tMO=false;
w.apT=l=>{w.iL=l;d.getElementById('R')?.classList.toggle('lm',l);const b=d.getElementById('thT');if(b)b.textContent=l?'🌙':'🌓';w.uCF?.();w.updGrid?.()};
w.aT=()=>{if(w.tMO)return;const h=new Date().getHours();w.apT(h>=7&&h<20)};
w.togT=()=>{w.tMO=true;w.apT(!w.iL)};
w.aT();

// Re-check theme every minute (auto day/night) unless user has manually toggled
setInterval(()=>{if(!w.tMO&&!w.bgTab)w.aT()},60000);

// Background tab flag — kill expensive effects when hidden, restore on focus
w.bgTab=false;
d.addEventListener('visibilitychange',()=>{
  w.bgTab=d.hidden;
  d.body.classList.toggle('lowfx',d.hidden);
});

// Global state init — prevents undefined errors during WASM boot
w.msh=null;w.selFaces=[];w.gHoles=[];w.exclMode=false;
w.isPartRot=false;w.isDragMesh=false;w.meshDragLast={x:0,y:0};w.camTween=null;
w.cylState=0;w.cMode='';w.cWn=null;w.cWp=null;w.cMesh=null;w.cylFd=null;
w.cD1=6;w.cD2=10;w.cD3=10;w.kbBuf='';
w.scLnk=true;w.isSnap=false;w.skinActive=false;w.skinMode='tex';
w.srcFN='model';w.sD=false;w.cubeStats={v:'--',t:'--',mf:'--',fps:'--'};
w.elongateMode='stretch'; // 'stretch' or 'compress'

// Cleanup helpers — called on page hide and by module on reset
// camStop: stops live camera stream if active
w.camStop=()=>{if(w.camStream){w.camStream.getTracks().forEach(t=>t.stop());w.camStream=null}};
// killWorkers: terminates any running Web Workers
// Names match actual module vars exposed to window
w.killWorkers=()=>{
  w.tsdfWorker?.terminate?.();w.tsdfWorker=null;
  w.topoWorker?.terminate?.();w.topoWorker=null;
};

// Cleanup on navigation/tab close — pagehide is more reliable than beforeunload
addEventListener('pagehide',()=>{w.camStop();w.killWorkers()});

// Safe stubs — replaced by module definitions once engine loads.
// Using a factory so each stub reports its own name in the status bar.
const stub=f=>()=>w.sS('> \u03a3 '+f.toUpperCase()+' — ENGINE LOADING...');
[
  'rstM','healMesh','doX','tog','syM','hollowMesh','applyTwist','prvSlice','applySlice',
  'applyRounding','togSkin','togExcl','clrExcl','exeC','startDrag','togLock',
  'togSnap','doU','doD','togPR','upS','uPrv','prvTwist','snapCam',
  'scanOvh','genSup','rmvSup','topoRun','topoPreview','elongateDo','topoMerge','mrgSup',
  'startXRScan','stopXRScan','bakeXRMesh','loadSplat','splatToMesh','closeSplatViewer',
  'togCam','setCamAlpha','updGrid',
  'cfdStart','cfdStop','cfdReset','cfdBakeDrag'
].forEach(f=>w[f]=stub(f));
})();
</script>
