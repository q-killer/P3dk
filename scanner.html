<script>
/**
 * P3dK // BARE METAL RASTERIZER
 * No Three.js. No WebGL. No CDNs.
 * Pure Math: Matrix Projection, Perspective Divide, CPU Edge Detection.
 */

const UI = {
    video: document.getElementById('video-feed'),
    display: document.getElementById('display'),
    stats: document.getElementById('stats'),
    btnStart: document.getElementById('btn-start'),
    btnMode: document.getElementById('btn-mode')
};

// Internal low-res canvas for fast CPU pixel processing (like 90s Mode 13h!)
const procWidth = 160; 
const procHeight = 120;
const procCanvas = document.createElement('canvas');
procCanvas.width = procWidth;
procCanvas.height = procHeight;
const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });

// 2D Display Context (No WebGL)
const ctx = UI.display.getContext('2d');
let width = window.innerWidth;
let height = window.innerHeight;
UI.display.width = width;
UI.display.height = height;

// State
let isRunning = false;
let renderMode = 0; // 0 = Points, 1 = Wireframe Connect
let pointCloud = []; // Array of 3D objects: {x, y, z, brightness}
let time = 0;

// --- 1. PURE 3D MATH ENGINE ---
// These are the raw algorithms used in assembly before GPUs existed.

// Projects a 3D coordinate (x,y,z) onto a 2D screen (x,y)
function project(x, y, z, fov, viewerDistance) {
    // Avoid division by zero
    const factor = fov / (viewerDistance + z || 0.001); 
    const xProjected = (x * factor) + (width / 2);
    const yProjected = (y * factor) + (height / 2);
    return { x: xProjected, y: yProjected, scale: factor };
}

// Rotates a 3D point around the Y and X axes using Sine/Cosine math
function rotate3D(x, y, z, pitch, yaw) {
    const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
    const cosX = Math.cos(pitch), sinX = Math.sin(pitch);

    // Y-axis rotation (Yaw)
    let x1 = x * cosY - z * sinY;
    let z1 = x * sinY + z * cosY;

    // X-axis rotation (Pitch)
    let y2 = y * cosX - z1 * sinX;
    let z2 = y * sinX + z1 * cosX;

    return { x: x1, y: y2, z: z2 };
}

// --- 2. CPU OPTICAL EXTRACTION (The "Assembler" approach to CV) ---
// We read pixels directly from memory and calculate contrast to find edges.
function extractTopology() {
    // Draw current video frame to low-res buffer
    procCtx.drawImage(UI.video, 0, 0, procWidth, procHeight);
    const frame = procCtx.getImageData(0, 0, procWidth, procHeight);
    const data = frame.data;

    pointCloud = []; // Clear old points
    const threshold = 30; // Contrast threshold for edge detection
    
    // Loop through pixels, skipping rows/cols for speed
    for (let y = 1; y < procHeight - 1; y += 2) {
        for (let x = 1; x < procWidth - 1; x += 2) {
            const idx = (y * procWidth + x) * 4;
            
            // Grayscale luminance
            const lum = data[idx] * 0.299 + data[idx+1] * 0.587 + data[idx+2] * 0.114;
            
            // Look at right neighbor to find hard edges
            const idxRight = (y * procWidth + (x + 1)) * 4;
            const lumRight = data[idxRight] * 0.299 + data[idxRight+1] * 0.587 + data[idxRight+2] * 0.114;
            
            const edgeStrength = Math.abs(lum - lumRight);
            
            // If we found a hard edge, map it into 3D space!
            if (edgeStrength > threshold) {
                // Map 2D coordinate to a 3D plane
                // We use luminance to push bright pixels "forward" in Z space (Depth approximation)
                const depth = (lum / 255.0) * 100 - 50; 
                
                pointCloud.push({
                    x: (x - procWidth / 2) * 3, // Scale up
                    y: (y - procHeight / 2) * 3,
                    z: depth,
                    brightness: lum
                });
            }
        }
    }
}

// --- 3. SOFTWARE RENDERING LOOP ---
let lastTime = performance.now();
let frames = 0;
let lastFpsTime = 0;

function render() {
    if (!isRunning) return requestAnimationFrame(render);
    
    time += 0.01;
    
    // 1. Black out canvas
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)'; // Trail effect
    ctx.fillRect(0, 0, width, height);
    
    // 2. Extract new 3D points from live camera
    extractTopology();
    
    // 3. Render 3D point cloud to 2D screen
    const fov = 400; // Field of view
    const viewDist = 200; // Camera distance
    const yaw = Math.sin(time) * 0.5; // Auto-rotate back and forth
    const pitch = Math.cos(time * 0.5) * 0.2;
    
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
    ctx.fillStyle = '#0ff';
    ctx.lineWidth = 1;
    
    if (renderMode === 1) ctx.beginPath(); // Start wireframe path

    for (let i = 0; i < pointCloud.length; i++) {
        const pt = pointCloud[i];
        
        // Rotate in 3D
        const rot = rotate3D(pt.x, pt.y, pt.z, pitch, yaw);
        
        // Project to 2D
        const proj = project(rot.x, rot.y, rot.z, fov, viewDist);
        
        // Don't draw things behind the camera
        if (proj.scale > 0) {
            if (renderMode === 0) {
                // Draw Point Cloud
                const size = Math.max(0.5, proj.scale * 2 * (pt.brightness / 255));
                ctx.globalAlpha = pt.brightness / 255; // Brighter points are more opaque
                ctx.fillRect(proj.x, proj.y, size, size);
            } else {
                // Draw Wireframe (Connect adjacent points)
                if (i === 0 || i % procWidth === 0) {
                    ctx.moveTo(proj.x, proj.y);
                } else {
                    ctx.lineTo(proj.x, proj.y);
                }
            }
        }
    }
    
    if (renderMode === 1) ctx.stroke(); // Draw wireframe
    ctx.globalAlpha = 1.0;

    // FPS Counter
    frames++;
    const now = performance.now();
    if (now - lastFpsTime >= 1000) {
        UI.stats.innerText = `PTS: ${pointCloud.length} | FPS: ${frames}`;
        frames = 0;
        lastFpsTime = now;
    }

    requestAnimationFrame(render);
}

// --- HARDWARE BINDINGS ---
UI.btnStart.addEventListener('click', async () => {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 640 } }
        });
        UI.video.srcObject = stream;
        
        UI.btnStart.style.display = 'none';
        UI.btnMode.style.display = 'block';
        
        isRunning = true;
        render();
    } catch (err) {
        alert("Camera required for raw data extraction.");
    }
});

UI.btnMode.addEventListener('click', () => {
    renderMode = renderMode === 0 ? 1 : 0;
    UI.btnMode.innerText = renderMode === 0 ? "MODE: POINT CLOUD" : "MODE: TOPOLOGY WIRE";
});

window.addEventListener('resize', () => {
    width = window.innerWidth;
    height = window.innerHeight;
    UI.display.width = width;
    UI.display.height = height;
});

</script>
</body>
