<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P3dK // Spatial Fusion</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root { --cyan: #0ff; --amber: #ffb000; --magenta: #f0f; --bg: #050505; --font: 'Courier New', monospace; }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; overflow: hidden; }
        body { background: var(--bg); color: var(--cyan); font-family: var(--font); touch-action: none; }
        
        #video-feed { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; opacity: 0.8; }
        #glcanvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; background: #000; display: none; }

        /* AR Overlay aesthetic */
        .ar-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3;
            background: linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px; pointer-events: none;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; padding: 15px;
        }

        .panel {
            background: rgba(0, 15, 15, 0.8); border: 1px solid var(--cyan); padding: 12px;
            backdrop-filter: blur(8px); pointer-events: auto;
        }

        .sys-text { font-size: 11px; font-weight: bold; line-height: 1.5; text-shadow: 0 0 5px #000; }
        .amber { color: var(--amber); }

        .btn {
            background: rgba(0, 40, 40, 0.8); color: var(--cyan); border: 1px solid var(--cyan);
            padding: 15px; font-family: var(--font); font-size: 14px; font-weight: bold;
            cursor: pointer; text-transform: uppercase; width: 100%; margin-top: 10px; transition: 0.1s;
        }
        .btn:active { background: var(--cyan); color: #000; }
        
        #btn-sweep { 
            height: 80px; font-size: 18px; border-width: 2px;
            background: repeating-linear-gradient(45deg, rgba(0,255,255,0.1), rgba(0,255,255,0.1) 10px, transparent 10px, transparent 20px);
        }
        #btn-sweep:active { background: var(--cyan); color: #000; }

        #controls-review { display: none; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        /* Leveler UI for Gyro */
        #leveler {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100px; height: 1px; background: rgba(255,255,255,0.5); z-index: 5; pointer-events: none;
        }
        #leveler::after {
            content: ''; position: absolute; left: 50%; top: -10px; width: 2px; height: 20px; background: var(--amber);
        }

    </style>
</head>
<body>

    <video id="video-feed" autoplay playsinline muted></video>
    <canvas id="glcanvas"></canvas>
    <div class="ar-grid"></div>
    <div id="leveler"></div>

    <div id="ui-layer">
        <header>
            <div class="panel">
                <div class="sys-text">
                    <div id="lbl-mode">MODE: IMU FUSION STANDBY</div>
                    <div id="lbl-pts">POINTS CAPTURED: 0</div>
                    <div id="lbl-imu" class="amber">GYRO: OFFLINE</div>
                </div>
            </div>
        </header>

        <footer>
            <div id="controls-live">
                <button class="btn" id="btn-init">1. INIT SENSORS & IMU</button>
                <div id="sweep-container" style="display:none;">
                    <div class="sys-text amber" style="text-align:center; margin-bottom:5px;">HOLD BUTTON & PAN SLOWLY</div>
                    <button class="btn" id="btn-sweep">[ HOLD TO SWEEP SCAN ]</button>
                    <button class="btn" id="btn-done" style="border-color: var(--amber); color: var(--amber);">FINISH & REVIEW</button>
                </div>
            </div>
            
            <div id="controls-review" class="panel">
                <div class="sys-text amber" style="margin-bottom: 10px;">SPATIAL POINT CLOUD</div>
                <div class="btn-grid">
                    <button class="btn" id="btn-export" style="border-color: var(--cyan);">EXPORT .PLY</button>
                    <button class="btn" id="btn-discard" style="border-color: #555; color: #aaa;">DISCARD</button>
                </div>
            </div>
        </footer>
    </div>

<script>
/**
 * P3dK // Spatial Fusion Engine (V9)
 * Multi-frame IMU-tracked Point Cloud Accumulator.
 * Uses DeviceOrientation to rotate depth data into a shared 3D world space.
 */

const UI = {
    video: document.getElementById('video-feed'),
    canvas: document.getElementById('glcanvas'),
    lblMode: document.getElementById('lbl-mode'),
    lblPts: document.getElementById('lbl-pts'),
    lblImu: document.getElementById('lbl-imu'),
    controlsLive: document.getElementById('controls-live'),
    sweepContainer: document.getElementById('sweep-container'),
    controlsReview: document.getElementById('controls-review'),
    btnInit: document.getElementById('btn-init'),
    btnSweep: document.getElementById('btn-sweep'),
    btnDone: document.getElementById('btn-done'),
    leveler: document.getElementById('leveler')
};

// --- THREE.JS SCENE SETUP ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 0); // Camera starts at origin for AR

const renderer = new THREE.WebGLRenderer({ canvas: UI.canvas, antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);

// We will use a custom target for the OrbitControls later
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enabled = false; // Disabled during live scan

// --- SPATIAL FUSION STATE ---
let isSweeping = false;
let pointCloudData = []; // Array to hold raw vertices {x, y, z, r, g, b}
let finalPointsMesh = null;

// Processing Canvas (Keep resolution moderate to allow 20fps sweeping)
const scanRes = 100; 
const procCanvas = document.createElement('canvas');
procCanvas.width = scanRes;
procCanvas.height = scanRes;
const ctx = procCanvas.getContext('2d', { willReadFrequently: true });

// --- IMU (GYROSCOPE) TRACKING ---
const currentQuat = new THREE.Quaternion();
const initialQuatInv = new THREE.Quaternion(); // Used to "Zero" the rotation on start
let hasZeroedIMU = false;

function setupIMU() {
    window.addEventListener('deviceorientation', (event) => {
        if (!event.alpha) return;
        
        UI.lblImu.innerText = "GYRO: LOCKED & TRACKING";
        UI.lblImu.className = "cyan";
        
        // Convert Euler angles to Quaternion
        const alpha = THREE.MathUtils.degToRad(event.alpha);
        const beta = THREE.MathUtils.degToRad(event.beta);
        const gamma = THREE.MathUtils.degToRad(event.gamma);
        const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
        
        const rawQuat = new THREE.Quaternion().setFromEuler(euler);
        
        if (!hasZeroedIMU) {
            // Store the inverse of the first frame to "Zero" our coordinate system
            initialQuatInv.copy(rawQuat).invert();
            hasZeroedIMU = true;
        }
        
        // Multiply raw orientation by our zeroing offset
        currentQuat.multiplyQuaternions(initialQuatInv, rawQuat);
        
        // Visual feedback for the UI Leveler
        UI.leveler.style.transform = `translate(-50%, -50%) rotate(${event.gamma}deg)`;
    });
}

// --- CORE ACCUMULATION LOGIC ---
const tempVec = new THREE.Vector3();
let lastCaptureTime = 0;

function captureSweepFrame() {
    const now = performance.now();
    if (now - lastCaptureTime < 100) return; // Cap at ~10 FPS to prevent memory overload
    lastCaptureTime = now;

    // Draw video to processing canvas
    const minDim = Math.min(UI.video.videoWidth, UI.video.videoHeight);
    const sx = (UI.video.videoWidth - minDim) / 2;
    const sy = (UI.video.videoHeight - minDim) / 2;
    ctx.drawImage(UI.video, sx, sy, minDim, minDim, 0, 0, scanRes, scanRes);
    const data = ctx.getImageData(0, 0, scanRes, scanRes).data;

    const fovScale = 2.0; // Spreads the points out to match camera FOV

    // Iterate pixels
    for (let y = 0; y < scanRes; y += 2) { // Skip pixels for performance
        for (let x = 0; x < scanRes; x += 2) {
            const i = (y * scanRes + x) * 4;
            const r = data[i];
            const g = data[i+1];
            const b = data[i+2];

            // Filter out pure black noise
            if (r < 10 && g < 10 && b < 10) continue; 

            // Depth from luminance
            const lum = (r*0.299 + g*0.587 + b*0.114) / 255.0;
            const zDepth = -(lum * 2.0 + 1.0); // Push object 1-3 meters away

            // 1. Plot in 3D Camera Space
            tempVec.set(
                ((x / scanRes) - 0.5) * fovScale * Math.abs(zDepth),
                -((y / scanRes) - 0.5) * fovScale * Math.abs(zDepth),
                zDepth
            );

            // 2. Rotate into World Space using IMU! (The Magic Step)
            tempVec.applyQuaternion(currentQuat);

            // Save point
            pointCloudData.push({
                x: tempVec.x, y: tempVec.y, z: tempVec.z,
                r: r, g: g, b: b
            });
        }
    }

    UI.lblPts.innerText = `POINTS CAPTURED: ${pointCloudData.length.toLocaleString()}`;
    if(navigator.vibrate) navigator.vibrate([15]); // Geiger-counter feel
}

// --- BUILD 3D POINT CLOUD FOR REVIEW ---
function buildReviewScene() {
    isSweeping = false;
    UI.lblMode.innerText = "MODE: SPATIAL REVIEW";
    
    // Convert JS Array to Three.js BufferGeometry
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(pointCloudData.length * 3);
    const colors = new Float32Array(pointCloudData.length * 3);

    for (let i = 0; i < pointCloudData.length; i++) {
        const pt = pointCloudData[i];
        positions[i*3] = pt.x;
        positions[i*3+1] = pt.y;
        positions[i*3+2] = pt.z;
        
        colors[i*3] = pt.r / 255.0;
        colors[i*3+1] = pt.g / 255.0;
        colors[i*3+2] = pt.b / 255.0;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({ size: 0.03, vertexColors: true, transparent: true, opacity: 0.9 });
    
    if (finalPointsMesh) scene.remove(finalPointsMesh);
    finalPointsMesh = new THREE.Points(geometry, material);
    scene.add(finalPointsMesh);

    // Setup Camera to orbit around the cloud
    camera.position.set(0, 0, 1);
    controls.target.set(0, 0, -2); // Look at where the points spawned
    controls.enabled = true;

    // UI Updates
    UI.video.style.display = 'none';
    UI.leveler.style.display = 'none';
    UI.canvas.style.display = 'block';
    UI.controlsLive.style.display = 'none';
    UI.controlsReview.style.display = 'block';
}


// --- .PLY POINT CLOUD EXPORT ---
// PLY is the industry standard for colored point clouds
function exportPLY() {
    if (pointCloudData.length === 0) return;
    
    UI.lblPts.innerText = "WRITING .PLY FILE...";

    let ply = `ply
format ascii 1.0
element vertex ${pointCloudData.length}
property float x
property float y
property float z
property uchar red
property uchar green
property uchar blue
end_header\n`;

    // Append all points
    for (let i = 0; i < pointCloudData.length; i++) {
        const pt = pointCloudData[i];
        ply += `${pt.x.toFixed(4)} ${pt.y.toFixed(4)} ${pt.z.toFixed(4)} ${pt.r} ${pt.g} ${pt.b}\n`;
    }

    const blob = new Blob([ply], { type: 'text/plain' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'p3dk_spatial_fusion.ply';
    link.click();
    
    UI.lblPts.innerText = "EXPORT COMPLETE.";
}

// --- RENDER LOOP ---
function animate() {
    requestAnimationFrame(animate);
    
    if (isSweeping) {
        captureSweepFrame();
    }
    
    if (controls.enabled) controls.update();
    renderer.render(scene, camera);
}
animate();

// --- EVENT BINDINGS ---
UI.btnInit.addEventListener('click', async () => {
    try {
        // Request Camera
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 640 } }
        });
        UI.video.srcObject = stream;
        await UI.video.play();
        
        // Request iOS Gyro Permission if necessary
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            const permission = await DeviceOrientationEvent.requestPermission();
            if (permission !== 'granted') throw new Error("Gyro permission denied.");
        }
        setupIMU();
        
        UI.btnInit.style.display = 'none';
        UI.sweepContainer.style.display = 'block';
        UI.lblMode.innerText = "MODE: IMU READY. ZEROED.";
    } catch (e) {
        alert("Camera and Motion Sensors required for Spatial Fusion.");
        console.error(e);
    }
});

// Sweeping mechanics (Touch/Mouse down to scan)
UI.btnSweep.addEventListener('pointerdown', (e) => {
    isSweeping = true;
    UI.btnSweep.style.background = "var(--cyan)";
    UI.btnSweep.style.color = "#000";
    e.target.setPointerCapture(e.pointerId);
});

UI.btnSweep.addEventListener('pointerup', (e) => {
    isSweeping = false;
    UI.btnSweep.style.background = "";
    UI.btnSweep.style.color = "var(--cyan)";
    e.target.releasePointerCapture(e.pointerId);
});

UI.btnDone.addEventListener('click', buildReviewScene);
document.getElementById('btn-export').addEventListener('click', exportPLY);

document.getElementById('btn-discard').addEventListener('click', () => {
    pointCloudData = [];
    if (finalPointsMesh) { scene.remove(finalPointsMesh); finalPointsMesh = null; }
    
    controls.enabled = false;
    camera.position.set(0,0,0);
    camera.quaternion.identity();
    
    hasZeroedIMU = false; // Will re-zero on next sweep
    
    UI.video.style.display = 'block';
    UI.canvas.style.display = 'none';
    UI.leveler.style.display = 'block';
    UI.controlsLive.style.display = 'block';
    UI.controlsReview.style.display = 'none';
    UI.lblPts.innerText = "POINTS CAPTURED: 0";
    UI.lblMode.innerText = "MODE: IMU FUSION STANDBY";
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
