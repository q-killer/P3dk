<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>P3dK WebXR Alpha</title>
    <style>
        body, html {
            margin: 0; overflow: hidden; background-color: transparent !important;
            color: #fff; font-family: sans-serif;
        }
        #bg-fallback { position: fixed; inset: 0; background: #111; z-index: -1; }
        #ar-ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: flex-end; padding: 20px; box-sizing: border-box; z-index: 100;
        }
        .panel {
            background: rgba(0, 0, 0, 0.85); border: 2px solid #0f9;
            border-radius: 12px; padding: 20px; pointer-events: auto; backdrop-filter: blur(10px);
        }
        h1 { margin: 0 0 10px 0; font-size: 1.2rem; color: #0f9; }
        p, #status { font-size: 0.9rem; margin-bottom: 5px; color: #fff; line-height: 1.4; }
        #debug-log { 
            font-family: monospace; font-size: 0.75rem; color: #0cf; 
            margin-bottom: 15px; min-height: 4em; background: rgba(0,0,0,0.5);
            padding: 10px; border-radius: 6px; white-space: pre-wrap;
        }
        .r { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .lb { font-size: 0.8rem; font-weight: bold; color: #ccc; }
        .vl { font-size: 0.8rem; font-weight: bold; color: #0f9; }
        input[type=range] { width: 100%; margin-bottom: 10px; accent-color: #0f9; }
        button {
            width: 100%; padding: 15px; margin-bottom: 10px;
            font-size: 1.1rem; font-weight: bold; border: none;
            border-radius: 8px; cursor: pointer; transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        #btn-start { background: #0f9; color: #000; }
        #btn-stop { background: #f77; color: #fff; display: none; }
        #btn-bake { background: #ff00ff; color: #fff; display: none; }
        #btn-export { background: transparent; border: 1px solid #0cf; color: #0cf; padding: 10px; font-size: 0.9rem; display: none; }
    </style>
</head>
<body>
    <div id="bg-fallback"></div>

    <div id="ar-ui-overlay">
        <div class="panel">
            <h1>P3dK Scanner Alpha</h1>
            <div id="status">Checking AR capabilities...</div>
            <div id="debug-log">System initializing...</div>
            
            <div id="mesh-controls" style="display: none;">
                <div class="r"><span class="lb">SURFACE DENSITY</span><span class="vl" id="blobVal">0.15</span></div>
                <input type="range" id="XR_BLOB" min="0.05" max="0.5" step="0.01" value="0.15">
            </div>

            <button id="btn-start" disabled>Start AR Scan</button>
            <button id="btn-stop">Stop Scan</button>
            <button id="btn-bake">∴ BAKE WATERTIGHT MESH</button>
            <button id="btn-export">↓ Download Raw .PLY</button>
        </div>
    </div>

    <!-- Core Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug-log');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnBake = document.getElementById('btn-bake');
        const btnExport = document.getElementById('btn-export');
        const overlayEl = document.getElementById('ar-ui-overlay');
        const bgFallback = document.getElementById('bg-fallback');
        const meshControls = document.getElementById('mesh-controls');
        const sliderBlob = document.getElementById('XR_BLOB');
        const blobVal = document.getElementById('blobVal');

        sliderBlob.addEventListener('input', (e) => blobVal.textContent = e.target.value);

        let logLines = [];
        function log(msg) {
            logLines.push(`> ${msg}`);
            if(logLines.length > 5) logLines.shift(); 
            debugEl.textContent = logLines.join('\n');
            console.log(msg);
        }

        let xrSession = null;
        let pointsArray = [];
        let colorsArray = [];
        let pointCloudObject = null;
        let generatedMesh = null;
        let lastCaptureTime = 0;
        
        // --- Tuning Parameters ---
        const CAPTURE_INTERVAL_MS = 250; 
        const DEPTH_SAMPLE_STEP = 4; // Reads every 4th pixel from the hardware buffer

        // --- Dynamic Dependency Loader ---
        // Keeps the UI responsive while downloading meshing scripts
        let MarchingCubes, STLExporter;
        (async () => {
            try {
                log("Loading Mesher Addons...");
                const mc = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/objects/MarchingCubes.js');
                MarchingCubes = mc.MarchingCubes;
                const stl = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/exporters/STLExporter.js');
                STLExporter = stl.STLExporter;
                log("✔ Mesher Addons Ready.");
            } catch(e) {
                log(`⚠ Addon Error: ${e.message}`);
            }
        })();

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0); 
        renderer.xr.enabled = true; 
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dl = new THREE.DirectionalLight(0x00ffff, 1.2);
        dl.position.set(10, 20, 15);
        scene.add(dl);

        const pointsGeo = new THREE.BufferGeometry();
        pointsGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(0), 3));
        pointsGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(0), 3));
        const pointsMat = new THREE.PointsMaterial({ size: 0.02, vertexColors: true, sizeAttenuation: true });
        pointCloudObject = new THREE.Points(pointsGeo, pointsMat);
        scene.add(pointCloudObject);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- AR Capability Check ---
        async function checkXR() {
            if (!navigator.xr) return statusEl.textContent = "WebXR missing.";
            try {
                const supported = await navigator.xr.isSessionSupported('immersive-ar');
                if (supported) {
                    statusEl.textContent = "✔ ARCore Ready.";
                    btnStart.disabled = false;
                } else {
                    statusEl.textContent = "✘ immersive-ar not supported.";
                }
            } catch (err) { log(`XR Check Error: ${err.message}`); }
        }
        checkXR();

        // --- Start AR Session ---
        btnStart.addEventListener('click', async () => {
            statusEl.textContent = "Launching AR...";
            logLines = []; 
            try {
                // The Polite Config: Hardware will not panic and reject session
                const sessionInit = {
                    requiredFeatures: ['local'],
                    optionalFeatures: ['depth-sensing', 'dom-overlay'],
                    domOverlay: { root: overlayEl },
                    depthSensing: {
                        usagePreference: ['cpu-optimized', 'gpu-optimized'], 
                        dataFormatPreference: ['luminance-alpha', 'float32']
                    }
                };

                xrSession = await navigator.xr.requestSession('immersive-ar', sessionInit);
                bgFallback.style.display = 'none';
                btnStart.style.display = 'none';
                btnStop.style.display = 'block';
                btnBake.style.display = 'none';
                btnExport.style.display = 'none';
                meshControls.style.display = 'none';
                statusEl.textContent = "AR Active. Move phone to scan.";
                
                pointsArray = [];
                colorsArray = [];
                if (generatedMesh) {
                    scene.remove(generatedMesh);
                    generatedMesh.geometry.dispose();
                    generatedMesh = null;
                }
                pointCloudObject.visible = true;

                renderer.xr.setReferenceSpaceType('local');
                await renderer.xr.setSession(xrSession);
                xrSession.addEventListener('end', onSessionEnd);
            } catch (e) {
                statusEl.textContent = "AR Launch Failed.";
                log(`Fatal: ${e.message}`);
            }
        });

        btnStop.addEventListener('click', () => { if (xrSession) xrSession.end(); });

        function onSessionEnd() {
            xrSession = null;
            bgFallback.style.display = 'block'; 
            btnStart.style.display = 'block';
            btnStart.textContent = "Scan Again";
            btnStop.style.display = 'none';
            statusEl.textContent = `Scan complete! Captured ${Math.floor(pointsArray.length / 3)} points.`;
            log("Session ended. Ready to process.");
            
            if (pointsArray.length > 0) {
                if (MarchingCubes) btnBake.style.display = 'block';
                btnExport.style.display = 'block';
                if (MarchingCubes) meshControls.style.display = 'block';
                camera.position.set(0, 0, 1.5);
                camera.lookAt(0, 0, 0);
            }
        }

        // --- Core Scan Loop ---
        renderer.setAnimationLoop((timestamp, frame) => {
            if (frame && xrSession) {
                const refSpace = renderer.xr.getReferenceSpace();
                const viewerPose = frame.getViewerPose(refSpace);

                if (viewerPose) {
                    const view = viewerPose.views[0];
                    const camMatrix = new THREE.Matrix4().fromArray(view.transform.matrix);
                    
                    try {
                        const depthInfo = frame.getDepthInformation(view);
                        if (depthInfo && timestamp - lastCaptureTime > CAPTURE_INTERVAL_MS) {
                            lastCaptureTime = timestamp;
                            extractDepthRawMemory(view, depthInfo, camMatrix);
                            updatePointCloudGeometry();
                        }
                    } catch (e) { }
                }
            }
            renderer.render(scene, camera);
        });

        // --- DIRECT BINARY MEMORY EXTRACTION ---
        // DO NOT DELETE: Bypasses Samsung S21 Ultra's native aspect ratio bounds crash
        // by mapping unprojected arrays directly to physical view space.
        function extractDepthRawMemory(view, depthInfo, camMatrix) {
            const width = depthInfo.width;
            const height = depthInfo.height;
            const scale = depthInfo.rawValueToMeters;
            
            const invProj = new THREE.Matrix4().fromArray(view.projectionMatrix).invert();
            const depthToView = new THREE.Matrix4().fromArray(depthInfo.normDepthBufferFromNormView.matrix).invert();

            let rawData;
            if (xrSession.depthDataFormat === 'luminance-alpha') {
                rawData = new Uint16Array(depthInfo.data);
            } else {
                rawData = new Float32Array(depthInfo.data);
            }

            for (let y = 0; y < height; y += DEPTH_SAMPLE_STEP) {
                for (let x = 0; x < width; x += DEPTH_SAMPLE_STEP) {
                    const index = x + (y * width);
                    const depthInMeters = rawData[index] * scale;
                    
                    if (depthInMeters < 0.2 || depthInMeters > 3.0) continue;

                    const normDepthX = (x + 0.5) / width;
                    const normDepthY = (y + 0.5) / height;

                    const ptView = new THREE.Vector3(normDepthX, normDepthY, 0).applyMatrix4(depthToView);
                    if (ptView.x < 0 || ptView.x > 1 || ptView.y < 0 || ptView.y > 1) continue;

                    const ndcX = ptView.x * 2 - 1;
                    const ndcY = -(ptView.y * 2 - 1);

                    const ptCam = new THREE.Vector3(ndcX, ndcY, -1);
                    ptCam.applyMatrix4(invProj);
                    ptCam.multiplyScalar(depthInMeters / Math.abs(ptCam.z)); 
                    ptCam.applyMatrix4(camMatrix);
                    
                    pointsArray.push(ptCam.x, ptCam.y, ptCam.z);
                    const normalizedDepth = (depthInMeters - 0.2) / 2.8;
                    colorsArray.push(1.0 - normalizedDepth, 0.5, normalizedDepth);
                }
            }
            statusEl.textContent = `Scanning... Points: ${Math.floor(pointsArray.length / 3)}`;
        }

        function updatePointCloudGeometry() {
            if (pointsArray.length === 0) return;
            pointCloudObject.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pointsArray), 3));
            pointCloudObject.geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colorsArray), 3));
            pointCloudObject.geometry.attributes.position.needsUpdate = true;
            pointCloudObject.geometry.attributes.color.needsUpdate = true;
        }

        // =========================================================================
        // NATIVE JAVASCRIPT PCL PIPELINE
        // DO NOT DELETE: Replaces heavy C++ WASM library with localized math
        // to guarantee offline stability and prevent Chrome array buffer panics.
        // =========================================================================
        function cleanPointCloud(points, colors) {
            log("Running VoxelGrid Downsampling...");
            const voxelSize = 0.02; // 2cm physical grid
            const grid = new Map();
            
            // Phase 1: PassThrough and Voxelization
            for(let i=0; i<points.length; i+=3) {
                const z = points[i+2];
                if (Math.abs(z) > 2.5) continue; // Hard boundary cutoff

                const vx = Math.floor(points[i] / voxelSize);
                const vy = Math.floor(points[i+1] / voxelSize);
                const vz = Math.floor(z / voxelSize);
                const key = `${vx},${vy},${vz}`;
                
                if(!grid.has(key)) grid.set(key, { pts: [], cols: [] });
                grid.get(key).pts.push({x: points[i], y: points[i+1], z});
                grid.get(key).cols.push({r: colors[i], g: colors[i+1], b: colors[i+2]});
            }

            const vPts = [], vCols = [];
            grid.forEach(cell => {
                let cx=0, cy=0, cz=0, cr=0, cg=0, cb=0;
                const len = cell.pts.length;
                cell.pts.forEach(p => { cx+=p.x; cy+=p.y; cz+=p.z; });
                cell.cols.forEach(c => { cr+=c.r; cg+=c.g; cb+=c.b; });
                vPts.push(cx/len, cy/len, cz/len);
                vCols.push(cr/len, cg/len, cb/len);
            });
            log(`Voxelization: reduced to ${vPts.length/3} structural points.`);

            // Phase 2: Statistical Outlier Removal (SOR)
            log("Running Statistical Outlier Removal (SOR)...");
            const distances = new Float32Array(vPts.length/3);
            const sorNeighbors = 15;
            
            for(let i=0; i<vPts.length; i+=3) {
                let dists = [];
                for(let j=0; j<vPts.length; j+=3) {
                    if(i===j) continue;
                    const dx = vPts[i] - vPts[j];
                    const dy = vPts[i+1] - vPts[j+1];
                    const dz = vPts[i+2] - vPts[j+2];
                    dists.push(dx*dx + dy*dy + dz*dz); // Squared dist for speed
                }
                dists.sort((a,b) => a-b);
                let kDist = 0;
                const k = Math.min(sorNeighbors, dists.length);
                for(let n=0; n<k; n++) kDist += Math.sqrt(dists[n]);
                distances[i/3] = kDist / k;
            }

            // Calculate Mean & Standard Deviation
            let mean = 0, variance = 0;
            for(let i=0; i<distances.length; i++) mean += distances[i];
            mean /= distances.length;
            for(let i=0; i<distances.length; i++) variance += Math.pow(distances[i] - mean, 2);
            
            const stdDev = Math.sqrt(variance / distances.length);
            const threshold = mean + (1.0 * stdDev); // Cull anything beyond 1 sigma

            const finalPts = [], finalCols = [];
            for(let i=0; i<distances.length; i++) {
                if(distances[i] <= threshold) {
                    finalPts.push(vPts[i*3], vPts[i*3+1], vPts[i*3+2]);
                    finalCols.push(vCols[i*3], vCols[i*3+1], vCols[i*3+2]);
                }
            }
            
            log(`SOR cleaned ${(vPts.length - finalPts.length)/3} ghost artifacts.`);
            return { pts: finalPts, cols: finalCols };
        }

        // --- Point Cloud to Mesh (Marching Cubes) ---
        btnBake.addEventListener('click', async () => {
            if(pointsArray.length === 0 || !MarchingCubes) return;
            
            btnBake.disabled = true;
            statusEl.textContent = "Processing pristine mesh...";
            
            // Allow UI to update before locking main thread
            await new Promise(r => setTimeout(r, 50)); 

            try {
                // 1. Run Native PCL Cleaning Pipeline
                const cleanedData = cleanPointCloud(pointsArray, colorsArray);
                const cPts = cleanedData.pts;

                // 2. Setup Bounding Box for Grid
                let minX=Infinity, minY=Infinity, minZ=Infinity;
                let maxX=-Infinity, maxY=-Infinity, maxZ=-Infinity;
                for (let i=0; i<cPts.length; i+=3) {
                    if (cPts[i] < minX) minX = cPts[i]; if (cPts[i] > maxX) maxX = cPts[i];
                    if (cPts[i+1] < minY) minY = cPts[i+1]; if (cPts[i+1] > maxY) maxY = cPts[i+1];
                    if (cPts[i+2] < minZ) minZ = cPts[i+2]; if (cPts[i+2] > maxZ) maxZ = cPts[i+2];
                }
                
                const pad = Math.max(maxX-minX, maxY-minY, maxZ-minZ) * 0.15;
                minX-=pad; maxX+=pad; minY-=pad; maxY+=pad; minZ-=pad; maxZ+=pad;
                const maxDim = Math.max(maxX-minX, maxY-minY, maxZ-minZ);
                
                // 3. High resolution volumetric grid
                const res = 80; // Bumped up resolution for tighter geometry tracking
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0x00ffcc, metalness: 0.3, roughness: 0.4, side: THREE.DoubleSide 
                });
                const effect = new MarchingCubes(res, material, false, false, 500000);
                
                const userDensity = parseFloat(sliderBlob.value);
                const subtract = 12.0;

                log("Wrapping surface isosurface...");
                for (let i=0; i<cPts.length; i+=3) {
                    const px = (cPts[i] - minX) / maxDim;
                    const py = (cPts[i+1] - minY) / maxDim;
                    const pz = (cPts[i+2] - minZ) / maxDim;
                    effect.addBall(px, py, pz, userDensity, subtract, null);
                }
                
                effect.update();
                let geo = effect.geometry.clone();
                geo.applyMatrix4(new THREE.Matrix4().makeScale(maxDim/2, maxDim/2, maxDim/2));
                geo.applyMatrix4(new THREE.Matrix4().makeTranslation(minX + maxDim/2, minY + maxDim/2, minZ + maxDim/2));

                if (generatedMesh) {
                    scene.remove(generatedMesh);
                    generatedMesh.geometry.dispose();
                }

                generatedMesh = new THREE.Mesh(geo, material);
                scene.add(generatedMesh);
                
                // Keep the cleaned point cloud visible for context, just drop opacity
                pointCloudObject.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(cPts), 3));
                pointCloudObject.geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(cleanedData.cols), 3));
                pointCloudObject.material.opacity = 0.3;
                pointCloudObject.material.transparent = true;
                
                const center = new THREE.Vector3(minX + maxDim/2, minY + maxDim/2, minZ + maxDim/2);
                camera.position.set(center.x, center.y + maxDim*0.5, center.z + maxDim*1.5);
                camera.lookAt(center);

                btnBake.style.display = 'none';
                meshControls.style.display = 'none';
                
                if (STLExporter) {
                    btnExport.textContent = '↓ Download Watertight .STL';
                    btnExport.style.background = '#00ffcc';
                    btnExport.style.color = '#000';
                    
                    btnExport.onclick = () => {
                        log("Converting to STL...");
                        const stlString = new STLExporter().parse(generatedMesh, { binary: true });
                        const blob = new Blob([stlString], { type: 'application/octet-stream' });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = `P3dK_Clean_Mesh_${Date.now()}.stl`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        log("STL Exported Successfully.");
                    };
                }
                statusEl.textContent = "Alpha Mesh successful! Ready to export.";
                
            } catch (e) {
                statusEl.textContent = "Mesh generation failed.";
                log(`Error: ${e.message}`);
            } finally {
                btnBake.disabled = false;
            }
        });

        // --- Export Raw PLY ---
        btnExport.onclick = () => {
            const numPts = pointsArray.length / 3;
            if (numPts === 0) return;
            statusEl.textContent = "Generating PLY file...";
            
            let plyOut = `ply\nformat ascii 1.0\nelement vertex ${numPts}\nproperty float x\nproperty float y\nproperty float z\nproperty uchar red\nproperty uchar green\nproperty uchar blue\nend_header\n`;
            for (let i = 0; i < numPts; i++) {
                const x = pointsArray[i*3], y = pointsArray[i*3+1], z = pointsArray[i*3+2];
                const r = Math.round(colorsArray[i*3] * 255), g = Math.round(colorsArray[i*3+1] * 255), b = Math.round(colorsArray[i*3+2] * 255);
                plyOut += `${x.toFixed(5)} ${y.toFixed(5)} ${z.toFixed(5)} ${r} ${g} ${b}\n`;
            }
            
            const blob = new Blob([plyOut], {type: 'application/octet-stream'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `S21_Depth_Scan_${Date.now()}.ply`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            statusEl.textContent = "Raw Export complete!";
        };
    </script>
</body>
</html>
