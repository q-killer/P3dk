<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebXR Depth Scanner</title>
    <style>
        body, html {
            margin: 0; overflow: hidden; background-color: transparent !important;
            color: #fff; font-family: sans-serif;
        }
        #bg-fallback {
            position: fixed; inset: 0; background: #111; z-index: -1;
        }
        #ar-ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: flex-end; padding: 20px; box-sizing: border-box; z-index: 100;
        }
        .panel {
            background: rgba(0, 0, 0, 0.85); border: 2px solid #0f9;
            border-radius: 12px; padding: 20px; pointer-events: auto; backdrop-filter: blur(10px);
        }
        h1 { margin: 0 0 10px 0; font-size: 1.2rem; color: #0f9; }
        p, #status { font-size: 0.9rem; margin-bottom: 5px; color: #fff; line-height: 1.4; }
        #debug-log { 
            font-family: monospace; font-size: 0.75rem; color: #0cf; 
            margin-bottom: 15px; min-height: 4em; background: rgba(0,0,0,0.5);
            padding: 10px; border-radius: 6px; white-space: pre-wrap;
        }
        button {
            width: 100%; padding: 15px; margin-bottom: 10px;
            font-size: 1.1rem; font-weight: bold; border: none;
            border-radius: 8px; cursor: pointer; transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        #btn-start { background: #0f9; color: #000; }
        #btn-stop { background: #f77; color: #fff; display: none; }
        #btn-export { background: #0cf; color: #000; display: none; }
    </style>
</head>
<body>
    <div id="bg-fallback"></div>

    <div id="ar-ui-overlay">
        <div class="panel">
            <h1>P3dK WebXR Scanner</h1>
            <div id="status">Checking AR capabilities...</div>
            <div id="debug-log">System initializing...</div>
            
            <button id="btn-start" disabled>Start AR Scan</button>
            <button id="btn-stop">Stop Scan</button>
            <button id="btn-export">Export .PLY</button>
        </div>
    </div>

    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug-log');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnExport = document.getElementById('btn-export');
        const overlayEl = document.getElementById('ar-ui-overlay');
        const bgFallback = document.getElementById('bg-fallback');

        let logLines = [];
        function log(msg) {
            logLines.push(`> ${msg}`);
            if(logLines.length > 5) logLines.shift(); 
            debugEl.textContent = logLines.join('\n');
            console.log(msg);
        }

        let xrSession = null;
        let pointsArray = [];
        let colorsArray = [];
        let pointCloudObject = null;
        let lastCaptureTime = 0;
        const CAPTURE_INTERVAL_MS = 250; 
        const DEPTH_SAMPLE_STEP = 4; 

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0); 
        renderer.xr.enabled = true; 
        document.body.appendChild(renderer.domElement);

        const pointsGeo = new THREE.BufferGeometry();
        pointsGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(0), 3));
        pointsGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(0), 3));
        const pointsMat = new THREE.PointsMaterial({ size: 0.02, vertexColors: true, sizeAttenuation: true });
        pointCloudObject = new THREE.Points(pointsGeo, pointsMat);
        scene.add(pointCloudObject);

        // --- GPU Extraction Shader Setup ---
        let glBinding = null;
        let depthRenderTarget = null;
        let depthBuffer = null;
        const depthQuadScene = new THREE.Scene();
        const depthOrthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const depthMaterial = new THREE.ShaderMaterial({
            uniforms: { 
                tDepth: { value: null },
                isLuminanceAlpha: { value: 0.0 },
                rawValueToMeters: { value: 1.0 }
            },
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
            fragmentShader: `
                uniform sampler2D tDepth;
                uniform float isLuminanceAlpha;
                uniform float rawValueToMeters;
                varying vec2 vUv;

                // Pack a float into an RGBA8 vector
                vec4 packFloat(float depth) {
                    float v = depth / 10.0; // clamp max 10m
                    vec4 enc = vec4(1.0, 255.0, 65025.0, 16581375.0) * v;
                    enc = fract(enc);
                    enc -= enc.yzww * vec4(1.0/255.0, 1.0/255.0, 1.0/255.0, 0.0);
                    return enc;
                }

                void main() {
                    // WebGL readPixels natively inverts Y, so we flip vUv.y here
                    vec4 texel = texture2D(tDepth, vec2(vUv.x, 1.0 - vUv.y));
                    float depth = 0.0;
                    
                    if (isLuminanceAlpha > 0.5) {
                        float rawDepth = (texel.r * 255.0) + (texel.a * 65280.0);
                        depth = rawDepth * rawValueToMeters;
                    } else {
                        depth = texel.r * rawValueToMeters;
                    }
                    gl_FragColor = packFloat(depth);
                }
            `
        });
        depthQuadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), depthMaterial));

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- AR Capability Check ---
        async function checkXR() {
            if (window.location.protocol === 'file:') {
                statusEl.textContent = "⚠ BLOCKED: CANNOT RUN FROM LOCAL FILE";
                log("Fatal: Chrome blocks WebXR on file:/// URLs. Host on HTTPS.");
                return;
            }
            if (!navigator.xr) {
                statusEl.textContent = "WebXR missing. Check Browser/HTTPS.";
                return;
            }
            try {
                const supported = await navigator.xr.isSessionSupported('immersive-ar');
                if (supported) {
                    statusEl.textContent = "✔ ARCore Ready.";
                    log("Awaiting start...");
                    btnStart.disabled = false;
                } else {
                    statusEl.textContent = "✘ immersive-ar not supported.";
                }
            } catch (err) {
                log(`XR Check Error: ${err.message}`);
            }
        }
        checkXR();

        // --- Start AR Session ---
        btnStart.addEventListener('click', async () => {
            statusEl.textContent = "Launching AR...";
            logLines = []; 
            
            try {
                // We STRICTLY request depth-sensing to force Chrome to give it to us.
                // We provide ALL permutations so Samsung cannot reject the config.
                const sessionInit = {
                    requiredFeatures: ['local', 'depth-sensing'],
                    optionalFeatures: ['dom-overlay'],
                    domOverlay: { root: overlayEl },
                    depthSensing: {
                        usagePreference: ['cpu-optimized', 'gpu-optimized'], 
                        dataFormatPreference: ['float32', 'luminance-alpha']
                    }
                };

                xrSession = await navigator.xr.requestSession('immersive-ar', sessionInit);
                
                const granted = xrSession.grantedFeatures || [];
                log(`Granted: ${granted.join(', ')}`);
                log(`Depth Mode: ${xrSession.depthUsage} / ${xrSession.depthDataFormat}`);

                bgFallback.style.display = 'none';
                btnStart.style.display = 'none';
                btnStop.style.display = 'block';
                btnExport.style.display = 'none';
                statusEl.textContent = "AR Active. Move phone to scan.";
                
                pointsArray = [];
                colorsArray = [];

                renderer.xr.setReferenceSpaceType('local');
                await renderer.xr.setSession(xrSession);
                xrSession.addEventListener('end', onSessionEnd);

            } catch (e) {
                statusEl.textContent = "AR Launch Failed.";
                log(`Fatal: ${e.message}`);
            }
        });

        btnStop.addEventListener('click', () => {
            if (xrSession) xrSession.end(); 
        });

        function onSessionEnd() {
            xrSession = null;
            bgFallback.style.display = 'block'; 
            btnStart.style.display = 'block';
            btnStop.style.display = 'none';
            statusEl.textContent = `Scan complete! ${Math.floor(pointsArray.length / 3)} points.`;
            log("Session ended.");
            if (pointsArray.length > 0) btnExport.style.display = 'block';
        }

        // --- Core Scan Loop ---
        renderer.setAnimationLoop((timestamp, frame) => {
            if (frame && xrSession) {
                const refSpace = renderer.xr.getReferenceSpace();
                const viewerPose = frame.getViewerPose(refSpace);

                if (viewerPose) {
                    const view = viewerPose.views[0];
                    const camMatrix = new THREE.Matrix4().fromArray(view.transform.matrix);
                    
                    try {
                        // Branch based on what the Phone forced us to use
                        if (xrSession.depthUsage === 'cpu-optimized') {
                            const depthInfo = frame.getDepthInformation(view);
                            if (depthInfo && timestamp - lastCaptureTime > CAPTURE_INTERVAL_MS) {
                                lastCaptureTime = timestamp;
                                extractDepthPointsCPU(view, depthInfo, camMatrix);
                                updatePointCloudGeometry();
                            }
                        } else if (xrSession.depthUsage === 'gpu-optimized') {
                            if (!glBinding) glBinding = new XRWebGLBinding(xrSession, renderer.getContext());
                            const depthInfo = glBinding.getDepthInformation(view);
                            if (depthInfo && timestamp - lastCaptureTime > CAPTURE_INTERVAL_MS) {
                                lastCaptureTime = timestamp;
                                extractDepthPointsGPU(view, depthInfo, camMatrix);
                                updatePointCloudGeometry();
                            }
                        }
                    } catch (e) {
                        if(timestamp % 1000 < 50) log(`Extract Error: ${e.message}`);
                    }
                }
            }
            renderer.render(scene, camera);
        });

        // --- CPU EXTRACTION ---
        function extractDepthPointsCPU(view, depthInfo, camMatrix) {
            const width = depthInfo.width;
            const height = depthInfo.height;
            const invProj = new THREE.Matrix4().fromArray(view.projectionMatrix).invert();

            for (let y = 0; y < height; y += DEPTH_SAMPLE_STEP) {
                for (let x = 0; x < width; x += DEPTH_SAMPLE_STEP) {
                    const normX = x / width;
                    const normY = y / height;
                    
                    const depthInMeters = depthInfo.getDepthInMeters(normX, normY);
                    if (depthInMeters < 0.2 || depthInMeters > 4.0) continue;

                    const ndcX = normX * 2 - 1;
                    const ndcY = -(normY * 2 - 1);

                    const ptCam = new THREE.Vector3(ndcX, ndcY, -1);
                    ptCam.applyMatrix4(invProj);
                    ptCam.multiplyScalar(depthInMeters / Math.abs(ptCam.z)); 
                    ptCam.applyMatrix4(camMatrix);
                    
                    pointsArray.push(ptCam.x, ptCam.y, ptCam.z);
                    
                    const normalizedDepth = (depthInMeters - 0.2) / 3.8;
                    colorsArray.push(1.0 - normalizedDepth, 0.5, normalizedDepth);
                }
            }
            statusEl.textContent = `Scanning (CPU)... Points: ${Math.floor(pointsArray.length / 3)}`;
        }

        // --- GPU EXTRACTION SHADER FALLBACK ---
        function extractDepthPointsGPU(view, depthInfo, camMatrix) {
            const width = depthInfo.width;
            const height = depthInfo.height;
            const invProj = new THREE.Matrix4().fromArray(view.projectionMatrix).invert();

            depthMaterial.uniforms.tDepth.value = depthInfo.texture;
            depthMaterial.uniforms.isLuminanceAlpha.value = xrSession.depthDataFormat === 'luminance-alpha' ? 1.0 : 0.0;
            depthMaterial.uniforms.rawValueToMeters.value = depthInfo.rawValueToMeters;

            if (!depthRenderTarget || depthRenderTarget.width !== width || depthRenderTarget.height !== height) {
                if (depthRenderTarget) depthRenderTarget.dispose();
                depthRenderTarget = new THREE.WebGLRenderTarget(width, height, {
                    format: THREE.RGBAFormat,
                    type: THREE.UnsignedByteType,
                    minFilter: THREE.NearestFilter,
                    magFilter: THREE.NearestFilter
                });
                depthBuffer = new Uint8Array(width * height * 4);
            }

            // Render depth texture into our RGBA render target
            const prevRT = renderer.getRenderTarget();
            renderer.setRenderTarget(depthRenderTarget);
            renderer.render(depthQuadScene, depthOrthoCamera);
            renderer.readRenderTargetPixels(depthRenderTarget, 0, 0, width, height, depthBuffer);
            renderer.setRenderTarget(prevRT);

            // Decode the packed float bytes
            for (let y = 0; y < height; y += DEPTH_SAMPLE_STEP) {
                for (let x = 0; x < width; x += DEPTH_SAMPLE_STEP) {
                    const idx = (y * width + x) * 4;
                    const r = depthBuffer[idx];
                    const g = depthBuffer[idx+1];
                    const b = depthBuffer[idx+2];
                    const a = depthBuffer[idx+3];

                    const normDepth = (r / 255.0) + (g / 65025.0) + (b / 16581375.0) + (a / 4228250625.0);
                    const depthInMeters = normDepth * 10.0;

                    if (depthInMeters < 0.2 || depthInMeters > 4.0) continue;

                    const normX = x / width;
                    const normY = y / height;
                    const ndcX = normX * 2 - 1;
                    const ndcY = -(normY * 2 - 1);

                    const ptCam = new THREE.Vector3(ndcX, ndcY, -1);
                    ptCam.applyMatrix4(invProj);
                    ptCam.multiplyScalar(depthInMeters / Math.abs(ptCam.z)); 
                    ptCam.applyMatrix4(camMatrix);
                    
                    pointsArray.push(ptCam.x, ptCam.y, ptCam.z);
                    
                    const normalizedDepth = (depthInMeters - 0.2) / 3.8;
                    colorsArray.push(1.0 - normalizedDepth, 0.5, normalizedDepth);
                }
            }
            statusEl.textContent = `Scanning (GPU)... Points: ${Math.floor(pointsArray.length / 3)}`;
        }

        function updatePointCloudGeometry() {
            if (pointsArray.length === 0) return;
            pointCloudObject.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pointsArray), 3));
            pointCloudObject.geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colorsArray), 3));
            pointCloudObject.geometry.attributes.position.needsUpdate = true;
            pointCloudObject.geometry.attributes.color.needsUpdate = true;
        }

        // --- Export to PLY ---
        btnExport.addEventListener('click', () => {
            const numPts = pointsArray.length / 3;
            if (numPts === 0) return;

            statusEl.textContent = "Generating PLY file...";
            
            let plyOut = `ply\nformat ascii 1.0\nelement vertex ${numPts}\nproperty float x\nproperty float y\nproperty float z\nproperty uchar red\nproperty uchar green\nproperty uchar blue\nend_header\n`;
            
            for (let i = 0; i < numPts; i++) {
                const x = pointsArray[i*3], y = pointsArray[i*3+1], z = pointsArray[i*3+2];
                const r = Math.round(colorsArray[i*3] * 255), g = Math.round(colorsArray[i*3+1] * 255), b = Math.round(colorsArray[i*3+2] * 255);
                plyOut += `${x.toFixed(5)} ${y.toFixed(5)} ${z.toFixed(5)} ${r} ${g} ${b}\n`;
            }
            
            const blob = new Blob([plyOut], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `S21_Depth_Scan_${Date.now()}.ply`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            statusEl.textContent = "Export complete!";
        });
    </script>
</body>
</html>
