<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
import { pipeline, env, RawImage } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';
env.allowLocalModels = false;

const $ = id => document.getElementById(id);
const stat = m => $('stat').innerHTML = m;
const subStat = m => $('sub-stat').innerHTML = m;

/* ---------- Three.js Scene Setup ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); 
renderer.setSize(innerWidth, innerHeight);
$('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.001, 5000);
cam.position.set(0, 0, 4);

const ctrl = new OrbitControls(cam, renderer.domElement); 
ctrl.enableDamping = true; ctrl.rotateSpeed = 0.7;

const grid = new THREE.GridHelper(10, 20, 0x00f0ff, 0x0a2a33);
grid.position.y = -2; grid.material.transparent = true; grid.material.opacity = 0.25; 
scene.add(grid);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dl = new THREE.DirectionalLight(0xffffff, 1.2); 
dl.position.set(1, 2, 1.5); 
scene.add(dl);

let cloud = null;          
let plyRows = null;       
let cachedScan = null;     

addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight; 
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function loop() { 
  requestAnimationFrame(loop); 
  ctrl.update(); 
  renderer.render(scene, cam); 
})();

/* ---------- Unified Mode Architecture ---------- */
let activeMode = 'hybrid'; // 'hybrid' or 'xr'
let xrSupported = false;

async function checkXrSupport() {
  if (navigator.xr) {
    try {
      xrSupported = await navigator.xr.isSessionSupported('immersive-ar');
      if (xrSupported) {
        $('tabXr').disabled = false;
        stat('System Ready');
        subStat('Metric WebXR & Monocular Hybrid Engines Loaded');
      } else {
        $('tabXr').disabled = true;
        $('tabXr').style.opacity = '0.35';
        $('tabXr').title = "WebXR immersive-ar depth unavailable on this browser/OS";
      }
    } catch(e) {
      console.warn("WebXR feature check failed", e);
    }
  }
}

// Switch UI tabs
$('tabHybrid').onclick = () => selectMode('hybrid');
$('tabXr').onclick = () => { if(xrSupported) selectMode('xr'); };

function selectMode(mode) {
  if(accumulating) stopScan();
  if(cloud) { scene.remove(cloud); cloud.geometry.dispose(); cloud.material.dispose(); cloud = null; }
  activeMode = mode;
  
  if(mode === 'hybrid') {
    $('tabHybrid').classList.add('active');
    $('tabXr').classList.remove('active');
    $('controlsHybrid').style.display = 'grid';
    $('controlsXr').style.display = 'none';
    $('bImu').style.display = 'block';
    
    // Readjust bottom bar geometry
    $('bCam').style.display = 'block';
    $('bScan').style.gridColumn = 'span 4';
    $('bScan').textContent = '⚡ AUTO SCAN';
    $('bReset').style.gridColumn = 'span 2';
    $('bExport').style.display = 'block';
    $('bSolid').style.display = 'block';
    
    if(stream) {
      $('cam').style.display = 'block';
      $('bScan').disabled = !cvReady;
    } else {
      $('bScan').disabled = true;
    }
  } else {
    $('tabXr').classList.add('active');
    $('tabHybrid').classList.remove('active');
    $('controlsXr').style.display = 'grid';
    $('controlsHybrid').style.display = 'none';
    $('bImu').style.display = 'none';
    
    // Readjust bottom bar layout for Volumetric XR Mode
    $('bCam').style.display = 'none';
    $('bScan').style.gridColumn = 'span 6';
    $('bScan').textContent = '◎ START XR SCAN';
    $('bReset').style.gridColumn = 'span 4';
    $('bExport').style.display = 'none';
    $('bSolid').style.display = 'none';
    
    $('cam').style.display = 'none';
    $('bScan').disabled = false;
  }
}

/* ---------- IMU telemetry / Gyroscope Integration ---------- */
let imuAvailable = false;
let currentGyroState = { beta: 0, gamma: 0, alpha: 0 };

$('bImu').onclick = async () => {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const state = await DeviceOrientationEvent.requestPermission();
      if (state === 'granted') {
        bindIMU();
      } else {
        $('imu-readout').textContent = "GYRO: DENIED";
      }
    } catch (e) {
      console.error(e);
      $('imu-readout').textContent = "GYRO: BLOCKED";
    }
  } else {
    bindIMU();
  }
};

function bindIMU() {
  window.addEventListener('deviceorientation', (e) => {
    imuAvailable = true;
    currentGyroState = { beta: e.beta || 0, gamma: e.gamma || 0, alpha: e.alpha || 0 };
    $('imu-readout').style.display = 'block';
    $('imu-readout').textContent = `GYRO: P:${Math.round(currentGyroState.beta)}° R:${Math.round(currentGyroState.gamma)}° Y:${Math.round(currentGyroState.alpha)}°`;
    $('bImu').style.borderColor = 'var(--gd)';
    $('bImu').style.background = 'rgba(57,255,139,.1)';
  });
}

/* ---------- OpenCV ready gate ---------- */
let cvReady=false;
function whenCv(){ 
  if(window.cv && cv.Mat){ 
    cvReady=true; 
    if(activeMode === 'hybrid') {
      stat('System Online'); subStat('Hybrid Core active · Open camera'); $('bScan').disabled = !stream;
    }
    $('bCam').disabled = false;
    checkXrSupport();
  }
  else if(window.cv && cv.onRuntimeInitialized !== undefined){ 
    cv.onRuntimeInitialized=()=>{ 
      cvReady=true; 
      if(activeMode === 'hybrid') {
        stat('System Online'); subStat('Hybrid Core active · Open camera'); $('bScan').disabled = !stream;
      }
      $('bCam').disabled = false;
      checkXrSupport();
    }; 
  }
  else { setTimeout(whenCv,200); }
}
whenCv();

/* ---------- camera stream ---------- */
let stream=null;
$('bCam').onclick = async ()=>{
  if(stream){ 
    stream.getTracks().forEach(t=>t.stop()); stream=null; $('cam').style.display='none'; 
    $('bCam').textContent='◉ CAMERA'; $('bScan').disabled=true; stopScan(); return; 
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}}});
    const v=$('cam'); v.srcObject=stream; v.style.display='block'; 
    $('bCam').textContent='◉ STOP CAM'; $('bScan').disabled=!cvReady; 
    stat('Optics Online'); subStat(cvReady ? 'Point at object, tap AUTO SCAN' : 'Waiting for Core…');
  } catch(e) { stat('Camera Denied'); subStat(e.message); }
};

const PROC_W = 480;
function grab() {
  const v=$('cam'); if(!v.videoWidth) return null;
  const w=PROC_W, h=Math.round(PROC_W * v.videoHeight / v.videoWidth);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const cx=c.getContext('2d'); cx.drawImage(v,0,0,w,h);
  const id=cx.getImageData(0,0,w,h);
  const rgba=cv.matFromImageData(id);
  const gray=new cv.Mat(); cv.cvtColor(rgba,gray,cv.COLOR_RGBA2GRAY); rgba.delete();
  return { gray, color:id.data, w, h };
}

function detect(gray, n) {
  const orb=new cv.ORB(n), kp=new cv.KeyPointVector(), des=new cv.Mat(), mask=new cv.Mat();
  orb.detectAndCompute(gray, mask, kp, des); mask.delete(); orb.delete();
  return { kp, des };
}

function matchPairs(desA, desB) {
  const bf=new cv.BFMatcher(cv.NORM_HAMMING,false), mm=new cv.DMatchVectorVector();
  bf.knnMatch(desA, desB, mm, 2);
  const good=[];
  for(let i=0; i<mm.size(); i++){ 
    const m=mm.get(i);
    if(m.size()>=2){ 
      const a=m.get(0), b=m.get(1); 
      if(a.distance < 0.75 * b.distance) good.push({q:a.queryIdx, t:a.trainIdx}); m.delete?.(); 
    } 
  }
  mm.delete(); bf.delete();
  return good;
}

/* ================= MODE B: Multi-Frame SLAM Pipeline ================= */
const PAR_STEP = 0.08;
let accumulating=false, refFrame=null, accTimer=null;
let anchorMap=null, keyframes=0, lastKfPar=0, refScaleSet=false;

function stopScan() { 
  accumulating=false; if(accTimer){ clearTimeout(accTimer); accTimer=null; }
  $('bScan').classList.remove('armed'); $('meter-container').style.display='none';
  if(refFrame){ refFrame.gray.delete(); refFrame.kp.delete(); refFrame.des.delete(); refFrame=null; } 
  anchorMap=null;
}

function startHybridScan() {
  const g=grab(); if(!g){ subStat('No video frame yet'); return; }
  const det=detect(g.gray, 1500);
  if(det.des.rows<30){ g.gray.delete(); det.kp.delete(); det.des.delete(); subStat('Anchor too featureless — aim at texture'); return; }
  
  refFrame={ ...g, ...det, gyro: { ...currentGyroState } };
  anchorMap=new Map(); keyframes=0; lastKfPar=0; refScaleSet=false;
  accumulating=true; 
  $('bScan').classList.add('armed'); $('bScan').textContent='■ FINISH SCAN';
  $('meter-container').style.display='flex';
  
  stat('Reference Locked'); subStat('Orbit slowly. Keep target centred.');
  accStep();
}

function accStep(){
  if(!accumulating) return;
  let g=null, det=null;
  try{
    g=grab(); if(!g){ accTimer=setTimeout(accStep,200); return; }
    det=detect(g.gray, 1500);
    const good=(refFrame.des.rows && det.des.rows) ? matchPairs(refFrame.des, det.des) : [];
    
    if(good.length<15){ 
      det.kp.delete(); det.des.delete(); g.gray.delete();
      if(keyframes>=2){ finishAccum(); return; }
      $('meter-label').textContent='KEEP REFERENCE IN VIEW'; $('meter-label').style.color='var(--wrn)';
      accTimer=setTimeout(accStep,200); return;
    }
    
    $('meter-label').style.color='var(--gd)';
    const disps=[]; for(const m of good){ const a=refFrame.kp.get(m.q).pt, b=det.kp.get(m.t).pt; disps.push(Math.hypot(a.x-b.x,a.y-b.y)); }
    disps.sort((x,y)=>x-y); const med=disps[disps.length>>1]/g.w;
    
    const fire=0.08;
    const n=anchorMap.size;
    $('meterFill').style.width=Math.min(100, n/200*100)+'%';
    $('meter-label').textContent=`KF: ${keyframes} | Anchors: ${n} | Parallax: ${(med*100).toFixed(0)}%`;

    // Uncapped keyframe promotion
    if(med>=fire && med>=lastKfPar+PAR_STEP){
      const currentProbeGyro = { ...currentGyroState };
      const res=poseAndTriangulate(refFrame, det, good, currentProbeGyro);
      if(res){
        if(!refScaleSet){
          for(const p of res.pts) anchorMap.set(p.qi,{px:p.px,py:p.py,z:p.z,n:1});
          refScaleSet=true; keyframes=1; lastKfPar=med;
        } else {
          const shared=res.pts.filter(p=>anchorMap.has(p.qi));
          if(shared.length>=6){
            const ratios=shared.map(p=>anchorMap.get(p.qi).z/p.z).filter(r=>isFinite(r)&&r>0).sort((a,b)=>a-b);
            const s=ratios[ratios.length>>1];
            if(isFinite(s)&&s>0){
              for(const p of res.pts){ 
                const zs=p.z*s;
                if(anchorMap.has(p.qi)){ const e=anchorMap.get(p.qi); e.z=(e.z*e.n+zs)/(e.n+1); e.n++; }
                else anchorMap.set(p.qi,{px:p.px,py:p.py,z:zs,n:1}); 
              }
              keyframes++; lastKfPar=med;
            }
          }
        }
      }
      det.kp.delete(); det.des.delete(); g.gray.delete();
      accTimer=setTimeout(accStep,120); return;
    }
    det.kp.delete(); det.des.delete(); g.gray.delete();
    accTimer=setTimeout(accStep,120);
  }catch(e){
    if(g){ try{g.gray.delete();}catch{} } if(det){ try{det.kp.delete();det.des.delete();}catch{} }
    stat('Accum error'); subStat(e.message); console.error(e);
    accumulating=false; $('meter-container').style.display='none'; $('bScan').textContent='⚡ AUTO SCAN'; $('bScan').classList.remove('armed');
  }
}

function finishAccum(){
  accumulating=false; if(accTimer){ clearTimeout(accTimer); accTimer=null; }
  $('bScan').classList.remove('armed'); $('bScan').textContent='⚡ AUTO SCAN'; $('meter-container').style.display='none';
  const A = refFrame ? { color:refFrame.color, w:refFrame.w, h:refFrame.h } : null;
  if(refFrame){ refFrame.gray.delete(); refFrame.kp.delete(); refFrame.des.delete(); refFrame=null; }
  
  if(!A || !anchorMap || anchorMap.size<30){ 
    stat('Not enough anchors'); subStat(`Only ${anchorMap?anchorMap.size:0} — orbit the object more`); 
    anchorMap=null; return; 
  }
  
  const pairs=[...anchorMap.values()].map(e=>({px:e.px,py:e.py,z:e.z}));
  stat('<span class="spin"></span>Phase 1: Fusing Data'); subStat(`${pairs.length} multi-view anchors...`);
  anchorMap=null;
  
  setTimeout(() => densify(A, { pairs }), 50);
}

/* ================= Pure JS SfM Helpers with Frobenius gyro priors ================= */
const mul=(P,Q)=>{ const a=P.length,b=Q[0].length,c=Q.length,R=[]; for(let i=0;i<a;i++){R[i]=[];for(let j=0;j<b;j++){let s=0;for(let k=0;k<c;k++)s+=P[i][k]*Q[k][j];R[i][j]=s;}} return R; };
const tT=M=>M[0].map((_,j)=>M.map(r=>r[j]));
const mv3=(M,v)=>[M[0][0]*v[0]+M[0][1]*v[1]+M[0][2]*v[2], M[1][0]*v[0]+M[1][1]*v[1]+M[1][2]*v[2], M[2][0]*v[0]+M[2][1]*v[1]+M[2][2]*v[2]];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const nrm=v=>{ const n=Math.hypot(...v)||1; return v.map(x=>x/n); };
const det3=M=>M[0][0]*(M[1][1]*M[2][2]-M[1][2]*M[2][1])-M[0][1]*(M[1][0]*M[2][2]-M[1][2]*M[2][0])+M[0][2]*(M[1][0]*M[2][1]-M[1][1]*M[2][0]);

function jacobi(S){
  const n=S.length; let A=S.map(r=>r.slice()); let V=A.map((_,i)=>A.map((_,j)=>i===j?1:0));
  for(let sweep=0;sweep<24;sweep++){
    let off=0; for(let p=0;p<n;p++)for(let q=p+1;q<n;q++) off+=A[p][q]*A[p][q];
    if(off<1e-24) break;
    for(let p=0;p<n;p++)for(let q=p+1;q<n;q++){
      if(Math.abs(A[p][q])<1e-300) continue;
      const phi=0.5*Math.atan2(2*A[p][q], A[p][p]-A[q][q]), c=Math.cos(phi), s=Math.sin(phi);
      const J=A.map((_,i)=>A.map((_,j)=>i===j?1:0));
      J[p][p]=c; J[q][q]=c; J[p][q]=-s; J[q][p]=s;       
      A=mul(mul(tT(J),A),J); V=mul(V,J);                  
    }
  }
  return { val:A.map((_,i)=>A[i][i]), V };
}
const colOf=(V,c)=>[V[0][c],V[1][c],V[2][c]];
function nullVec(S){ const {val,V}=jacobi(S); let mi=0; for(let i=1;i<S.length;i++) if(val[i]<val[mi]) mi=i; return S.map((_,r)=>V[r][mi]); }

function eightPoint(idx, x1,y1,x2,y2){
  const M=Array.from({length:9},()=>new Array(9).fill(0));
  for(const i of idx){ const r=[x1[i]*x2[i],y1[i]*x2[i],x2[i], x1[i]*y2[i],y1[i]*y2[i],y2[i], x1[i],y1[i],1];
    for(let a=0;a<9;a++)for(let b=0;b<9;b++) M[a][b]+=r[a]*r[b]; }
  const e=nullVec(M); return [[e[0],e[1],e[2]],[e[3],e[4],e[5]],[e[6],e[7],e[8]]];
}

const sampson=(E,a,b)=>{ 
  const Ea=mv3(E,a), Etb=mv3(tT(E),b), num=(b[0]*Ea[0]+b[1]*Ea[1]+b[2]*Ea[2]);
  const den=Ea[0]*Ea[0]+Ea[1]*Ea[1]+Etb[0]*Etb[0]+Etb[1]*Etb[1]; return num*num/(den||1e-12); };

function decomposeE(E){
  const ETE=mul(tT(E),E), {val,V}=jacobi(ETE); 
  const ord=[0,1,2].sort((i,j)=>val[j]-val[i]);           
  const v1=colOf(V,ord[0]);
  const v2=colOf(V,ord[1]);
  const v3=colOf(V,ord[2]);
  let Vm=[[v1[0],v2[0],v3[0]],[v1[1],v2[1],v3[1]],[v1[2],v2[2],v3[2]]];
  let u1=nrm(mv3(E,v1));
  let u2=nrm(mv3(E,v2));
  let u3=cross(u1,u2);
  let Um=[[u1[0],u2[0],u3[0]],[u1[1],u2[1],u3[1]],[u1[2],u2[2],u3[2]]];
  if(det3(Um)<0){ Um=Um.map(r=>[r[0],r[1],-r[2]]); } if(det3(Vm)<0){ Vm=Vm.map(r=>[r[0],r[1],-r[2]]); }
  const W=[[0,-1,0],[1,0,0],[0,0,1]];
  const Vt=tT(Vm);
  let Ra=mul(mul(Um,W),Vt), Rb=mul(mul(Um,tT(W)),Vt);
  if(det3(Ra)<0) Ra=Ra.map(r=>r.map(x=>-x)); if(det3(Rb)<0) Rb=Rb.map(r=>r.map(x=>-x));
  const t=[Um[0][2],Um[1][2],Um[2][2]];
  const tn=t.map(x=>-x);
  return [{R:Ra,t},{R:Ra,t:tn},{R:Rb,t},{R:Rb,t:tn}];
}

function triangulate(R,t,a,b){
  const r3=[b[0]*R[2][0]-R[0][0], b[0]*R[2][1]-R[0][1], b[0]*R[2][2]-R[0][2], b[0]*t[2]-t[0]];
  const r4=[b[1]*R[2][0]-R[1][0], b[1]*R[2][1]-R[1][1], b[1]*R[2][2]-R[1][2], b[1]*t[2]-t[1]];
  const rows=[[-1,0,a[0],0],[0,-1,a[1],0],r3,r4];
  const M=Array.from({length:4},()=>new Array(4).fill(0));
  for(const rr of rows)for(let i=0;i<4;i++)for(let j=0;j<4;j++) M[i][j]+=rr[i]*rr[j];
  const X=nullVec(M);
  const w=X[3]; if(Math.abs(w)<1e-12) return null;
  const P=[X[0]/w,X[1]/w,X[2]/w]; 
  const z2=R[2][0]*P[0]+R[2][1]*P[1]+R[2][2]*P[2]+t[2];
  return { P, z1:P[2], z2 };
}

/* ---------- Pose & Triangulate with Frobenius Rotation Matching ---------- */
function poseAndTriangulate(A, B, good, probeGyro){
  try{
    const n=good.length;
    const w=A.w; if(n<20) return null;
    const f=(0.5*w)/Math.tan(0.5*(+$('fov').value)*Math.PI/180);
    const cx=w/2;
    const cy=A.h/2;
    const x1=[];
    const y1=[];
    const x2=[];
    const y2=[];
    for(const m of good){ const p=A.kp.get(m.q).pt, q=B.kp.get(m.t).pt;
      x1.push((p.x-cx)/f); y1.push((p.y-cy)/f); x2.push((q.x-cx)/f); y2.push((q.y-cy)/f); }
    const SAMP=2e-4; 
    let bestE=null;
    let bestIn=-1;
    let bestMask=null;
    for(let it=0; it<220; it++){
      const s=new Set(); while(s.size<8) s.add((Math.random()*n)|0);
      let E; try{ E=eightPoint([...s], x1,y1,x2,y2); }catch{ continue; }
      let cnt=0; const mask=new Uint8Array(n);
      for(let i=0;i<n;i++){ if(sampson(E,[x1[i],y1[i],1],[x2[i],y2[i],1])<SAMP){ mask[i]=1; cnt++; } }
      if(cnt>bestIn){ bestIn=cnt; bestE=E; bestMask=mask; }
    }
    if(!bestE || bestIn<15) return null;
    const inl=[]; for(let i=0;i<n;i++) if(bestMask[i]) inl.push(i);
    const E=eightPoint(inl, x1,y1,x2,y2);
    
    // Construct Gyroscopic reference rotation (pitch, yaw, roll delta mapping)
    let Rgyro = null;
    if(imuAvailable && A.gyro) {
      const dp = (probeGyro.beta - A.gyro.beta) * Math.PI / 180;
      const dy = (probeGyro.alpha - A.gyro.alpha) * Math.PI / 180;
      const dr = (probeGyro.gamma - A.gyro.gamma) * Math.PI / 180;
      
      const cp = Math.cos(dp);
      const sp = Math.sin(dp);
      const cy = Math.cos(dy);
      const sy = Math.sin(dy);
      const cr = Math.cos(dr);
      const sr = Math.sin(dr);

      Rgyro = [
        [cy*cr, -cy*sr, sy],
        [sp*sy*cr + cp*sr, -sp*sy*sr + cp*cr, -sp*cy],
        [-cp*sy*cr + sp*sr, cp*sy*sr + sp*cr, cp*cy]
      ];
    }

    const cands=decomposeE(E); 
    let best=null;
    let bestFront=-1;
    let bestMatchError = Infinity;
    
    for(const c of cands){ 
      let front=0;
      for(const i of inl){ const r=triangulate(c.R,c.t,[x1[i],y1[i],1],[x2[i],y2[i],1]); if(r&&r.z1>0&&r.z2>0) front++; }
      
      if(Rgyro) {
        // IMU-Assist: Minimise Frobenius norm distance to physical gyro sensor
        let err = 0;
        for(let r=0; r<3; r++) {
          for(let cl=0; cl<3; cl++) {
            err += Math.pow(c.R[r][cl] - Rgyro[r][cl], 2);
          }
        }
        if(front >= 8 && err < bestMatchError) {
          bestMatchError = err;
          bestFront = front;
          best = c;
        }
      } else {
        // Fallback to traditional cheirality priority
        if(front>bestFront){ bestFront=front; best=c; } 
      }
    }
    
    if(!best || bestFront<10) return null;
    const pts=[];
    for(const i of inl){ const r=triangulate(best.R,best.t,[x1[i],y1[i],1],[x2[i],y2[i],1]);
      if(!r || r.z1<=0 || r.z2<=0 || !isFinite(r.P[0]+r.P[1]+r.P[2])) continue;
      const p=A.kp.get(good[i].q).pt;
      pts.push({ qi:good[i].q, px:p.x, py:p.y, z:r.z1 });
    }
    return pts.length>=10 ? { pts, inliers:bestIn } : null;
  }catch(e){ console.error(e); return null; }
}

/* ---------- robust affine alignment ---------- */
function robustAffine(xs, ys){
  const n=xs.length; if(n<12) return null;
  let xmin=Infinity,xmax=-Infinity,ymin=Infinity,ymax=-Infinity;
  for(let i=0;i<n;i++){ if(xs[i]<xmin)xmin=xs[i]; if(xs[i]>xmax)xmax=xs[i]; if(ys[i]<ymin)ymin=ys[i]; if(ys[i]>ymax)ymax=ys[i]; }
  if(xmax-xmin<0.08) return { reliable:false, why:'no disparity spread' };
  
  const slopes=[];
  const cap=20000;
  const pe=n*(n-1)/2;
  const step=pe>cap?Math.ceil(pe/cap):1;
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j+=step){ const dx=xs[j]-xs[i]; if(Math.abs(dx)<1e-3) continue; slopes.push((ys[j]-ys[i])/dx); }
  if(slopes.length<10) return { reliable:false, why:'few slopes' };
  slopes.sort((p,q)=>p-q); const a=slopes[slopes.length>>1];
  const b=xs.map((x,i)=>ys[i]-a*x).sort((p,q)=>p-q)[n>>1];          
  const mad=(1.4826*xs.map((x,i)=>Math.abs(ys[i]-(a*x+b))).sort((p,q)=>p-q)[n>>1])||1e-9;
  const signal=a*(xmax-xmin);
  const invHi=a*xmax+b;
  
  const reliable = a>0 && signal>4*mad && invHi>1e-4;
  return { a, b, reliable, anchors:n, snr:signal/mad };
}

/* ---------- hybrid densification ---------- */
async function densify(A, sfm){
  try {
    const w=A.w, h=A.h;
    const cnv=document.createElement('canvas'); cnv.width=w; cnv.height=h;
    cnv.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(A.color), w, h), 0, 0);
    const model=await getDepther();
    stat('<span class="spin"></span>Phase 2: Neural Depth'); subStat('Inferring dense tensor array...'); 
    await new Promise(r=>setTimeout(r,30));
    
    const { predicted_depth } = await model(await RawImage.fromCanvas(cnv));
    
    cachedScan = { A: A, sfm: sfm, dims: predicted_depth.dims, D: predicted_depth.data };
    projectHybridMesh();
    
  } catch(e) { stat('Densify error'); subStat(e.message); console.error(e); }
}

/* ---------- Instant Reprojection Engine (Mesh Version) ---------- */
function projectHybridMesh() {
  if (!cachedScan) return;
  const { A, sfm, dims, D } = cachedScan;
  const dh = dims[dims.length-2];
  const dw = dims[dims.length-1];
  const w = A.w;
  const h = A.h;
  
  let mn=Infinity,mx=-Infinity; for(let i=0;i<D.length;i++){ const v=D[i]; if(v<mn)mn=v; if(v>mx)mx=v; }
  const span=(mx-mn)||1;
  const dn=i=>(D[i]-mn)/span; 
  
  stat('<span class="spin"></span>Phase 3: Meshing'); subStat('Mapping neural map to physical anchors...');
  
  const xs=[];
  const ys=[];
  for(const p of sfm.pairs){
    const sx=Math.min(dw-1,Math.max(0,Math.round(p.px/w*dw)));
    const sy=Math.min(dh-1,Math.max(0,Math.round(p.py/h*dh)));
    xs.push(dn(sy*dw+sx)); ys.push(1/p.z);
  }
  
  const fit=robustAffine(xs, ys);                                   
  const useAnchors = !!(fit && fit.reliable);
  
  const a = useAnchors ? fit.a : 2.0;
  const b = useAnchors ? fit.b : 0.5;
  
  const fov=+$('fov').value*Math.PI/180;
  const f=(0.5*dw)/Math.tan(0.5*fov);
  const cx=dw/2;
  const cy=dh/2;
  const cull=+$('fc').value;
  const edge=+$('er').value;
  const stride=Math.max(1,Math.round(Math.sqrt(dw*dh/100000)));
  
  const gw=Math.floor((dw-1)/stride)+1;
  const gh=Math.floor((dh-1)/stride)+1;
  const vidx=new Int32Array(gw*gh).fill(-1);
  const pos = [];
  const col = [];
  const vdn = [];   
  let vc=0;
  
  for(let gy=0;gy<gh;gy++){ const y=gy*stride; if(y>=dh) continue;
    for(let gx=0;gx<gw;gx++){ const x=gx*stride; if(x>=dw) continue;
      const i=y*dw+x, d=dn(i);
      if(d<cull) continue;
      const invd=a*d+b; if(invd<=1e-3) continue;       
      const Z=1/invd;
      
      vidx[gy*gw+gx]=vc++;
      pos.push((x-cx)*Z/f, -(y-cy)*Z/f, -Z); vdn.push(d);
      
      const cxp=Math.min(w-1,Math.round(x/dw*w));
      const cyp=Math.min(h-1,Math.round(y/dh*h));
      const o=(cyp*w+cxp)*4;
      col.push(A.color[o]/255, A.color[o+1]/255, A.color[o+2]/255);
    }
  }
  
  if(vc<50){ stat('Dense map empty'); subStat('No valid depths — rescan'); return; }
  
  // Grazing Angle / Edge Tear Cull
  const index=[]; const tear=edge>0?edge:Infinity;
  const GRAZE=0.10;   
  const P=k=>[pos[3*k],pos[3*k+1],pos[3*k+2]];
  
  const grazeOk=(p,q,r)=>{
    const Av = P(p);
    const Bv = P(q);
    const Cv = P(r);
    const e1 = [Bv[0]-Av[0],Bv[1]-Av[1],Bv[2]-Av[2]];
    const e2 = [Cv[0]-Av[0],Cv[1]-Av[1],Cv[2]-Av[2]];
    const n=[e1[1]*e2[2]-e1[2]*e2[1], e1[2]*e2[0]-e1[0]*e2[2], e1[0]*e2[1]-e1[1]*e2[0]];
    const c=[(Av[0]+Bv[0]+Cv[0])/3,(Av[1]+Bv[1]+Cv[1])/3,(Av[2]+Bv[2]+Cv[2])/3];   
    const nl = Math.hypot(...n)||1e-9;
    const cl = Math.hypot(...c)||1e-9;
    return Math.abs(n[0]*c[0]+n[1]*c[1]+n[2]*c[2])/(nl*cl) > GRAZE;
  };
  
  const ok3=(p,q,r)=> p>=0&&q>=0&&r>=0 &&
    Math.abs(vdn[p]-vdn[q])<=tear && Math.abs(vdn[q]-vdn[r])<=tear && Math.abs(vdn[p]-vdn[r])<=tear &&
    grazeOk(p,q,r);
    
  for(let gy=0;gy<gh-1;gy++) for(let gx=0;gx<gw-1;gx++){
    const v00=vidx[gy*gw+gx], v10=vidx[gy*gw+gx+1], v01=vidx[(gy+1)*gw+gx], v11=vidx[(gy+1)*gw+gx+1];
    if(ok3(v00,v10,v01)) index.push(v00,v10,v01);
    if(ok3(v10,v11,v01)) index.push(v10,v11,v01);
  }
  
  drawMesh(pos,col,index);
  
  const NV=vc.toLocaleString(), NF=(index.length/3).toLocaleString();
  if(useAnchors){ stat('Hybrid Mesh Complete'); subStat(`${NV} verts · ${NF} faces · ${fit.anchors} anchors`); }
  else { stat('Mesh · NEURAL-ONLY'); subStat(`${NV} verts · ${NF} faces · Manual Z-Stretch available`); }
}

function drawMesh(pos,col,index){
  if(cloud){ scene.remove(cloud); cloud.geometry.dispose(); cloud.material.dispose(); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(index);
  g.computeBoundingSphere();
  
  const s=g.boundingSphere.radius||1; g.scale(2/s,2/s,2/s); g.center();
  
  cloud=new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.DoubleSide}));
  scene.add(cloud);
  applyTransforms(); 
  
  plyRows=()=>{
    const p=g.attributes.position, c=g.attributes.color, zs=cloud.scale.z;
    const verts=[]; for(let i=0;i<p.count;i++) verts.push(`${p.getX(i).toFixed(4)} ${p.getY(i).toFixed(4)} ${(p.getZ(i)*zs).toFixed(4)} ${(c.getX(i)*255)|0} ${(c.getY(i)*255)|0} ${(c.getZ(i)*255)|0}`);
    const idx=g.index.array, faces=[]; for(let i=0;i<idx.length;i+=3) faces.push(`3 ${idx[i]} ${idx[i+1]} ${idx[i+2]}`);
    return { verts, faces };
  };
  $('bExport').disabled=false; $('bSolid').disabled=false;
}

/* ---------- Instant Visual Transforms ---------- */
function applyTransforms() {
  if (!cloud) return;
  let sz = +$('zs').value;
  if ($('inv').checked) sz = -sz; 
  cloud.scale.z = sz;
}

/* ---------- watertight solid exporter (Bas-Relief closure) ---------- */
function solidify(pos, index, zs){
  const N=pos.length/3;
  const V=new Float64Array(N*3); let zmin=Infinity,zmax=-Infinity;
  for(let i=0;i<N;i++){ V[3*i]=pos[3*i]; V[3*i+1]=pos[3*i+1]; const z=pos[3*i+2]*zs; V[3*i+2]=z;
    if(z<zmin)zmin=z; if(z>zmax)zmax=z; }
  const zback=zmin-0.05*Math.max(1e-6,(zmax-zmin));
  const W=new Float64Array(N*6); W.set(V,0);
  for(let i=0;i<N;i++){ W[3*(N+i)]=V[3*i]; W[3*(N+i)+1]=V[3*i+1]; W[3*(N+i)+2]=zback; }
  const tris=[];
  for(let t=0;t<index.length;t+=3){ const a=index[t],b=index[t+1],c=index[t+2];
    tris.push(a,c,b);  tris.push(a+N,b+N,c+N); }                     
  const cnt=new Map(); const key=(a,b)=>a<b?a*4e9+b:b*4e9+a;
  for(let t=0;t<index.length;t+=3){ const e=[[index[t],index[t+1]],[index[t+1],index[t+2]],[index[t+2],index[t]]];
    for(const [a,b] of e){ const k=key(a,b); cnt.set(k,(cnt.get(k)||0)+1); } }
  for(let t=0;t<index.length;t+=3){ const e=[[index[t],index[t+1]],[index[t+1],index[t+2]],[index[t+2],index[t]]];
    for(const [a,b] of e){ if(cnt.get(key(a,b))===1){ tris.push(a,b,a+N); tris.push(b,b+N,a+N); } } }  
  return { verts:W, tris };
}

function writeSTL(W, tris){                       
  const F=tris.length/3, buf=new ArrayBuffer(84+50*F), dv=new DataView(buf);
  dv.setUint32(80, F, true);
  let o=84;
  for(let t=0;t<tris.length;t+=3){
    const a = tris[t]*3;
    const b = tris[t+1]*3;
    const c = tris[t+2]*3;
    const ux = W[b]-W[a];
    const uy = W[b+1]-W[a+1];
    const uz = W[b+2]-W[a+2];
    const vx = W[c]-W[a];
    const vy = W[c+1]-W[a+1];
    const vz = W[c+2]-W[a+2];
    let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx; const nl=Math.hypot(nx,ny,nz)||1; nx/=nl;ny/=nl;nz/=nl;
    dv.setFloat32(o,nx,true); dv.setFloat32(o+4,ny,true); dv.setFloat32(o+8,nz,true); o+=12;
    for(const k of [a,b,c]){ dv.setFloat32(o,W[k],true); dv.setFloat32(o+4,W[k+1],true); dv.setFloat32(o+8,W[k+2],true); o+=12; }
    dv.setUint16(o,0,true); o+=2;
  }
  return buf;
}

$('bSolid').onclick=()=>{
  if(!cloud) return;
  stat('⟳ Sealing solid…'); subStat('closing mesh into watertight STL');
  setTimeout(()=>{ try{
    const g=cloud.geometry;
    const { verts, tris }=solidify(g.attributes.position.array, g.index.array, cloud.scale.z);
    const buf=writeSTL(verts, tris);
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buf],{type:'model/stl'}));
    a.download=`p3dk_solid_${Date.now()}.stl`; a.click();
    stat('Solid Exported'); subStat(`${(tris.length/3).toLocaleString()} faces · watertight STL bas-relief`);
  }catch(e){ stat('Solid error'); subStat(e.message); console.error(e); } }, 30);
};

/* ================= MODE A: WebXR Volumetric TSDF marching cubes ================= */
let vol=null, kf=0;
let stlData=null;

function makeVol(res,size,ox,oy,oz){
  return {res,size,vox:size/res,ox,oy,oz,tsdf:new Float32Array(res**3).fill(1),w:new Uint8Array(res**3)};
}

function integrate(vol,dep,W2V,P){
  const {res,vox,ox,oy,oz,tsdf,w} = vol;
  const {dw,dh,data} = dep;
  const tau = 3*vox;
  const r2 = res*res;
  for(let z=0;z<res;z++){ const wz=oz+(z+0.5)*vox;
    for(let y=0;y<res;y++){ const wy=oy+(y+0.5)*vox,base=y*res+z*r2;
      for(let x=0;x<res;x++){ const wx=ox+(x+0.5)*vox;
        const cz=W2V[2]*wx+W2V[6]*wy+W2V[10]*wz+W2V[14]; if(cz>-0.05) continue;
        const cx=W2V[0]*wx+W2V[4]*wy+W2V[8]*wz+W2V[12];
        const cy=W2V[1]*wx+W2V[5]*wy+W2V[9]*wz+W2V[13];
        const pw=P[3]*cx+P[7]*cy+P[11]*cz+P[15]; if(pw<=0) continue;
        const u=((P[0]*cx+P[4]*cy+P[8]*cz+P[12])/pw+1)/2;
        const v=(1-(P[1]*cx+P[5]*cy+P[9]*cz+P[13])/pw)/2;
        if(u<0||u>=1||v<0||v>=1) continue;
        const d=data[(v*dh|0)*dw+(u*dw|0)]; if(!(d>0)) continue;
        const sdf=d+cz; if(sdf<-tau) continue;
        const t=Math.min(1,sdf/tau),i=base+x,wi=w[i];
        tsdf[i]=(tsdf[i]*wi+t)/(wi+1); if(wi<250) w[i]=wi+1;
      } } }
}

function toField(vol){    
  const {res,tsdf,w}=vol,n=res**3,r2=res*res,f=new Float32Array(n);
  const ext=new Uint8Array(n),stack=[];
  const empty=i=>w[i]===0||tsdf[i]>0;
  for(let z=0;z<res;z++)for(let y=0;y<res;y++)for(let x=0;x<res;x++)
    if(x===0||y===0||z===0||x===res-1||y===res-1||z===res-1){const i=x+y*res+z*r2;if(empty(i)&&!ext[i]){ext[i]=1;stack.push(i);}}
  while(stack.length){const i=stack.pop(),x=i%res,y=(i/res|0)%res,z=i/r2|0;
    if(x>0&&!ext[i-1]&&empty(i-1)){ext[i-1]=1;stack.push(i-1);}
    if(x<res-1&&!ext[i+1]&&empty(i+1)){ext[i+1]=1;stack.push(i+1);}
    if(y>0&&!ext[i-res]&&empty(i-res)){ext[i-res]=1;stack.push(i-res);}
    if(y<res-1&&!ext[i+res]&&empty(i+res)){ext[i+res]=1;stack.push(i+res);}
    if(z>0&&!ext[i-r2]&&empty(i-r2)){ext[i-r2]=1;stack.push(i-r2);}
    if(z<res-1&&!ext[i+r2]&&empty(i+r2)){ext[i+r2]=1;stack.push(i+r2);}}
  for(let i=0;i<n;i++){ f[i]= w[i]>0 ? -tsdf[i] : (ext[i]?-1:1); }
  for(let z=0;z<res;z++)for(let y=0;y<res;y++)for(let x=0;x<res;x++)
    if(x===0||y===0||z===0||x===res-1||y===res-1||z===res-1) f[x+y*res+z*r2]=-1;
  return f;
}

async function startXrScan() {
  const S = +$('vs').value, RES = +$('vr').value;
  let session;
  try{
    session = await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['depth-sensing','dom-overlay'],
      depthSensing:{usagePreference:['cpu-optimized'],dataFormatPreference:['luminance-alpha','float32']},
      domOverlay:{root:$('xrhud')}
    });
  } catch(e) {
    stat('XR session failed');
    subStat(e.message + ' — depth-sensing may be unsupported on this device');
    return;
  }
  
  $('xrhud').style.display='block'; $('xrtop').textContent='placing volume…';
  const glc = document.createElement('canvas');
  const gl = glc.getContext('webgl',{xrCompatible:true});
  await gl.makeXRCompatible?.();
  session.updateRenderState({baseLayer:new XRWebGLLayer(session,gl)});
  const ref = await session.requestReferenceSpace('local');
  vol = null; kf = 0;
  
  const DW = 160, DH = 120, dep = {dw:DW, dh:DH, data:new Float32Array(DW*DH)};
  let lastP = null, lastQ = null, lastT = 0, depthMiss = 0;
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), Pv = new THREE.Vector3();

  const onFrame = (t, frame) => {
    session.requestAnimationFrame(onFrame);
    const pose = frame.getViewerPose(ref); if(!pose) return;
    const view = pose.views[0];
    M.fromArray(view.transform.matrix);
    Pv.setFromMatrixPosition(M); Q.setFromRotationMatrix(M);
    if(!vol){  
      const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(Q);
      const c = Pv.clone().add(fwd.multiplyScalar(0.25+S/2));
      vol = makeVol(RES,S,c.x-S/2,c.y-S/2,c.z-S/2);
      $('xrtop').textContent='volume placed — orbit the object';
      lastP = Pv.clone(); lastQ = Q.clone(); lastT = t; return;
    }
    const moved = Pv.distanceTo(lastP)>0.03 || lastQ.angleTo(Q)>0.05;
    if(!moved || t-lastT<150) return;
    let di=null; try{ di=frame.getDepthInformation(view); }catch(e){}
    if(!di){ if(++depthMiss===30){ $('xrtop').textContent='no depth data — device may lack ARCore depth'; } return; }
    for(let py=0;py<DH;py++)for(let px=0;px<DW;px++)
      dep.data[py*DW+px]=di.getDepthInMeters((px+0.5)/DW,(py+0.5)/DH);
    const t0=performance.now();
    integrate(vol, dep, M.clone().invert().elements, view.projectionMatrix);
    kf++; lastP.copy(Pv); lastQ.copy(Q); lastT=t;
    $('xrtop').textContent=`KF ${kf} · ${(performance.now()-t0)|0}ms/integrate · orbit fully, then FINISH`;
  };
  session.requestAnimationFrame(onFrame);
  $('xrbtn').onclick = () => session.end();
  session.addEventListener('end', () => { $('xrhud').style.display='none'; buildXrMesh(S,RES); });
}

function buildXrMesh(S, RES){
  if(!vol||kf<3){ stat('Scan too short'); subStat(`${kf} keyframes — orbit the object`); return; }
  stat('⟳ Extracting'); subStat('marching cubes…');
  setTimeout(()=>{ try{
    const mc = new MarchingCubes(RES,new THREE.MeshNormalMaterial({side:THREE.DoubleSide}),false,false, RES>=128?900000:500000);
    mc.isolation = 0; mc.field.set(toField(vol)); mc.update();
    const pa = mc.geometry.getAttribute('position'), nv = mc.geometry.drawRange.count;
    if(!nv){ stat('Empty volume'); subStat('Nothing fused inside the scan volume — re-place and rescan'); return; }
    
    // Weld
    const q = 1e-4;
    const map = new Map();
    const tri = [];
    const pts = [];
    for(let i=0;i<nv;i++){ 
      const x = pa.getX(i);
      const y = pa.getY(i);
      const z = pa.getZ(i);
      const k = `${Math.round(x/q)},${Math.round(y/q)},${Math.round(z/q)}`;
      if(!map.has(k)){map.set(k,map.size);pts.push([x,y,z]);} tri.push(map.get(k)); 
    }
    const cnt = new Map();
    const ek = (a,b)=>a<b?a*4e9+b:b*4e9+a;
    for(let t=0;t<tri.length;t+=3){const a=tri[t],b=tri[t+1],c=tri[t+2];if(a===b||b===c||a===c)continue;
      for(const [p2,q2] of [[a,b],[b,c],[c,a]]) cnt.set(ek(p2,q2),(cnt.get(ek(p2,q2))||0)+1);}
    let bad=0; for(const v of cnt.values()) if(v!==2) bad++;
    
    // Metric measurements bounding box mapping (m -> mm)
    const toW = p => [vol.ox+(p[0]+1)/2*S, vol.oy+(p[1]+1)/2*S, vol.oz+(p[2]+1)/2*S];
    let mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9];
    for(const p of pts){const w=toW(p);for(let k=0;k<3;k++){if(w[k]<mn[k])mn[k]=w[k];if(w[k]>mx[k])mx[k]=w[k];}}
    const dims = mx.map((v,k)=>((v-mn[k])*1000).toFixed(0)).join('×');
    
    if(cloud){ scene.remove(cloud); cloud.geometry.dispose(); cloud.material.dispose(); }
    const g=new THREE.BufferGeometry();
    const arr=new Float32Array(nv*3); for(let i=0;i<nv;i++){arr[3*i]=pa.getX(i);arr[3*i+1]=pa.getY(i);arr[3*i+2]=pa.getZ(i);}
    g.setAttribute('position',new THREE.BufferAttribute(arr,3)); g.computeVertexNormals();
    cloud = new THREE.Mesh(g,new THREE.MeshNormalMaterial({side:THREE.DoubleSide})); scene.add(cloud);
    
    stlData = {pa:arr, nv, S, vol:{ox:vol.ox, oy:vol.oy, oz:vol.oz}};
    $('bSolid').disabled = false;
    stat(bad===0?'WATERTIGHT · METRIC':'Mesh · METRIC');
    subStat(`${(nv/3).toLocaleString()} faces · ${dims}mm · ${kf} keyframes · non-manifold edges: ${bad}`);
  }catch(e){ stat('Extract error'); subStat(e.message); console.error(e); } }, 30);
}

function exportMetricStl() {
  if(!stlData) return;
  const {pa,nv,S,vol:vo} = stlData;
  const toW = i => [ (vo.ox+(pa[3*i]+1)/2*S)*1000, (vo.oy+(pa[3*i+1]+1)/2*S)*1000, (vo.oz+(pa[3*i+2]+1)/2*S)*1000 ];
  
  let sv=0;
  for(let t=0;t<nv;t+=3){ const A=toW(t),B=toW(t+1),C=toW(t+2);
    sv+=(A[0]*(B[1]*C[2]-B[2]*C[1])-A[1]*(B[0]*C[2]-B[2]*C[0])+A[2]*(B[0]*C[1]-B[1]*C[0]))/6; }
  const flip = sv < 0;
  
  const F=nv/3, buf=new ArrayBuffer(84+50*F), dv=new DataView(buf);
  dv.setUint32(80,F,true); let o=84;
  for(let t=0;t<nv;t+=3){
    let A=toW(t),B=toW(t+1),C=toW(t+2); if(flip){const tmp=B;B=C;C=tmp;}
    const ux = B[0]-A[0];
    const uy = B[1]-A[1];
    const uz = B[2]-A[2];
    const vx = C[0]-A[0];
    const vy = C[1]-A[1];
    const vz = C[2]-A[2];
    let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx; const nl=Math.hypot(nx,ny,nz)||1;
    dv.setFloat32(o,nx/nl,true);dv.setFloat32(o+4,ny/nl,true);dv.setFloat32(o+8,nz/nl,true);o+=12;
    for(const Pt of [A,B,C]){dv.setFloat32(o,Pt[0],true);dv.setFloat32(o+4,Pt[1],true);dv.setFloat32(o+8,Pt[2],true);o+=12;}
    dv.setUint16(o,0,true);o+=2;
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buf],{type:'model/stl'}));
  a.download=`p3dk_metric_${Date.now()}.stl`; a.click();
  stat('STL Exported'); subStat(`${F.toLocaleString()} faces · millimetres · METRIC`);
}

/* ---------- Global control buttons router ---------- */

$('bSolid').onclick = () => {

  } else {
