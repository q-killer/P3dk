<!DOCTYPE html>
<html>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>P3dK SCANNER PRO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
:root{--c:#0ff;--a:#ffb000;--m:#f0f;--g:#0f9;--bg:#050505}
*{box-sizing:border-box;user-select:none;margin:0;padding:0;overflow:hidden}
body{background:var(--bg);color:var(--c);font-family:'Courier New',monospace;touch-action:none}
#vid,#ghost{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
#hud,#glc{position:fixed;inset:0;z-index:3;pointer-events:none}
#ghost{z-index:4;opacity:0;mix-blend-mode:screen;transition:opacity .4s}
#pb{position:fixed;top:0;left:0;height:3px;background:var(--a);z-index:20;width:0%;transition:width .6s ease-out}
#flash{position:fixed;inset:0;background:#fff;z-index:30;opacity:0;pointer-events:none;transition:opacity .08s}
#ui{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;padding:10px}
.pan{background:rgba(0,12,12,.15);border:1px solid rgba(0,255,255,.25);padding:10px;pointer-events:auto;backdrop-filter:blur(3px)}
#phase{font-size:11px;font-weight:bold;line-height:1.8;pointer-events:none}
#phase .info{font-size:12px;color:var(--a);min-height:16px}
#chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:9px;padding:2px 7px;border-radius:2px;font-weight:bold}
.chip.ok{background:rgba(0,255,153,.15);color:var(--g);border:1px solid rgba(0,255,153,.3)}
.chip.off{background:rgba(60,60,60,.2);color:#555;border:1px solid #333}
.chip.warn{background:rgba(255,176,0,.15);color:var(--a);border:1px solid rgba(255,176,0,.3)}
.btn{background:rgba(0,20,20,.2);color:var(--c);border:1px solid rgba(0,255,255,.4);padding:14px;font:bold 13px 'Courier New';cursor:pointer;text-transform:uppercase;width:100%;margin-top:8px;transition:.1s;pointer-events:auto;letter-spacing:1px}
.btn:active{background:var(--c);color:#000}
.btn:disabled{opacity:.3;pointer-events:none}
.btn.primary{border-color:var(--c);border-width:2px;font-size:16px;height:68px}
.btn.danger{border-color:var(--m);color:var(--m)}
.btn.go{border-color:var(--g);color:var(--g)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#arc{position:fixed;top:12px;right:12px;z-index:11;pointer-events:none}
#rev{display:none}
.sl-row{display:flex;align-items:center;gap:8px;margin:6px 0}
.sl-row span{font-size:10px;color:#ccc;width:80px;flex-shrink:0}
.sl-row input[type=range]{flex:1;accent-color:var(--a)}
.sl-row .val{font-size:11px;color:var(--a);width:32px;text-align:right}
#instr{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:11;text-align:center;pointer-events:none;display:none}
#instr .big{font-size:32px;color:rgba(0,255,255,.8);animation:pulse 2s infinite}
#instr .sub{font-size:12px;color:var(--a);margin-top:8px}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
#fdots{display:flex;gap:4px;margin-top:6px;align-items:center;flex-wrap:wrap}
.fdot{width:8px;height:8px;border-radius:50%;background:rgba(0,255,255,.25);border:1px solid rgba(0,255,255,.3);transition:background .3s}
.fdot.done{background:var(--c)}
.fdot.active{background:var(--a);animation:pulse .5s infinite}
</style>
</head>
<body>
<video id=vid autoplay playsinline muted></video>
<canvas id=hud></canvas>
<canvas id=glc></canvas>
<img id=ghost src="">
<div id=pb></div>
<div id=flash></div>

<div id=instr><div class=big>⊕</div><div class=sub>FRAME OBJECT · TAP TO CAPTURE</div></div>

<svg id=arc width=62 height=62 viewBox="0 0 62 62">
  <circle cx=31 cy=31 r=26 fill="rgba(0,0,0,.5)" stroke="rgba(0,255,255,.12)" stroke-width=1/>
  <circle id=arcFill cx=31 cy=31 r=26 fill=none stroke="var(--c)" stroke-width=3 stroke-dasharray="0 163" stroke-dashoffset="41" transform="rotate(-90 31 31)" style="transition:stroke-dasharray .4s"/>
  <text x=31 y=36 text-anchor=middle font-size=16 font-family="Courier New" font-weight=bold fill="var(--c)" id=arcTxt>0</text>
</svg>

<div id=ui>
  <div class=pan>
    <div id=phase><div id=phLine>INITIALISING...</div><div class=info id=info></div></div>
    <div id=chips>
      <span class="chip off" id=cGY>Gyro</span><span class="chip off" id=cCA>Cam</span>
      <span class="chip off" id=cOR>ORB</span><span class="chip off" id=cTS>TSDF</span>
    </div>
    <div id=fdots></div>
  </div>

  <div>
    <div id=p1 class=pan><button class="btn primary" id=bStart>▶ START SCANNING</button></div>
    <div id=p2 class=pan style=display:none>
      <button class="btn primary" id=bCapture>[ ⬤ CAPTURE FRAME ]</button>
      <div class=g2><button class=btn id=bDone disabled>REVIEW 3D →</button><button class="btn danger" id=bStop>✕ STOP</button></div>
    </div>
    <div id=p3 class=pan style=display:none>
      <div id=rev>
        <div style="font-size:10px;color:var(--a);font-weight:bold;margin-bottom:4px">MESH CALIBRATION</div>
        <div class=sl-row><span>ISO LEVEL</span><input type=range id=sliso min=-8 max=8 step=1 value=-2 oninput="$('viso').textContent=this.value"><span class=val id=viso>-2</span></div>
        <div class=sl-row><span>POINT SIZE</span><input type=range id=slps min=0.005 max=0.06 step=0.005 value=0.015 oninput="$('vps').textContent=this.value;window.resizePts?.()"><span class=val id=vps>0.015</span></div>
        <div class=sl-row>
          <label style="font-size:11px;color:#ccc;display:flex;align-items:center;gap:5px;cursor:pointer"><input type=checkbox id=cbSm checked> SMOOTH</label>
          <label style="font-size:11px;color:#ccc;display:flex;align-items:center;gap:5px;margin-left:10px;cursor:pointer"><input type=checkbox id=cbWire> WIRE</label>
        </div>
      </div>
      <button class="btn go" id=bBake>∴ BAKE → STL</button>
      <div class=g2><button class=btn id=bMore>+ MORE FRAMES</button><button class="btn danger" id=bDiscard>DISCARD</button></div>
    </div>
  </div>
</div>

<script type=module>
import{pipeline,env}from'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.0/dist/transformers.min.js';
env.allowLocalModels=false;env.useBrowserCache=true;

const $=id=>document.getElementById(id);
const sts=t=>{$('phLine').textContent=t};
const info=t=>{$('info').textContent=t};
const chip=(id,s,t)=>{const e=$(id);e.className='chip '+s;e.textContent=t};
const vid=$('vid'),ghost=$('ghost'),glc=$('glc'),hud=$('hud'),pb=$('pb'),flash=$('flash');
const hudCtx=hud.getContext('2d'); hud.width=innerWidth; hud.height=innerHeight;

const scene=new THREE.Scene();
const cam3=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.01,100); cam3.position.set(0,0,2);
const rend=new THREE.WebGLRenderer({canvas:glc,antialias:true,alpha:true});
rend.setPixelRatio(Math.min(devicePixelRatio,2)); rend.setSize(innerWidth,innerHeight);
const oc=new THREE.OrbitControls(cam3,rend.domElement); oc.enableDamping=true; oc.enabled=false;
scene.add(new THREE.AmbientLight(0xffffff,.6));
const dl=new THREE.DirectionalLight(0x00ffff,.5); dl.position.set(2,3,2); scene.add(dl);
const ptGroup=new THREE.Group(); scene.add(ptGroup);
const meshGroup=new THREE.Group(); scene.add(meshGroup);
let reviewMesh=null;

// ── TSDF WORKER WITH NORMAL WEIGHTING ─────────────────────────────────────────
const WC=`
let nx=0,ny=0,nz=0,sz=0,bb={x:0,y:0,z:0},sd=null,wt=null;
const TR=3; 
const vi=(x,y,z)=>x+y*nx+z*nx*ny;
self.onmessage=function(e){
  const{type,data}=e;
  if(type==='init'){
    nx=data.nx;ny=data.ny;nz=data.nz;sz=data.sz;bb=data.bb;
    const N=nx*ny*nz; sd=new Float32Array(N).fill(TR); wt=new Float32Array(N);
    self.postMessage({type:'ready',dims:[nx,ny,nz]});
  }
  else if(type==='integrate'){
    if(!sd)return;
    const p=data.pts; // F32 array of [x, y, z, weight]
    for(let i=0;i<p.length;i+=4){
      const px=p[i],py=p[i+1],pz=p[i+2],pw=p[i+3];
      const vx=Math.floor((px-bb.x)/sz)|0, vy=Math.floor((py-bb.y)/sz)|0, vz=Math.floor((pz-bb.z)/sz)|0;
      const bv=Math.ceil(TR/sz)+1;
      for(let dz2=-bv;dz2<=bv;dz2++){
        const zi=vz+dz2;
        if(vx<0||vy<0||zi<0||vx>=nx||vy>=ny||zi>=nz)continue;
        const idx=vi(vx,vy,zi);
        const s=Math.max(-TR,Math.min(TR,(pz-bb.z)-(zi*sz+sz*.5)));
        const w=wt[idx];
        sd[idx]=(sd[idx]*w+s*pw)/(w+pw); // Weighted injection
        wt[idx]=Math.min(w+pw,255);
      }
    }
    self.postMessage({type:'done'});
  }
  else if(type==='march'){
    if(!sd){self.postMessage({type:'mesh',verts:new Float32Array(0)});return}
    const iso=data.iso||0,minW=data.minW||1,verts=[];
    const ip=(p1,p2,v1,v2)=>{
      const t=(iso-v1)/((v2-v1)||.0001); return[p1[0]+(p2[0]-p1[0])*t,p1[1]+(p2[1]-p1[1])*t,p1[2]+(p2[2]-p1[2])*t];
    };
    const tets=[[0,1,3,4],[1,4,5,6],[1,3,4,6],[3,6,7,4],[1,2,3,6]];
    for(let iz=0;iz<nz-1;iz++)for(let iy=0;iy<ny-1;iy++)for(let ix=0;ix<nx-1;ix++){
      const c=[[ix,iy,iz],[ix+1,iy,iz],[ix+1,iy+1,iz],[ix,iy+1,iz],[ix,iy,iz+1],[ix+1,iy,iz+1],[ix+1,iy+1,iz+1],[ix,iy+1,iz+1]];
      const vals=c.map(([x,y,z])=>{const idx=vi(x,y,z); return wt[idx]<minW?TR:sd[idx]});
      const pos=c.map(([x,y,z])=>[bb.x+x*sz+sz*.5,bb.y+y*sz+sz*.5,bb.z+z*sz+sz*.5]);
      for(const[a,b,cc,d]of tets){
        const sv=[vals[a],vals[b],vals[cc],vals[d]], sp=[pos[a],pos[b],pos[cc],pos[d]];
        const ins=sv.map(v=>v<iso?1:0), bit=ins[0]|(ins[1]<<1)|(ins[2]<<2)|(ins[3]<<3);
        if(!bit||bit===15)continue;
        const edges=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]],cuts=[];
        for(const[ea,eb]of edges)if(ins[ea]!==ins[eb])cuts.push(ip(sp[ea],sp[eb],sv[ea],sv[eb]));
        if(cuts.length>=3){verts.push(...cuts[0],...cuts[1],...cuts[2]); if(cuts.length>=4)verts.push(...cuts[0],...cuts[2],...cuts[3]);}
      }
    }
    const arr=new Float32Array(verts);
    self.postMessage({type:'mesh',verts:arr},[arr.buffer]);
  }
};`;

let depthPipe=null, worker=null;
let phase=1, fc=0, pc=0, integBusy=false, bakeQ=false, adapted=false, replayBusy=false, bakeRetries=0, queuedPts=null;
let capturedFrames=[], bbox={minX:1e9,maxX:-1e9,minY:1e9,maxY:-1e9,minZ:1e9,maxZ:-1e9};
const dQ=new THREE.Quaternion();
let hasGyro=false, coveredAngles=[], lastQuality={blur:0,corners:0,exposure:0,score:0};

const BP=(()=>{const p=[],r=()=>{s=(s^s<<13)^s>>7^(s^s<<17)>>>0;return(s>>>0)%31-15}; let s=42;for(let i=0;i<256;i++)p.push(r(),r(),r(),r());return p})();
function brief(g,W,H,cx,cy){
  const d=new Uint32Array(8);
  for(let i=0;i<256;i++){const b=i*4, x1=Math.max(0,Math.min(W-1,cx+BP[b])),y1=Math.max(0,Math.min(H-1,cy+BP[b+1])), x2=Math.max(0,Math.min(W-1,cx+BP[b+2])),y2=Math.max(0,Math.min(H-1,cy+BP[b+3]));
    if(g[y1*W+x1]>g[y2*W+x2])d[i>>5]|=1<<(i&31);} return d;
}
function hamming(a,b){let h=0;for(let i=0;i<8;i++){let x=a[i]^b[i];x-=(x>>1)&0x55555555;x=(x&0x33333333)+((x>>2)&0x33333333);h+=((x+(x>>4)&0xF0F0F0F)*0x1010101)>>24}return h}
function fastCorners(g,W,H){
  const of=[[0,-3],[1,-3],[2,-2],[3,-1],[3,0],[3,1],[2,2],[1,3],[0,3],[-1,3],[-2,2],[-3,1],[-3,0],[-3,-1],[-2,-2],[-1,-3]]; const raw=[];
  for(let y=4;y<H-4;y+=2)for(let x=4;x<W-4;x+=2){
    const c=g[y*W+x];let br=0,dk=0;
    for(const[dx,dy]of of){const v=g[(y+dy)*W+(x+dx)];if(v>c+20)br++;else if(v<c-20)dk++}
    if(br>=9||dk>=9)raw.push({x,y,s:Math.abs(br-dk)});
  }
  raw.sort((a,b)=>b.s-a.s); const k=[],m=12;
  for(const p of raw){if(k.length>=30)break;if(!k.some(q=>Math.abs(q.x-p.x)<m&&Math.abs(q.y-p.y)<m))k.push(p)} return k;
}

function laplacianVariance(gray,W,H){
  let sum=0,sum2=0,n=0;
  for(let y=1;y<H-1;y+=2)for(let x=1;x<W-1;x+=2){const v=(-gray[(y-1)*W+x]-gray[y*W+(x-1)]+4*gray[y*W+x]-gray[y*W+(x+1)]-gray[(y+1)*W+x]); sum+=v;sum2+=v*v;n++;}
  return Math.min(100,(sum2/n-(sum/n)**2)/30);
}
function exposureScore(gray,W,H){
  let sum=0,bright=0,dark=0,n=0;
  for(let i=0;i<gray.length;i+=4){const v=gray[i];sum+=v;n++; if(v>235)bright++; if(v<20)dark++;}
  const mean=sum/n, brightPct=bright/n, darkPct=dark/n;
  if(brightPct>0.15)return{score:30,label:'OVEREXPOSED'}; if(darkPct>0.3)return{score:20,label:'TOO DARK'};
  if(mean<60)return{score:40,label:'UNDEREXPOSED'}; if(mean>210)return{score:50,label:'BRIGHT'}; return{score:100,label:'EXPOSURE OK'};
}

function computeQuality(){
  if(phase!==2||!vid.videoWidth)return;
  const mD=Math.min(vid.videoWidth,vid.videoHeight),sx=(vid.videoWidth-mD)/2,sy=(vid.videoHeight-mD)/2;
  tCtx.drawImage(vid,sx,sy,mD,mD,0,0,128,128);
  const px=tCtx.getImageData(0,0,128,128).data;
  for(let i=0;i<px.length;i+=4)tGray[i>>2]=(px[i]*.299+px[i+1]*.587+px[i+2]*.114)|0;
  const blur=laplacianVariance(tGray,128,128), kp=fastCorners(tGray,128,128), exp=exposureScore(px,128,128);
  const score=Math.round(blur*.4+Math.min(100,(kp.length/25)*100)*.4+exp.score*.2);
  lastQuality={blur:Math.round(blur),corners:kp.length,exposure:exp.score,label:exp.label,score};
  hudKP=kp; hudAge=0; drawQualityBar(score,kp.length,exp.label);
}

function drawQualityBar(score,corners,expLabel){
  if(phase!==2)return;
  const W=Math.min(innerWidth-40,400), X=(innerWidth-W)/2, Y=innerHeight-90;
  hudCtx.fillStyle='rgba(0,0,0,.6)'; hudCtx.fillRect(X,Y,W,38);
  hudCtx.fillStyle=score<40?'rgba(255,0,64,.5)':score<70?'rgba(255,176,0,.4)':'rgba(0,255,153,.4)'; hudCtx.fillRect(X,Y,Math.round(W*score/100),38);
  hudCtx.strokeStyle=score<40?'#f04':score<70?'#ffb000':'#0f9'; hudCtx.lineWidth=1; hudCtx.strokeRect(X,Y,W,38);
  hudCtx.font='bold 11px Courier New'; hudCtx.fillStyle=score<40?'#f04':score<70?'#ffb000':'#0f9';
  hudCtx.fillText(`QUALITY ${score}% · ${corners} FEATURES · ${expLabel}`,X+8,Y+14);
  hudCtx.fillStyle='rgba(255,255,255,.5)'; hudCtx.font='9px Courier New';
  hudCtx.fillText(score<55?'⚠ LOW — REJECTED IF CAPTURED':score<70?'◎ FAIR — better results possible':'✔ GOOD — tap CAPTURE',X+8,Y+28);
}

const tCvs=document.createElement('canvas');tCvs.width=tCvs.height=128;
const tCtx=tCvs.getContext('2d',{willReadFrequently:true}); const tGray=new Uint8Array(128*128);
let pKP=null,pDesc=null,snapTx=0,snapTy=0,hudKP=[],stitchKP=[],hudAge=0,prevNorm=null;

function drawHUD(){
  hudCtx.clearRect(0,0,hud.width,hud.height);
  if(phase!==2||!vid.videoWidth)return;
  const sc=Math.max(innerWidth/vid.videoWidth,innerHeight/vid.videoHeight), dw=vid.videoWidth*sc, dh=vid.videoHeight*sc;
  const ox=(innerWidth-dw)/2, oy=(innerHeight-dh)/2, mD=Math.min(vid.videoWidth,vid.videoHeight), sx=(vid.videoWidth-mD)/2, sy=(vid.videoHeight-mD)/2;
  const ms=(px,py)=>({x:ox+(sx+(px/128)*mD)*sc,y:oy+(sy+(py/128)*mD)*sc});
  for(const p of stitchKP){const pt=ms(p.x,p.y); hudCtx.strokeStyle='rgba(0,220,255,.9)'; hudCtx.lineWidth=1.5; hudCtx.strokeRect(pt.x-5,pt.y-5,10,10);}
  hudCtx.fillStyle=`rgba(255,0,255,${Math.max(0,1-hudAge/60)*.6+.15})`;
  for(const p of hudKP){const pt=ms(p.x,p.y); hudCtx.fillRect(pt.x-3,pt.y-3,6,6)}
  if(lastQuality.score>0)drawQualityBar(lastQuality.score,lastQuality.corners,lastQuality.label||'');
  hudAge++;
}
(function raf(){requestAnimationFrame(raf);drawHUD();rend.render(scene,cam3);if(oc.enabled)oc.update()})();
setInterval(()=>{if(phase===2)computeQuality()},500);

function mkWorker(vSz,bb,dims,replay){
  if(worker)worker.terminate();
  worker=new Worker(URL.createObjectURL(new Blob([WC],{type:'text/javascript'}))); integBusy=true; chip('cTS','warn',`TSDF ${dims.join('×')}`);
  worker.onmessage=ev=>{
    const{type}=ev.data;
    if(type==='ready'){
      integBusy=false; chip('cTS','ok',`TSDF ${ev.data.dims.join('×')}`);
      (async()=>{
        replayBusy=true;
        for(const pts of (replay||[])){
          await new Promise(r=>{const ck=()=>integBusy?setTimeout(ck,25):r();ck()}); if(!worker)break;
          integBusy=true; worker.postMessage({type:'integrate',data:{pts}});
        }
        if(queuedPts&&worker){
          const q=queuedPts;queuedPts=null; await new Promise(r=>{const ck=()=>integBusy?setTimeout(ck,25):r();ck()});
          if(worker){integBusy=true;worker.postMessage({type:'integrate',data:{pts:q}})}
        }
        await new Promise(r=>{const ck=()=>integBusy?setTimeout(ck,25):r();ck()});
        replayBusy=false; chip('cTS','ok',`TSDF ${dims.join('×')} ✔`); info(`${fc} frames · tap BAKE STL`);
      })();
    }
    else if(type==='done') integBusy=false;
    else if(type==='mesh'){
      integBusy=false; bakeQ=false; bakeRetries=0; const v=ev.data.verts;
      if(!v||v.length<9){sts('NO SURFACE');info('Try: lower ISO, more frames'); $('bBake').disabled=false; return;}
      sts('TAUBIN SMOOTHING...');
      // TAUBIN SMOOTHING UPGRADE
      const out=$('cbSm').checked?smoothMeshTaubin(v,4):v;
      if(reviewMesh){meshGroup.remove(reviewMesh);reviewMesh.geometry.dispose()}
      const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(out.slice(),3)); geo.computeVertexNormals();
      reviewMesh=new THREE.Mesh(geo,$('cbWire').checked?new THREE.MeshBasicMaterial({color:0x00ffcc,wireframe:true}):new THREE.MeshStandardMaterial({color:0x33ddcc,roughness:.4,metalness:.15,side:THREE.DoubleSide}));
      meshGroup.add(reviewMesh);
      geo.computeBoundingBox(); const bc=new THREE.Vector3(), bs=new THREE.Vector3(); geo.boundingBox.getCenter(bc); geo.boundingBox.getSize(bs);
      const d=Math.max(.5,Math.max(bs.x,bs.y,bs.z)*1.8); oc.target.copy(bc); cam3.position.set(bc.x,bc.y,bc.z+d); cam3.lookAt(bc); oc.update();
      $('bBake').disabled=false; sts('MESH READY — '+(out.length/9|0).toLocaleString()+' tris'); info('Drag to orbit · tap BAKE STL to download'); dlSTL(out);
    }
  };
  worker.postMessage({type:'init',data:{nx:dims[0],ny:dims[1],nz:dims[2],sz:vSz,bb}});
}

const iCvs=document.createElement('canvas'); const iCtx=iCvs.getContext('2d',{willReadFrequently:true});

async function captureFrame(){
  // STRICT QUALITY GATE
  if(lastQuality.score < 55) {
    sts('FRAME REJECTED'); info('Quality too low. Hold still and ensure good lighting.');
    flash.style.background = '#f04'; flash.style.opacity='.5'; setTimeout(()=>{flash.style.opacity=0; flash.style.background='#fff'}, 200);
    return;
  }

  if(!depthPipe||!vid.videoWidth)return;
  $('bCapture').disabled=true; $('bCapture').textContent='[ PROCESSING... ]';
  pb.style.transition='none'; pb.style.width='0%'; requestAnimationFrame(()=>{pb.style.transition='width .7s ease-out';pb.style.width='82%'});
  flash.style.opacity='.35'; setTimeout(()=>flash.style.opacity=0,80); navigator.vibrate?.([50]);
  stitchKP=hudKP.slice();
  
  if(hasGyro&&dQ.length()>.1){
    const yawDeg=((-(new THREE.Euler().setFromQuaternion(dQ,'YXZ')).y)*180/Math.PI%360+360)%360;
    const slot=Math.round(yawDeg/45)*45; if(!coveredAngles.includes(slot))coveredAngles.push(slot);
  }

  try{
    const w=vid.videoWidth,h=vid.videoHeight;
    iCvs.width=512; iCvs.height=Math.round(512*h/w); iCtx.drawImage(vid,0,0,iCvs.width,iCvs.height);
    const result=await depthPipe(iCvs); if(!result.predicted_depth)throw new Error('No depth output');
    const dd=result.predicted_depth.data instanceof Float32Array?result.predicted_depth.data:new Float32Array(result.predicted_depth.data);
    let mn=Infinity,mx=-Infinity; for(let i=0;i<dd.length;i++){if(dd[i]<mn)mn=dd[i];if(dd[i]>mx)mx=dd[i]}
    const rng=(mx-mn)||1; let norm=new Float32Array(dd.length); for(let i=0;i<dd.length;i++)norm[i]=(dd[i]-mn)/rng;

    // ALIGNMENT (Scale/Shift via ORB matching)
    if(prevNorm && pKP && hudKP.length > 3) {
      let sumX=0,sumY=0,sumXY=0,sumX2=0,n=0;
      for(let i=0; i<pKP.length; i++){
         let b=52,bi=-1;
         for(let j=0;j<hudKP.length;j++){const h2=hamming(pDesc[i],pDesc[j] /*approximation for alignment index*/); if(h2<b){b=h2;bi=j}}
         if(bi>=0) {
            // Map 128x128 ORB space to 512xAspect depth space
            const currIdx = Math.floor(hudKP[bi].y * (iCvs.height/128)) * iCvs.width + Math.floor(hudKP[bi].x * (512/128));
            const prevIdx = Math.floor(pKP[i].y * (iCvs.height/128)) * iCvs.width + Math.floor(pKP[i].x * (512/128));
            if(currIdx < norm.length && prevIdx < prevNorm.length) {
              const valC = norm[currIdx], valP = prevNorm[prevIdx];
              sumX+=valC; sumY+=valP; sumXY+=valC*valP; sumX2+=valC*valC; n++;
            }
         }
      }
      if(n > 4) {
         const s = (n*sumXY - sumX*sumY) / (n*sumX2 - sumX*sumX);
         const t = (sumY - s*sumX) / n;
         if(!isNaN(s) && !isNaN(t) && s > 0.5 && s < 2.0) {
           for(let i=0; i<norm.length; i++) norm[i] = Math.max(0, Math.min(1, norm[i] * s + t));
         }
      }
    }
    prevNorm = new Float32Array(norm);

    const RES=80, dW=iCvs.width, dH=iCvs.height, dMin=Math.min(dW,dH), dsx=(dW-dMin)/2, dsy=(dH-dMin)/2, maxD=2.0;
    const sorted=Array.from(norm).sort((a,b)=>a-b), p05=sorted[Math.floor(sorted.length*.05)], p95=sorted[Math.floor(sorted.length*.95)];
    const pos=[], colors=[], pts=[], spacing=2.5/RES;

    const cCvs=document.createElement('canvas');cCvs.width=cCvs.height=RES; const cCtx2=cCvs.getContext('2d',{willReadFrequently:true});
    cCtx2.drawImage(vid,(w-Math.min(w,h))/2,(h-Math.min(w,h))/2,Math.min(w,h),Math.min(w,h),0,0,RES,RES);
    const cd=cCtx2.getImageData(0,0,RES,RES).data;

    for(let iy=0;iy<RES;iy++)for(let ix=0;ix<RES;ix++){
      const nu=Math.floor(dsx+(ix/RES)*dMin), nv=Math.floor(dsy+(iy/RES)*dMin), idx = nv*dW+nu;
      const n=norm[idx]; if(n<p05||n>p95)continue;
      const z=(1-n)*maxD, px=-1.25+ix*spacing, py=1.25-iy*spacing;
      pos.push(px,py,z); colors.push(cd[(iy*RES+ix)*4]/255,cd[(iy*RES+ix)*4+1]/255,cd[(iy*RES+ix)*4+2]/255);

      // NORMAL CALCULATION AND WEIGHTING UPGRADE
      let weight = 1.0;
      if (nu > 0 && nu < dW-1 && nv > 0 && nv < dH-1) {
         const dx = norm[idx+1] - norm[idx-1], dy = norm[idx+dW] - norm[idx-dW];
         const len = Math.hypot(-dx, -dy, 2.0/RES);
         weight = Math.abs((2.0/RES) / len); // Dot product with camera vector
      }
      
      let tx=px,ty=py,tz=z;
      if(hasGyro&&dQ.length()>.1){const v3=new THREE.Vector3(px,py,z).applyQuaternion(dQ); tx=v3.x; ty=v3.y; tz=v3.z;}
      pts.push(tx,ty,tz,weight); // Interleaved insertion for TSDF
      
      if(tx<bbox.minX)bbox.minX=tx; if(tx>bbox.maxX)bbox.maxX=tx; if(ty<bbox.minY)bbox.minY=ty; if(ty>bbox.maxY)bbox.maxY=ty; if(tz<bbox.minZ)bbox.minZ=tz; if(tz>bbox.maxZ)bbox.maxZ=tz;
    }

    const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
    const cloud=new THREE.Points(geo,new THREE.PointsMaterial({size:parseFloat($('slps').value),vertexColors:true,sizeAttenuation:true,transparent:true,opacity:.85}));
    if(hasGyro&&dQ.length()>.1){const pivot=new THREE.Group();pivot.quaternion.copy(dQ);pivot.add(cloud);ptGroup.add(pivot)}else{ptGroup.add(cloud)}
    capturedFrames.push({pts:new Float32Array(pts),cloud});

    const ptsF32=new Float32Array(pts);
    if(worker&&!integBusy&&!bakeQ){integBusy=true;worker.postMessage({type:'integrate',data:{pts:ptsF32}}); pc+=pts.length/4;}
    else if(worker){queuedPts=ptsF32; pc+=pts.length/4;}

    fc++; const dots=$('fdots'), dot=document.createElement('div'); dot.className='fdot done';
    const prev=dots.querySelector('.fdot.active'); if(prev)prev.className='fdot done';
    const nd=document.createElement('div'); nd.className='fdot active'; dots.appendChild(dot);
    $('arcFill').setAttribute('stroke-dasharray',`${Math.min(fc/10,1)*145} 145`); $('arcTxt').textContent=fc; $('bDone').disabled=fc<3;

    if(fc===4&&!adapted){
      adapted=true; const vSz=0.025,pad=vSz*12;
      const dx=Math.max(.2,bbox.maxX-bbox.minX), dy=Math.max(.2,bbox.maxY-bbox.minY), dz=Math.max(.2,bbox.maxZ-bbox.minZ);
      const nx=Math.min(80,Math.max(20,Math.ceil((dx+pad*2)/vSz))), ny=Math.min(80,Math.max(20,Math.ceil((dy+pad*2)/vSz))), nz=Math.min(80,Math.max(20,Math.ceil((dz+pad*2)/vSz)));
      mkWorker(vSz,{x:bbox.minX-pad,y:bbox.minY-pad,z:bbox.minZ-pad},[nx,ny,nz],capturedFrames.map(f=>f.pts));
    }

    sts(`SCANNING — ${fc} frames`); info(`${(pc/1000).toFixed(1)}k pts · move around object`);
    
    const gW=320, gH=Math.round(320*h/w), gCvs2=document.createElement('canvas'); gCvs2.width=gW; gCvs2.height=gH;
    const gCtx=gCvs2.getContext('2d'); gCtx.drawImage(vid,0,0,gW,gH); gCtx.fillStyle='rgba(0,50,60,.35)'; gCtx.fillRect(0,0,gW,gH);
    gCvs2.toBlob(b=>{const url=URL.createObjectURL(b), old=ghost._burl; ghost.src=url; ghost._burl=url; if(old)URL.revokeObjectURL(old);},'image/jpeg',.6);
    ghost.style.opacity='.4'; pKP=null; pDesc=null;
  }catch(e){sts('ERROR: '+e.message.slice(0,50))}

  pb.style.transition='width .15s'; pb.style.width='100%'; setTimeout(()=>{pb.style.width='0%'},350);
  $('bCapture').textContent='[ ⬤ CAPTURE FRAME ]'; $('bCapture').disabled=false;
}

let lastTrack=0;
function trackLoop(t){
  if(phase!==2)return;
  if(t-lastTrack>50){
    lastTrack=t; const w=vid.videoWidth,h=vid.videoHeight; if(w<10)return requestAnimationFrame(trackLoop);
    const minD=Math.min(w,h), sx=(w-minD)/2, sy=(h-minD)/2;
    tCtx.drawImage(vid,sx,sy,minD,minD,0,0,128,128); const td=tCtx.getImageData(0,0,128,128).data;
    for(let i=0;i<td.length;i+=4)tGray[i>>2]=(td[i]*.299+td[i+1]*.587+td[i+2]*.114)|0;
    const kp=fastCorners(tGray,128,128), desc=kp.map(p=>brief(tGray,128,128,p.x,p.y));
    if(pKP&&pKP.length>3&&desc.length>3&&+ghost.style.opacity>0.05){
      const matches=[];
      for(let i=0;i<pKP.length;i++){
        let b=52,bi=-1; for(let j=0;j<kp.length;j++){const h2=hamming(pDesc[i],desc[j]);if(h2<b){b=h2;bi=j}}
        if(bi>=0)matches.push({ax:pKP[i].x,ay:pKP[i].y,bx:kp[bi].x,by:kp[bi].y});
      }
      if(matches.length>=4){
        let tx=0,ty=0; matches.forEach(m=>{tx+=m.bx-m.ax; ty+=m.by-m.ay;}); tx/=matches.length; ty/=matches.length;
        snapTx=snapTx*.7+(-tx*(innerWidth/128))*.3; snapTy=snapTy*.7+(-ty*(innerHeight/128))*.3;
        snapTx=Math.max(-innerWidth*.3,Math.min(innerWidth*.3,snapTx)); snapTy=Math.max(-innerHeight*.3,Math.min(innerHeight*.3,snapTy));
        ghost.style.transform=`translate(${snapTx.toFixed(1)}px,${snapTy.toFixed(1)}px)`; chip('cOR',`ok`,`ORB ${matches.length}✓`);
      }
    }
    pKP=kp; pDesc=desc; chip('cOR','warn',`ORB ${kp.length}kp`);
  }
  requestAnimationFrame(trackLoop);
}

function goPhase2(){
  phase=2; $('p1').style.display='none'; $('p2').style.display='block'; $('instr').style.display='block';
  sts('SCANNING'); info('Move camera around object · tap CAPTURE');
  mkWorker(0.04,{x:-2,y:-2,z:-2},[100,100,100]); requestAnimationFrame(trackLoop);
}
function goPhase3(){
  phase=3; ghost.style.opacity='0'; $('p2').style.display='none'; $('p3').style.display='block'; $('rev').style.display='block'; $('instr').style.display='none';
  glc.style.pointerEvents='auto'; oc.enabled=true;
  let cx=0,cy=0,cz=0,cn=0; capturedFrames.forEach(f=>{for(let i=0;i<f.pts.length;i+=4){cx+=f.pts[i]; cy+=f.pts[i+1]; cz+=f.pts[i+2]; cn++;}});
  if(cn>0){const tc=new THREE.Vector3(cx/cn,cy/cn,cz/cn); oc.target.copy(tc); cam3.position.set(tc.x,tc.y,tc.z+2); cam3.lookAt(tc); oc.update();}
  sts('3D REVIEW'); info(`${fc} frames · ${(pc/1000).toFixed(1)}k pts`);
}
function goPhase1Reset(){
  phase=1; adapted=false; fc=0; pc=0; integBusy=false; bakeQ=false; replayBusy=false; queuedPts=null; prevNorm=null;
  capturedFrames.forEach(f=>{if(f.cloud.parent)f.cloud.parent.remove(f.cloud)}); capturedFrames=[];
  while(ptGroup.children.length)ptGroup.remove(ptGroup.children[0]);
  if(reviewMesh){meshGroup.remove(reviewMesh);reviewMesh.geometry.dispose();reviewMesh=null}
  bbox={minX:1e9,maxX:-1e9,minY:1e9,maxY:-1e9,minZ:1e9,maxZ:-1e9};
  $('fdots').innerHTML=''; $('arcFill').setAttribute('stroke-dasharray','0 145'); $('arcTxt').textContent='0';
  hudKP=[]; stitchKP=[]; pKP=null; ghost.style.opacity='0'; snapTx=0; snapTy=0; coveredAngles=[]; lastQuality={blur:0,corners:0,exposure:0,score:0};
  glc.style.pointerEvents='none'; oc.enabled=false; $('p3').style.display='none'; $('p1').style.display='block'; $('rev').style.display='none';
  sts('READY TO SCAN'); info('Frame your object and tap START');
}

$('bBake').onclick=()=>{
  if(!worker||fc<2)return;
  if(replayBusy){info('Wait for TSDF ✔'); setTimeout(()=>$('bBake').click(),1000); return;}
  if(integBusy){bakeRetries++; if(bakeRetries>6){integBusy=false;bakeQ=false;bakeRetries=0; setTimeout(()=>$('bBake').click(),200); return;} info(`Finishing integration... (${bakeRetries}/6)`); setTimeout(()=>$('bBake').click(),700); return;}
  bakeRetries=0; sts('MARCHING CUBES...'); info('building mesh...'); $('bBake').disabled=true; bakeQ=true; integBusy=true;
  worker.postMessage({type:'march',data:{iso:parseInt($('sliso').value),minW:1}});
};

// TAUBIN SMOOTHING ALGORITHM
function smoothMeshTaubin(v, passes){
  const cnt=v.length/3|0; const p=new Float32Array(v), acc=new Float32Array(cnt*3), cnt2=new Uint32Array(cnt);
  const apply=(scale)=>{
    acc.fill(0); cnt2.fill(0);
    for(let i=0;i<cnt*3;i+=9){
      for(const[vi,n1,n2]of[[i,i+3,i+6],[i+3,i,i+6],[i+6,i,i+3]]){
        acc[vi]+=p[n1]+p[n2]; acc[vi+1]+=p[n1+1]+p[n2+1]; acc[vi+2]+=p[n1+2]+p[n2+2]; cnt2[vi/3]+=2;
      }
    }
    for(let i=0;i<cnt;i++){
      if(!cnt2[i])continue; const f=1/cnt2[i];
      p[i*3] += scale*(acc[i*3]*f - p[i*3]); p[i*3+1] += scale*(acc[i*3+1]*f - p[i*3+1]); p[i*3+2] += scale*(acc[i*3+2]*f - p[i*3+2]);
    }
  };
  for(let k=0;k<passes;k++){ apply(0.52); apply(-0.53); } // lambda, mu
  return p;
}

function dlSTL(v){
  const n=v.length/9|0, buf=new ArrayBuffer(84+n*50), dv2=new DataView(buf), h=new TextEncoder().encode('P3dK Scanner PRO');
  for(let i=0;i<Math.min(80,h.length);i++)dv2.setUint8(i,h[i]); dv2.setUint32(80,n,true); let o=84;
  for(let i=0;i<n;i++){
    const b=i*9, ax=v[b], ay=v[b+1], az=v[b+2], bx=v[b+3], by=v[b+4], bz=v[b+5], cx=v[b+6], cy=v[b+7], cz=v[b+8];
    const ux=bx-ax, uy=by-ay, uz=bz-az, vx=cx-ax, vy=cy-ay, vz2=cz-az;
    const qx=uy*vz2-uz*vy, qy=uz*vx-ux*vz2, qz=ux*vy-uy*vx, ql=Math.hypot(qx,qy,qz)||1;
    dv2.setFloat32(o,qx/ql,true); dv2.setFloat32(o+4,qy/ql,true); dv2.setFloat32(o+8,qz/ql,true); o+=12;
    dv2.setFloat32(o,ax,true); dv2.setFloat32(o+4,ay,true); dv2.setFloat32(o+8,az,true); o+=12;
    dv2.setFloat32(o,bx,true); dv2.setFloat32(o+4,by,true); dv2.setFloat32(o+8,bz,true); o+=12;
    dv2.setFloat32(o,cx,true); dv2.setFloat32(o+4,cy,true); dv2.setFloat32(o+8,cz,true); o+=12; dv2.setUint16(o,0,true); o+=2;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buf],{type:'application/octet-stream'}));
  a.download='p3dk-'+new Date().toISOString().slice(0,16).replace(/[-:T]/g,'').slice(0,12)+'.stl'; a.click();
}

$('bStart').onclick=()=>goPhase2(); $('bCapture').onclick=()=>captureFrame(); $('bDone').onclick=()=>goPhase3(); $('bStop').onclick=()=>{ghost.style.opacity='0';goPhase1Reset()};
$('bMore').onclick=async()=>{
  phase=2; glc.style.pointerEvents='none'; oc.enabled=false; $('p3').style.display='none'; $('p1').style.display='none'; $('p2').style.display='block'; $('instr').style.display='block';
  try{await startCamera()}catch(e){} requestAnimationFrame(trackLoop); sts('SCANNING'); info('Add more frames · tap CAPTURE');
};
$('bDiscard').onclick=()=>goPhase1Reset();
$('cbWire').addEventListener('change',()=>{if(reviewMesh){reviewMesh.material.wireframe=$('cbWire').checked;reviewMesh.material.needsUpdate=true}});
window.resizePts=()=>capturedFrames.forEach(f=>f.cloud.material.size=parseFloat($('slps').value));

async function startCamera(){
  if(vid.srcObject){vid.srcObject.getTracks().forEach(t=>t.stop());vid.srcObject=null;await new Promise(r=>setTimeout(r,200))}
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1080}}});
  vid.srcObject=stream; await new Promise((res,rej)=>{vid.onloadedmetadata=()=>vid.play().then(res).catch(rej);vid.onerror=rej}); chip('cCA','ok','CAM ✔');
}

async function boot(){
  sts('LOADING NEURAL DEPTH...'); info('Depth Anything V2 — first load ~26MB'); pb.style.transition='none'; pb.style.width='5%';
  try{await startCamera();}catch(e){chip('cCA','warn','CAM ✗');info('Camera failed: '+e.message.slice(0,40))}
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function') await DeviceOrientationEvent.requestPermission().catch(()=>{});
    window.addEventListener('deviceorientation',e=>{
      if(!e.alpha&&!e.beta&&!e.gamma)return; hasGyro=true; chip('cGY','ok','Gyro ✔');
      const a=e.alpha?THREE.MathUtils.degToRad(e.alpha):0, b=e.beta?THREE.MathUtils.degToRad(e.beta):0, g2=e.gamma?THREE.MathUtils.degToRad(e.gamma):0;
      dQ.setFromEuler(new THREE.Euler(b,a,-g2,'YXZ')); dQ.multiply(new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)));
      dQ.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),-(window.orientation?THREE.MathUtils.degToRad(window.orientation):0)));
    });
  }catch(e){chip('cGY','off','Gyro ✗')}
  try{
    depthPipe=await pipeline('depth-estimation','onnx-community/depth-anything-v2-small',{
      progress_callback:p=>{if(p.status==='downloading'||p.status==='loading') pb.style.width=(5+(p.progress??50)*.9)+'%';}
    });
    pb.style.width='100%'; setTimeout(()=>pb.style.width='0%',600); sts('READY TO SCAN'); info('Frame your object and tap START'); $('bStart').disabled=false;
  }catch(e){sts('MODEL FAILED — reload'); info(e.message.slice(0,50)); console.error(e)}
  window.addEventListener('resize',()=>{cam3.aspect=innerWidth/innerHeight; cam3.updateProjectionMatrix(); rend.setSize(innerWidth,innerHeight); hud.width=innerWidth; hud.height=innerHeight;});
}
boot();
